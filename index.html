// History page — leads with the thing actually asked for: per account,
// "records now reach up to X" — i.e. the newest transaction date/time on
// file for each account, which is what changes every time a screenshot or
// CSV gets uploaded for that account. Below it, the raw reverse-chronological
// edit log (see ACTIVITY_LOG_SHEET in Code.gs) — only starts from when that
// feature was added, so it won't show anything from before today.
// The manual counterpart to confirmTbcIfMatches_() (Code.gs) — that backend
// rule only clears a TBC row automatically when a real import exactly
// matches it (same account/date/amount). This section lists every row
// still marked "*TBC" so you can close it out by hand instead: Confirm if
// you know it actually happened as guessed, or Delete if it turns out
// wrong (e.g. you didn't actually reload that day) — either way the yellow
// "!" on the Main page disappears once it's off this list.
function renderReviewList() {
  const label = document.getElementById('reviewSectionLabel');
  const el = document.getElementById('reviewList');
  const unconfirmed = allTxns.filter(t => t.remark && t.remark.indexOf('*TBC') === 0)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  // "Unsure" transactions still count normally everywhere else (Main,
  // Insights totals/charts) — this section is just a reminder list so they
  // don't get forgotten, using the same full row (with its category
  // dropdown) as the Main list so fixing one is a single tap, no separate
  // screen needed. Transfer > To Others rows are included here too — a
  // generic "sent to someone" leg is just as much a "figure out what this
  // actually was" case as Unsure, so it gets the same nudge instead of
  // quietly sitting under Transfer forever.
  const unsure = allTxns.filter(t => t.category === 'Unsure' || (t.category === 'Transfer' && t.subTag === 'To Others'))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const badge = document.getElementById('reviewTabBadge');
  const badgeCount = unconfirmed.length + unsure.length;
  if (badge) {
    badge.textContent = badgeCount ? String(badgeCount) : '';
    badge.style.display = badgeCount ? '' : 'none';
  }

  const unsureLabel = document.getElementById('unsureSectionLabel');
  const unsureEl = document.getElementById('unsureList');
  if (!unsure.length) {
    unsureLabel.textContent = 'Needs category';
    unsureEl.innerHTML = '<div class="empty">Nothing marked Unsure right now.</div>';
  } else {
    unsureLabel.textContent = `Needs category (${unsure.length})`;
    unsureEl.innerHTML = unsure.map(renderTxnRow).join('');
    // Re-bind the shared row handlers so these newly-inserted rows get a
    // working category dropdown / remark button / remark-link click, same
    // as every row on the Main list.
    attachCatSelectHandlers();
    attachExtraTagHandlers();
    attachExtraTagAmountHandlers();
    attachRemarkHandlers();
    attachLinkHandlers();
  }

  el.style.display = '';
  if (!unconfirmed.length) {
    label.textContent = 'Needs review';
    el.innerHTML = '<div class="empty">Nothing needs review right now.</div>';
    return;
  }
  label.textContent = `Needs review (${unconfirmed.length})`;

  el.innerHTML = unconfirmed.map(t => {
    const { sign, cls: amtClass } = txnSignInfo(t);
    return `
    <div class="review-entry" data-row="${t.row}">
      <div class="review-top">
        <div class="review-title">${escapeHtml(txnTitle(t))}</div>
        <div class="${amtClass} review-amount">${sign}RM${Number(t.amount || 0).toFixed(2)}</div>
      </div>
      <div class="review-meta">${new Date(t.date).toLocaleDateString()} · ${escapeHtml(t.account || '')} · <span class="tbc-flag">${escapeHtml(tbcPairLabel(t))}</span></div>
      <div class="review-note">${escapeHtml(t.remark)}</div>
      <div class="review-actions">
        <button class="review-btn confirm" data-row="${t.row}">Confirm</button>
        <button class="review-btn delete" data-row="${t.row}">Delete</button>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.review-btn.confirm').forEach(btn => {
    btn.onclick = async () => {
      const row = Number(btn.dataset.row);
      btn.disabled = true;
      btn.textContent = 'Confirming…';
      const today = new Date().toISOString().slice(0, 10);
      await callApi('updateRemark', { row, remark: 'Confirmed manually on ' + today });
      await loadData();
    };
  });
  el.querySelectorAll('.review-btn.delete').forEach(btn => {
    btn.onclick = async () => {
      const row = Number(btn.dataset.row);
      if (!confirm('Delete this record permanently? This can\'t be undone.')) return;
      btn.disabled = true;
      btn.textContent = 'Deleting…';
      await callApi('deleteTransaction', { row });
      await loadData();
    };
  });
}

function renderHistory() {
  const summaryEl = document.getElementById('historySummary');
  summaryEl.innerHTML = ACCOUNTS.map(a => {
    // Screenshot imports are meant as a quick daily activity log, not a full
    // reconciliation — they still show up in Recent activity below, but
    // don't count toward "when was this account last properly updated"
    // (that's reserved for a real statement/CSV import, which double-checks
    // the whole record). Manual "Add expense" entries do count, same as
    // before.
    const nonScreenshot = allTxns.filter(t => t.account === a && !/Screenshot/i.test(t.source || ''));
    const label = lastUpdatedLabel(nonScreenshot) || 'No records yet';
    return `<div class="history-summary-row"><span class="acct">${escapeHtml(a)}</span><span class="when">${escapeHtml(label)}</span></div>`;
  }).join('');

  const el = document.getElementById('historyList');
  if (!activityLog.length) {
    el.innerHTML = '<div class="empty">No history yet — new edits will show up here.</div>';
    return;
  }
  el.innerHTML = activityLog.map(h => {
    const d = new Date(h.timestamp);
    const when = isNaN(d.getTime())
      ? h.timestamp
      : d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    // Entries tied to one specific transaction (a manual add, a single
    // confirm/edit) carry a row number from the backend — those are
    // clickable and jump straight to that record on the Main page. Bulk
    // entries (an import of N rows, an auto-reconcile pass) aren't tied to
    // a single record, so they're plain text.
    const hasRow = h.row !== undefined && h.row !== null && h.row !== '';
    return `<div class="history-entry${hasRow ? ' linked' : ''}"${hasRow ? ` data-row="${h.row}"` : ''}>
      <div class="history-top"><span class="history-action">${escapeHtml(h.action)}</span><span class="history-time">${when}</span></div>
      <div class="history-details">${escapeHtml(h.details)}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.history-entry.linked').forEach(entry => {
    entry.onclick = () => jumpToRecord(Number(entry.dataset.row));
  });
}

// Jumps to a specific transaction on the Main page from a "Recent activity"
// entry (or anywhere else with a row number) — clears whatever filters
// would otherwise hide it, scrolls it into view, and flashes it blue so
// it's easy to spot.
function jumpToRecord(row) {
  const t = allTxns.find(x => x.row === row);
  if (!t) return;
  activeAccountFilter = 'All';
  activeFilter = 'All';
  activeSubFilter = 'All';
  searchQuery = '';
  const searchBox = document.getElementById('searchBox');
  if (searchBox) searchBox.value = '';
  mainRangeFrom = null;
  mainRangeTo = null;
  if (typeof renderMainRangeButtons === 'function') renderMainRangeButtons();
  if (groupMode !== 'none') expandedGroups.add(groupKeyFor(t));
  switchPage('main');
  render(); // switchPage() only toggles which page div is visible — it doesn't
  // re-render the Main list, so without this the list would still show
  // whatever it last rendered (e.g. the target's day-group still collapsed).
  requestAnimationFrame(() => {
    const rowEl = document.querySelector(`.txn[data-row="${row}"]`);
    if (!rowEl) return;
    rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    rowEl.classList.add('jump-highlight');
    setTimeout(() => rowEl.classList.remove('jump-highlight'), 1600);
  });
}

function isSameDay(d, ref) {
  return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth() && d.getDate() === ref.getDate();
}
function startOfWeek(d) {
  const r = new Date(d);
  const day = (r.getDay() + 6) % 7; // Monday start
  r.setDate(r.getDate() - day);
  r.setHours(0,0,0,0);
  return r;
}

// Which time window the pies (big + mini) are scoped to — null means all
// time (no scoping). Set by tapping one of the Today/This week/This month
// cards below; tapping the already-active one clears it back to all time.
let activeTimeFilter = 'all'; // null | 'today' | 'week' | 'month' | 'all' — the
// "All time" card is now the first thing on the Main page, and defaults to
// active, so the pie charts open showing your whole history rather than
// just this month. Tap Today/This week/This month to narrow it, tap
// whichever card is active to go back to all-time.

function isInTimeFilter(t) {
  if (!activeTimeFilter) return true;
  const now = new Date();
  const d = new Date(t.date);
  if (activeTimeFilter === 'today') return isSameDay(d, now);
  if (activeTimeFilter === 'week') return d >= startOfWeek(now);
  if (activeTimeFilter === 'month') return d >= new Date(now.getFullYear(), now.getMonth(), 1);
  return true;
}

// "Updated 30 Jul, 14:47" — the date+time of the most recent transaction in
// the whole dataset (across every account), shown under the Today card so
// it's obvious how fresh the data is, separate from what today's spend
// total actually is.
function lastUpdatedLabel(base) {
  const pool = base || allTxns;
  if (!pool.length) return '';
  let latest = null;
  pool.forEach(t => {
    const dt = new Date(t.date + 'T' + (t.time || '00:00'));
    if (!isNaN(dt.getTime()) && (!latest || dt > latest)) latest = dt;
  });
  if (!latest) return '';
  return 'Updated ' + latest.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) +
    ', ' + latest.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function renderTotals(txns, incomeTxns) {
  const now = new Date();
  const weekStart = startOfWeek(now);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

  const sum = (filterFn) => txns.filter(filterFn).reduce((s, t) => s + expenseTotalAmount(t), 0);

  const today = sum(t => isSameDay(new Date(t.date), now));
  const week = sum(t => new Date(t.date) >= weekStart);
  const month = sum(t => new Date(t.date) >= monthStart);
  const allTime = sum(() => true);
  // All time also shows its Income total (unlike Today/Week/Month, which
  // stay pure-expense to match the compact card style) — incomeTxns is the
  // same account/category/search/date-range-filtered pool as txns, just
  // without the Income-category exclusion, passed in from render(). Only
  // meaningful on the "All categories" view, same as the Overall Expense/
  // Income split above it.
  const allTimeIncome = (incomeTxns || []).reduce((s, t) => s + Number(t.amount || 0), 0);

  const todayDateLabel = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
  const fmtShort = (d) => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const weekRangeLabel = `${fmtShort(weekStart)} - ${fmtShort(weekEnd)}`;

  const cardActive = (scope) => activeTimeFilter === scope ? ' active' : '';
  document.getElementById('totals').innerHTML = `
    <div class="total-card${cardActive('today')}" data-scope="today"><div class="label">Today</div><div class="value">${formatSignedRM(today)}</div><div class="sub">${todayDateLabel}</div><div class="sub">${lastUpdatedLabel()}</div></div>
    <div class="total-card${cardActive('week')}" data-scope="week"><div class="label">This week</div><div class="value">${formatSignedRM(week)}</div><div class="sub">${weekRangeLabel}</div></div>
    <div class="total-card${cardActive('month')}" data-scope="month"><div class="label">This month</div><div class="value">${formatSignedRM(month)}</div></div>
  `;
  // All time gets its own wide rectangle below, showing Expense (red) and
  // Income (green) side by side at the same size — rather than being
  // squeezed into a 4th card with a single net number, it now answers the
  // same question the Overall Expense/Income split does, just for all-time
  // instead of whichever period is selected there.
  document.getElementById('totalsAll').innerHTML = `
    <div class="total-card-all${cardActive('all')}" data-scope="all">
      <div class="label">All time</div>
      <div class="total-all-row">
        <div class="total-all-col"><span class="total-all-label">Expense</span><span class="total-all-value expense">${formatSignedRM(allTime)}</span></div>
        <div class="total-all-col"><span class="total-all-label">Income</span><span class="total-all-value income">+RM${allTimeIncome.toFixed(2)}</span></div>
      </div>
    </div>
  `;
  // Tapping a card scopes the pies (big + mini, see renderCharts()) to that
  // period; tapping the same card again clears back to all-time. This is
  // purely a pie-scoping control — the totals cards themselves always show
  // their own fixed period regardless, and the transaction list below isn't
  // affected. "All time" behaves the same as no filter for pie-scoping
  // purposes (see isInTimeFilter() treating 'all' same as null) — it just
  // gets its own explicit scope name so it's directly tappable/highlightable
  // instead of only reachable by toggling another card off.
  document.querySelectorAll('#totals .total-card, #totalsAll .total-card-all').forEach(el => {
    el.onclick = () => {
      const scope = el.dataset.scope;
      activeTimeFilter = activeTimeFilter === scope ? null : scope;
      render();
    };
  });
}

// Semantic palette: categories that are always spending get warm red/orange
// tones (Car/Food/Shopping/Entertainment/Housing), Transfer stays neutral
// grey since money moves either direction, and Unsure stays purple as a
// "needs review" flag.
const CHART_COLORS = {
  Car: '#ff453a', Shopping: '#ff9f0a', Food: '#ff6b35', Entertainment: '#ffd60a',
  Housing: '#ff7a9c', Unsure: '#bf5af2', Transfer: '#8e8e93', Income: '#30d158'
};

// Not real spending — Transfer covers wallet top-ups (Card Reload), P2P
// sends (To Others), inter-account movement (To Bank B/From Bank A/To TNG/
// Internal); Income covers real external money in (Salary, Interest, and
// other bank credits) that TNG never had. Tracked and filterable like any
// other category, but left out of the "All" totals/pie so none of this
// inflates spend numbers.
const NON_SPEND_CATEGORIES = ['Transfer', 'Income'];
function colorFor(key) { return CHART_COLORS[key] || '#8e8e93'; }

// Subtag palette used when a single category is selected (e.g. Car ->
// Toll/Parking/Fuel/Service/Ride) so the donut breaks down further instead
// of collapsing into one slice. Transfer's subtags are all grey shades since
// the category itself is neutral regardless of which subtag.
const SUBTAG_COLORS = {
  Toll: '#0a84ff', Parking: '#64d2ff', Fuel: '#5e5ce6', Service: '#30d5ff', Ride: '#ff6961',
  'Convenience Store': '#34c759', Hypermarket: '#30d158', Pharmacies: '#ff2d55', 'Personal Care': '#ff9500',
  Subscription: '#ff6482',
  Rent: '#30b0c7', 'Water & Electric': '#64d2ff', WiFi: '#5e5ce6', 'Carpark Rent': '#0a84ff',
  Invest: '#ff453a',
  // Yellow (matches .dot.Reload) — internal transfers of your own money,
  // called out distinctly from the neutral greys below.
  'Card Reload': '#ffcc00', 'TNG Card Top-up': '#ffcc00', 'To Others': '#8e8e93', 'From Others': '#636366', 'Internal': '#48484a',
  Salary: '#30d158', Interest: '#64d2ff', Other: '#bf5af2', Others: '#8e8e93'
};
function colorForSub(key) { return SUBTAG_COLORS[key] || '#8e8e93'; }

// Strips anything that isn't a letter/digit, for building a DOM-id-safe
// suffix out of an account name (e.g. "Bank A" -> "BankA").
function cssSafe(s) { return String(s).replace(/[^a-zA-Z0-9]/g, ''); }

function searchFilter(txns) {
  if (!searchQuery) return txns;
  const q = searchQuery.toLowerCase();
  return txns.filter(t =>
    (t.merchant || '').toLowerCase().includes(q) ||
    (t.notes || '').toLowerCase().includes(q) ||
    (t.remark || '').toLowerCase().includes(q) ||
    (t.subTag || '').toLowerCase().includes(q)
  );
}

// Given a "base" pool of transactions (already scoped to whichever account
// this particular pie represents — allTxns for the combined pie, or one
// account's slice for a mini pie), applies the time/category/search
// narrowing a pie should reflect. Mirrors the exact same category/All +
// search rules the transaction list/totals use, just parametrized by base
// so it can run once for the combined pie and once per mini pie.
function chartTxnsFor(base) {
  const scoped = base.filter(isInTimeFilter);
  if (activeFilter === 'All') {
    return searchFilter(scoped).filter(t => !NON_SPEND_CATEGORIES.includes(t.category));
  }
  return scoped.filter(t => t.category === activeFilter);
}

// Same idea, but for the Income category specifically — used alongside
// chartTxnsFor (which deliberately excludes Income, same as spend totals)
// to build the Expense/Income/Balance trio shown on the "Overall" pie.
function incomeTxnsFor(base) {
  return searchFilter(base.filter(isInTimeFilter)).filter(t => t.category === 'Income');
}

// Expense/Income/Balance for whichever base pool (allTxns for the combined
// pie, or one account's slice for a mini pie) — Balance is simply Income
// minus Expense for the currently selected time window (Today/This week/
// This month/all-time), not a real running account balance.
function statsFor(base) {
  const expense = chartTxnsFor(base).reduce((s, t) => s + expenseTotalAmount(t), 0);
  const income = incomeTxnsFor(base).reduce((s, t) => s + Number(t.amount || 0), 0);
  return { expense, income, balance: income - expense };
}

// txns: rows to chart. highlightKey: when set to a specific subtag (not
// 'All'), the pie still shows every subtag slice for the category — it does
// NOT collapse down to just that one slice — but only the selected slice
// keeps its real color; every other slice is greyed out. This way tapping a
// sub-filter chip highlights where that subtag sits within the whole
// category instead of hiding the rest of the picture.
// opts: { titleEl, totalEl, legend } — titleEl/totalEl are optional element
// ids to update with the "By category"/"By type" label and the RM total;
// legend controls whether Chart.js draws its own bottom legend (only the
// big combined pie has room for one — the mini pies are too small).
function renderChartOn(canvasId, txns, highlightKey, opts) {
  opts = opts || {};
  // When viewing a single category, break the donut down by subTag instead
  // of category (every row would otherwise share the same category label
  // and collapse into a single slice). Income mode (see the Expense/Income
  // toggle on the Overall pie) always breaks down by subTag too — Income
  // only has one "category" so a by-category pie would just be one slice.
  const bySubTag = opts.incomeMode || activeFilter !== 'All';
  // Food has no subtags of its own (see CATEGORY_OPTIONS) — grouping by
  // subTag there would just dump every row into one "Others" slice. Instead
  // group by merchant name for VIEWING only (no subtag is written back to
  // the data): a shop visited 2+ times gets its own slice, anything visited
  // once pools into "Others" so one-off purchases don't clutter the chart
  // with dozens of tiny slivers.
  const isFoodMerchantMode = !opts.incomeMode && activeFilter === 'Food';
  // A Housing row that covers two things at once (e.g. one payment for both
  // Rent + WiFi, see the "+ tag" extraTag feature) still counts once in the
  // data under its one primary subTag — but for VIEWING here, attribute the
  // exact amount given for the tag (extraTagAmount) to that slice, with the
  // remainder to the primary subtag. Falls back to an even 50/50 split when
  // no specific amount was given, same as before this field existed.
  const isHousingSplitMode = !opts.incomeMode && activeFilter === 'Housing';
  const totals = {};
  if (isFoodMerchantMode) {
    const counts = {};
    txns.forEach(t => {
      const m = (t.merchant || '').trim() || 'Others';
      counts[m] = (counts[m] || 0) + 1;
    });
    txns.forEach(t => {
      const m = (t.merchant || '').trim() || 'Others';
      const key = counts[m] >= 2 ? m : 'Others';
      totals[key] = (totals[key] || 0) + spendAmount(t);
    });
  } else if (isHousingSplitMode) {
    txns.forEach(t => {
      const amt = spendAmount(t);
      const primary = t.subTag || 'Others';
      if (t.extraTag) {
        const hasAmount = t.extraTagAmount !== null && t.extraTagAmount !== undefined && t.extraTagAmount !== '' && t.extraTagAmount > 0 && t.extraTagAmount < amt;
        const tagAmt = hasAmount ? Number(t.extraTagAmount) : amt / 2;
        totals[primary] = (totals[primary] || 0) + (amt - tagAmt);
        totals[t.extraTag] = (totals[t.extraTag] || 0) + tagAmt;
      } else {
        totals[primary] = (totals[primary] || 0) + amt;
      }
    });
  } else {
    txns.forEach(t => {
      const key = bySubTag ? (t.subTag || 'Others') : t.category;
      totals[key] = (totals[key] || 0) + spendAmount(t);
    });
  }
  const labels = Object.keys(totals);
  const values = labels.map(l => totals[l]);
  const grand = values.reduce((a, b) => a + b, 0);
  // Merchant names (Food mode) aren't in the static subtag palette, so hash
  // them to a color deterministically instead — keeps the same shop the
  // same color across renders without hardcoding every merchant by name.
  const MERCHANT_PALETTE = ['#0a84ff', '#30d158', '#ff9f0a', '#bf5af2', '#64d2ff', '#ff375f', '#ffd60a', '#5e5ce6', '#ff6961', '#34c759'];
  function merchantColor(label) {
    if (label === 'Others') return '#8e8e93';
    let h = 0;
    for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
    return MERCHANT_PALETTE[h % MERCHANT_PALETTE.length];
  }
  const colorFn = isFoodMerchantMode ? merchantColor : (bySubTag ? colorForSub : colorFor);
  const GREYED_OUT = '#3a3a3c';
  const isHighlighting = !opts.incomeMode && bySubTag && !isFoodMerchantMode && highlightKey && highlightKey !== 'All';

  if (opts.titleEl) document.getElementById(opts.titleEl).textContent = opts.incomeMode ? 'Income' : (isFoodMerchantMode ? 'By shop' : (bySubTag ? 'By type' : 'Overall'));
  if (opts.totalEl) {
    const totalEl = document.getElementById(opts.totalEl);
    if (totalEl) totalEl.textContent = 'RM' + grand.toFixed(2);
  }

  const canvasEl = document.getElementById(canvasId);
  if (!canvasEl) return;
  const ctx = canvasEl.getContext('2d');
  const data = {
    labels: labels.length ? labels : ['No data'],
    datasets: [{
      data: labels.length ? values : [1],
      backgroundColor: labels.length
        ? labels.map(l => isHighlighting ? (l === highlightKey ? colorFn(l) : GREYED_OUT) : colorFn(l))
        : ['#2c2c2e'],
      borderWidth: 0
    }]
  };
  if (chartInstances[canvasId]) {
    chartInstances[canvasId].data = data;
    chartInstances[canvasId].update();
  } else if (window.Chart) {
    chartInstances[canvasId] = new Chart(ctx, {
      // The big combined "Overall" chart renders as a full pie (opts.pie) —
      // the per-account mini charts stay doughnuts so their center hole
      // still has room for the RM total text overlay.
      type: opts.pie ? 'pie' : 'doughnut',
      data,
      options: {
        responsive: true, maintainAspectRatio: false, cutout: opts.pie ? '0%' : '65%',
        plugins: {
          legend: opts.legend
            ? { position: 'bottom', labels: { color: '#f5f5f7', boxWidth: 10, font: { size: 11 } } }
            : { display: false },
          tooltip: {
            callbacks: {
              label: (c) => (c.label ? c.label + ': ' : '') + formatSignedRM(Number(c.parsed))
            }
          }
        }
      }
    });
  }
}

// The big "Overall" pie always reflects ALL 3 accounts combined, regardless
// of the Account filter chips — it's a constant whole-picture reference
// point. Below it, a row of mini pies shows the per-account breakdown: one
// each for TNG/HL Bank/PBank when the Account filter is "All", or just the
// one selected account (bigger) when you've drilled into a specific account
// — i.e. picking an account "zooms" the mini row down to that account
// instead of touching the combined pie above it. Both the big pie and the
// minis are further scoped by activeTimeFilter (Today/This week/This
// month/all-time) via chartTxnsFor()/statsFor().
function renderCharts() {
  const modeToggleEl = document.getElementById('chartModeToggle');
  if (modeToggleEl) modeToggleEl.style.display = activeFilter === 'All' ? 'flex' : 'none';

  if (activeFilter === 'All' && overallChartMode === 'income') {
    renderChartOn('chart', incomeTxnsFor(allTxns), 'All', {
      titleEl: 'chartTitle', totalEl: 'chartTotal', legend: true, pie: true, incomeMode: true
    });
  } else {
    renderChartOn('chart', chartTxnsFor(allTxns), activeSubFilter, {
      titleEl: 'chartTitle', totalEl: 'chartTotal', legend: true, pie: true
    });
  }
  updateBigStats(allTxns);
  document.getElementById('chartLoading').classList.remove('show');

  const container = document.getElementById('miniCharts');

  // innerHTML replacement below destroys every existing canvas node (even
  // ones for accounts still shown), so every mini Chart.js instance has to
  // be torn down and rebuilt from scratch each render — otherwise Chart.js
  // is left holding a reference to a canvas that's no longer in the DOM.
  Object.keys(chartInstances).forEach(id => {
    if (id.indexOf('miniChart-') === 0) {
      chartInstances[id].destroy();
      delete chartInstances[id];
    }
  });

  const toggleBtn = document.getElementById('miniChartsToggleBtn');
  if (toggleBtn) toggleBtn.textContent = miniChartsExpanded ? 'Hide account breakdown ▾' : 'Show account breakdown ▸';

  // Collapsed by the shared toggle above — TNG and Banks hide/show together
  // as one unit (see miniChartsExpanded).
  if (!miniChartsExpanded) {
    container.style.display = 'none';
    container.innerHTML = '';
    return;
  }

  // While a text search is active (including the remark-link "group by
  // note" feature), the per-account mini pies would each get re-scoped down
  // to just the 1-2 matching rows — mostly empty/meaningless rings. Simpler
  // to just hide the whole mini-pie row until the search is cleared; the
  // combined pie above still reflects the search results.
  if (searchQuery) {
    container.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  container.style.display = '';

  // On the overview (Account filter = All), HL Bank + PBank collapse into
  // one combined "Banks" pie for viewing — day-to-day they're both just
  // "the bank" — while every backend field/filter still keeps them fully
  // separate. Tapping the HL Bank or PBank chip individually still zooms
  // into just that one account, unmerged, same as before.
  const groupsToShow = activeAccountFilter === 'All'
    ? MINI_PIE_GROUPS
    : [{ label: activeAccountFilter, accounts: [activeAccountFilter] }];
  container.classList.toggle('zoomed', activeAccountFilter !== 'All');

  container.innerHTML = groupsToShow.map(g => `
    <div class="mini-chart-card">
      <div class="mini-chart-head"><span>${g.label}</span><span id="miniTotal-${cssSafe(g.label)}"></span></div>
      <div class="mini-chart-wrap">
        <canvas id="miniChart-${cssSafe(g.label)}"></canvas>
        <div class="chart-loading"><div class="spinner"></div></div>
      </div>
      <div class="mini-chart-truebalance" id="miniTrue-${cssSafe(g.label)}"></div>
      <div class="mini-chart-updated" id="miniTrueUpdated-${cssSafe(g.label)}"></div>
      ${g.accounts.includes('TNG') ? `<div class="mini-chart-truebalance" id="miniCardTrue-TNG"></div><div class="mini-chart-updated" id="miniCardTrueUpdated-TNG"></div>` : ''}
    </div>
  `).join('');

  groupsToShow.forEach(g => {
    const acctTxns = allTxns.filter(t => g.accounts.includes(t.account));
    renderChartOn('miniChart-' + cssSafe(g.label), chartTxnsFor(acctTxns), activeSubFilter, {
      totalEl: 'miniTotal-' + cssSafe(g.label), legend: false
    });
    // On the "All categories" view, the mini pie's head number is that
    // account/group's Income-Expense net flow for whichever period is
    // selected (Today/This week/This month/all-time via activeTimeFilter) —
    // "how much did I use or earn" for that window. The account's REAL
    // current balance is a separate, always-current figure shown below the
    // pie instead (see trueEl below) so the two don't get conflated. When a
    // specific category is selected, leave the plain Expense-only total
    // renderChartOn wrote as-is.
    if (activeFilter === 'All') {
      const { balance } = statsFor(acctTxns);
      const el = document.getElementById('miniTotal-' + cssSafe(g.label));
      if (el) {
        el.textContent = (balance < 0 ? '-RM' : '+RM') + Math.abs(balance).toFixed(2);
        el.className = balance < 0 ? 'negative' : 'positive';
      }
    }
    // Real running balance — the account's actual current money (anchor +
    // every transaction since), not the period net flow shown up top.
    // Colored green/red by sign (instead of the same muted grey as the
    // "Updated" line right below it) so it reads as its own real figure,
    // not just a caption. For a merged group (Banks) the per-account split
    // is spelled out in the same line so merging the view never hides which
    // bank actually holds what. Only shows for accounts with an anchor set
    // (see trueBalanceFor()) — Cash intentionally has none, so it's blank.
    const trueEl = document.getElementById('miniTrue-' + cssSafe(g.label));
    if (trueEl) {
      const balances = g.accounts.map(a => ({ a, b: trueBalanceFor(a) })).filter(x => x.b !== null);
      if (!balances.length) {
        trueEl.textContent = '';
        trueEl.classList.remove('positive', 'negative');
      } else {
        const total = balances.reduce((s, x) => s + x.b, 0);
        trueEl.textContent = g.accounts.length === 1
          ? 'Balance: RM' + total.toFixed(2)
          : `Balance: RM${total.toFixed(2)} (${balances.map(x => `${x.a} RM${x.b.toFixed(2)}`).join(' + ')})`;
        trueEl.classList.toggle('positive', total >= 0);
        trueEl.classList.toggle('negative', total < 0);
      }
    }
    const trueUpdatedEl = document.getElementById('miniTrueUpdated-' + cssSafe(g.label));
    if (trueUpdatedEl) {
      const dates = g.accounts.map(a => { const anc = accountBalances.find(b => b.account === a); return anc ? anc.asOfDate : null; }).filter(Boolean);
      trueUpdatedEl.textContent = dates.length ? formatAnchorDate(dates.sort().slice(-1)[0]) : '';
    }
    // TNG's physical Card balance shows as a second line right under the
    // eWallet Balance line. Now backed by the Card's own real transactions
    // (see "TNG Card (PDF or CSV)" import) — both reload-in and
    // parking/spend-out — rather than the old top-ups-only guess.
    if (g.accounts.includes('TNG')) {
      const cardEl = document.getElementById('miniCardTrue-TNG');
      if (cardEl) {
        const cardBal = trueBalanceFor('TNG Card');
        cardEl.textContent = cardBal === null ? '' : 'Card: RM' + cardBal.toFixed(2);
        cardEl.title = 'Physical TNG Card balance — from Card statement imports (reloads + parking spend).';
        cardEl.classList.toggle('positive', cardBal !== null && cardBal >= 0);
        cardEl.classList.toggle('negative', cardBal !== null && cardBal < 0);
      }
      const cardUpdatedEl = document.getElementById('miniCardTrueUpdated-TNG');
      if (cardUpdatedEl) {
        const cardAnchor = accountBalances.find(b => b.account === 'TNG Card');
        cardUpdatedEl.textContent = cardAnchor ? formatAnchorDate(cardAnchor.asOfDate) : '';
      }
    }
  });
}

// Fills in the Expense/Income/Balance trio (shown only on the "Overall" —
// i.e. all-categories — view) and toggles it against the plain single RM
// total renderChartOn already wrote for the "By type" (one category
// selected) view.
// Which of Expense/Income/Balance is currently expanded to show its
// per-account breakdown (see renderStatBreakdown below) — null means none
// are open. Persists across re-renders so it stays open while you tap
// Today/This week/This month.
let openStatBreakdown = null;

function formatStatValue(stat, v) {
  if (stat === 'balance') return (v < 0 ? '-RM' : '+RM') + Math.abs(v).toFixed(2);
  if (stat === 'expense') return formatSignedRM(v); // spend-positive -> "-RM", matches every other total
  return 'RM' + v.toFixed(2);
}

function updateBigStats(base) {
  const statsEl = document.getElementById('chartStats');
  const totalEl = document.getElementById('chartTotal');
  const breakdownEl = document.getElementById('statBreakdown');
  if (activeFilter !== 'All') {
    statsEl.style.display = 'none';
    totalEl.style.display = '';
    breakdownEl.classList.remove('show');
    return;
  }
  totalEl.style.display = 'none';
  statsEl.style.display = 'flex';
  const { expense, income } = statsFor(base);
  const balance = currentBalanceTotal();
  document.getElementById('statExpense').textContent = formatSignedRM(expense);
  document.getElementById('statIncome').textContent = 'RM' + income.toFixed(2);
  const balEl = document.getElementById('statBalance');
  balEl.textContent = (balance < 0 ? '-RM' : '+RM') + Math.abs(balance).toFixed(2);
  balEl.className = 'stat-value ' + (balance < 0 ? 'negative' : 'positive');

  document.querySelectorAll('#chartStats .stat').forEach(el => {
    el.onclick = () => {
      const stat = el.dataset.stat;
      openStatBreakdown = openStatBreakdown === stat ? null : stat;
      renderStatBreakdown(base);
    };
  });
  renderStatBreakdown(base);
}

// Tapping Expense/Income/Balance reveals the per-account math behind that
// combined number — e.g. Expense RM4399.75 = TNG RM1368.42 + HL Bank
// RM1900.23 + PBank RM1038.70 + Cash RM92.40 — so the total is never a
// mystery. Uses the same base pool and time/category/search scoping as the
// number above it (statsFor), just split per account instead of combined.
function renderStatBreakdown(base) {
  const el = document.getElementById('statBreakdown');
  if (!openStatBreakdown) { el.classList.remove('show'); el.innerHTML = ''; return; }
  const stat = openStatBreakdown;
  // Tags the panel with which stat it's showing so hide-balance CSS can blur
  // the Balance and Income breakdowns (both reveal real money figures) while
  // leaving the Expense breakdown alone, same split as everywhere else.
  el.classList.toggle('breakdown-balance', stat === 'balance');
  el.classList.toggle('breakdown-income', stat === 'income');
  let rows, note = '';
  if (stat === 'balance') {
    // Real running balance per account, not Income-Expense — same source
    // as currentBalanceTotal() above.
    rows = ['TNG', 'HL Bank', 'PBank', 'TNG Card']
      .map(a => ({ account: a, value: trueBalanceFor(a) }))
      .filter(r => r.value !== null);
    note = '<div class="stat-breakdown-note">Cash not included — no starting balance set for it yet</div>';
  } else {
    rows = ACCOUNTS.map(a => ({ account: a, value: statsFor(base.filter(t => t.account === a))[stat] }))
      .filter(r => r.value !== 0);
  }
  const total = rows.reduce((s, r) => s + r.value, 0);
  el.innerHTML = rows.map(r =>
    `<div class="stat-breakdown-row"><span>${r.account}</span><span>${formatStatValue(stat, r.value)}</span></div>`
  ).join('') + `<div class="stat-breakdown-row total"><span>Total</span><span>${formatStatValue(stat, total)}</span></div>` + note;
  el.classList.add('show');
}

// Unsure sits last — it's the "needs a real category" bucket, not something
// you'd usually filter to on purpose, so it shouldn't compete for attention
// with the real spending categories at the front of the row.
const ALL_CATEGORIES = ['Car', 'Shopping', 'Food', 'Entertainment', 'Sports', 'Housing', 'Transfer', 'Income', 'Unsure'];

// Top-level "which real-world account" filter — All / TNG / HL Bank / PBank
// — a separate dimension from the category filters below it. Which account
// something belongs to is orthogonal to what it was spent on, so this is
// its own chip row rather than folded into the category one.
function renderAccountFilters() {
  const accounts = ['All'].concat(ACCOUNTS);
  document.getElementById('accountfilters').innerHTML = accounts.map(a =>
    `<div class="filter-chip ${a === activeAccountFilter ? 'active' : ''}" data-acct="${a}">${a}</div>`
  ).join('');
  document.querySelectorAll('#accountfilters .filter-chip').forEach(el => {
    el.onclick = () => { activeAccountFilter = el.dataset.acct; render(); };
  });
}

// Only shows a category chip if the currently-selected account actually has
// at least one transaction in it — e.g. PBank has no Shopping, so that
// chip just doesn't appear while PBank is selected, instead of showing an
// always-empty category. Recomputed every render() since it depends on
// accountTxns (which changes whenever the Account filter changes).
function renderFilters(accountTxns) {
  const present = new Set(accountTxns.map(t => t.category));
  // If the category you had selected isn't available for the account you
  // just switched to, fall back to All rather than showing an empty list.
  if (activeFilter !== 'All' && !present.has(activeFilter)) {
    activeFilter = 'All';
    activeSubFilter = 'All';
  }
  const cats = ['All'].concat(ALL_CATEGORIES.filter(c => present.has(c)));
  document.getElementById('filters').innerHTML = cats.map(c =>
    `<div class="filter-chip ${c === activeFilter ? 'active' : ''}" data-cat="${c}">${c}</div>`
  ).join('');
  document.querySelectorAll('#filters .filter-chip').forEach(el => {
    el.onclick = () => { activeFilter = el.dataset.cat; activeSubFilter = 'All'; render(); };
  });
}

// Second row of chips shown only when the active category has subtags (Car,
// Housing, Unsure) — e.g. selecting Car reveals Toll/Parking/Fuel/Service/Ride
// so you can drill into just one without leaving the category. Same idea as
// renderFilters() hiding unused category chips per account: a subtag chip
// only shows if the current account+category slice actually has a row with
// it (e.g. PBank has no "Ride" rows, so that chip won't appear while PBank
// is selected), rather than always showing every subtag the category could
// ever have. categoryTxns is the account+category-filtered set from render()
// (before any subtag filter is applied), so "present" reflects real data.
function renderSubFilters(categoryTxns) {
  const el = document.getElementById('subfilters');
  const possible = SUBTAGS_BY_CATEGORY[activeFilter];
  if (!possible || !possible.length) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  // Normalized so Card Reload/TNG Card Top-up rows count toward the
  // "Internal" chip being present, instead of toward chips that no longer
  // exist (see normalizedSubTag()).
  const present = new Set((categoryTxns || []).map(t => normalizedSubTag(t.category, t.subTag)).filter(Boolean));
  (categoryTxns || []).forEach(t => { if (t.extraTag) present.add(t.extraTag); });
  const subtags = possible.filter(s => present.has(s));
  if (!subtags.length) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  // If the subtag you had selected isn't available anymore (e.g. you just
  // switched account), fall back to "All" rather than showing an empty list.
  if (activeSubFilter !== 'All' && !present.has(activeSubFilter)) {
    activeSubFilter = 'All';
  }
  el.style.display = 'flex';
  const opts = ['All'].concat(subtags);
  el.innerHTML = opts.map(s =>
    `<div class="filter-chip ${s === activeSubFilter ? 'active' : ''}" data-sub="${s}">${s}</div>`
  ).join('');
  el.querySelectorAll('.filter-chip').forEach(chip => {
    chip.onclick = () => { activeSubFilter = chip.dataset.sub; render(); };
  });
}

// Combines date + time (when present) into one sortable timestamp, so
// same-day transactions order correctly instead of tying on date alone.
function txnTimestamp(t) {
  return new Date(t.date + 'T' + (t.time || '00:00') + ':00').getTime();
}

function sortTxns(txns) {
  const sorted = [...txns];
  if (sortMode === 'date_desc') sorted.sort((a, b) => txnTimestamp(b) - txnTimestamp(a));
  else if (sortMode === 'date_asc') sorted.sort((a, b) => txnTimestamp(a) - txnTimestamp(b));
  else if (sortMode === 'amount_desc') sorted.sort((a, b) => Number(b.amount) - Number(a.amount));
  else if (sortMode === 'amount_asc') sorted.sort((a, b) => Number(a.amount) - Number(b.amount));
  return sorted;
}

function groupKeyFor(t) {
  if (groupMode === 'day') return new Date(t.date).toDateString();
  if (groupMode === 'category') return t.category + (t.subTag ? ' · ' + t.subTag : '');
  if (groupMode === 'merchant') return t.merchant || t.notes || 'Unknown';
  return '__all__';
}

function render() {
  // Reset here — the grouped branch below (any mode except "None") turns
  // this back on, since expand/collapse-all only makes sense once rows are
  // actually grouped into headers.
  document.getElementById('toolbarSecondary').style.display = 'none';
  renderAccountFilters();
  // Account filter (All/TNG/HL Bank/PBank) narrows the pool everything else
  // below operates on, same as how the category filter narrows further.
  const accountTxns = activeAccountFilter === 'All' ? allTxns : allTxns.filter(t => t.account === activeAccountFilter);
  renderFilters(accountTxns);
  const categoryTxns = activeFilter === 'All' ? accountTxns : accountTxns.filter(t => t.category === activeFilter);
  renderSubFilters(categoryTxns);
  let filtered = categoryTxns;
  if (activeFilter !== 'All' && activeSubFilter !== 'All') {
    // A row matches either its primary subTag or its secondary extraTag
    // (see attachExtraTagHandlers()) — e.g. a Housing > Rent row also
    // tagged "+ WiFi" shows up under both the Rent and WiFi chips, even
    // though it's only counted once in totals/pie since subTag itself
    // never changes.
    filtered = filtered.filter(t => normalizedSubTag(t.category, t.subTag || '') === activeSubFilter || t.extraTag === activeSubFilter);
  }
  // Free-text search over merchant/notes/remark/subtag — narrows the list
  // (and the totals below, same as the category filters do) to whatever
  // matches, e.g. "grab" or "lunch with ali".
  filtered = searchFilter(filtered);
  // Independent custom date-range filter (the "Date range" button beside
  // Group by/Sort by) — narrows the list + Totals cards the same way search
  // does. Deliberately separate from the Today/This week/This month scoping
  // above (activeTimeFilter), which only drives the Overall/mini pies.
  if (mainRangeFrom && mainRangeTo) {
    filtered = filtered.filter(t => t.date >= mainRangeFrom && t.date <= mainRangeTo);
  }
  // On the "All" view, keep Transfer out of the totals cards so wallet
  // top-ups/sends/receipts don't inflate spend numbers. Selecting the
  // Transfer chip directly still shows its own totals as normal, and the
  // transaction list below always shows everything in `filtered` so those
  // rows stay visible.
  const summaryTxns = activeFilter === 'All'
    ? filtered.filter(t => !NON_SPEND_CATEGORIES.includes(t.category))
    : filtered;
  // Same account/category/search/date-range-filtered pool as summaryTxns,
  // but keeping Income rows instead of excluding them — feeds the All time
  // card's Income sub-line. Only populated on the "All categories" view
  // (same condition the Overall Expense/Income split above uses).
  const incomeTxnsForTotals = activeFilter === 'All' ? filtered.filter(t => t.category === 'Income') : [];
  renderTotals(summaryTxns, incomeTxnsForTotals);
  // The pies (combined + per-account) are computed independently from
  // allTxns/each account's own slice — see renderCharts() — so the account
  // filter chips never touch the combined pie, only which mini pie(s) show.
  renderCharts();

  if (!filtered.length) {
    document.getElementById('list').innerHTML = '<div class="empty">No transactions yet.</div>';
    return;
  }

  const sorted = sortTxns(filtered);

  if (groupMode === 'none') {
    let html = '<div class="day-group">';
    sorted.forEach(t => { html += renderTxnRow(t); });
    html += '</div>';
    document.getElementById('list').innerHTML = html;
    attachCatSelectHandlers();
    attachExtraTagHandlers();
    attachExtraTagAmountHandlers();
    attachRemarkHandlers();
    attachLinkHandlers();
    return;
  }

  const groups = {};
  const order = [];
  sorted.forEach(t => {
    const key = groupKeyFor(t);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(t);
  });

  // Every grouped mode (Day/Category/Merchant) is collapsible — tap a
  // header to reveal that group's rows, same behavior regardless of what
  // it's grouped by.
  const isCollapsible = groupMode !== 'none';
  if (isCollapsible && order.length) {
    const allExpanded = order.every(k => expandedGroups.has(k));
    const secondary = document.getElementById('toolbarSecondary');
    const btn = document.getElementById('expandAllBtn');
    secondary.style.display = '';
    btn.textContent = allExpanded ? 'Collapse all' : 'Expand all';
    btn.onclick = () => {
      if (allExpanded) expandedGroups.clear();
      else order.forEach(k => expandedGroups.add(k));
      render();
    };
  }
  let html = '';
  order.forEach(key => {
    // On the "All categories" view, keep Transfer/Income out of each group's
    // total too — same rule renderTotals()/statsFor() already apply to the
    // Expense/Income/Balance cards above, and what calendarDayTotal() already
    // does for the Calendar page. Before this fix, a day's total here could
    // include a big account-to-account transfer while the Calendar's total
    // for that same date didn't — two different-looking numbers for "the
    // same day" that didn't actually agree. Selecting a specific category
    // (including Transfer itself) still shows that category's own real
    // total, unaffected by this.
    const groupSpendTxns = activeFilter === 'All'
      ? groups[key].filter(t => !NON_SPEND_CATEGORIES.includes(t.category))
      : groups[key];
    const groupTotal = groupSpendTxns.reduce((s, t) => s + expenseTotalAmount(t), 0);
    const expanded = !isCollapsible || expandedGroups.has(key);
    const headerClass = isCollapsible ? ' collapsible' + (expanded ? '' : ' collapsed') : '';
    html += `<div class="day-group">
      <div class="day-header${headerClass}" data-key="${escapeHtml(key)}">
        <span class="day-header-left">${isCollapsible ? '<span class="day-chevron">&#9662;</span>' : ''}<span>${key}</span></span>
        <span class="day-header-total">${formatSignedRM(groupTotal)}</span>
      </div>`;
    if (expanded) {
      groups[key].forEach(t => { html += renderTxnRow(t); });
    }
    html += `</div>`;
  });
  document.getElementById('list').innerHTML = html;
  if (isCollapsible) {
    document.querySelectorAll('.day-header.collapsible').forEach(el => {
      el.onclick = () => {
        const key = el.dataset.key;
        if (expandedGroups.has(key)) expandedGroups.delete(key);
        else expandedGroups.add(key);
        render();
      };
    });
  }
  attachCatSelectHandlers();
  attachExtraTagHandlers();
  attachExtraTagAmountHandlers();
  attachRemarkHandlers();
  attachLinkHandlers();
}

// A "Transfer to Wallet" row's merchant field is either a real person's name
// (TNG recorded who the money went to — e.g. "MUSRIYAH") or the generic
// literal text "Fund Transfer" (no name available). When a real name is
// present, show it in parens next to the category/subtag it landed in, e.g.
// "Parking (MUSRIYAH)" or "To Others (SAW THAN ZAW OO)", so the row reads
// clearly instead of just showing a bare name with no context. Rows with no
// real name (or any other transaction type) fall back to the normal
// merchant/notes title.
function txnTitle(t) {
  const merchant = (t.merchant || '').trim();
  if (t.type === 'Transfer to Wallet' && merchant && merchant.toUpperCase() !== 'FUND TRANSFER') {
    const label = t.subTag || t.category;
    return `${label} (${merchant})`;
  }
  return t.merchant || t.notes || 'Unknown';
}

// Real direction of money for this row: 'in' or 'out'. Prefers an explicit
// t.flow (set by the Bank A/B parsers, which know the real debit/credit
// column at import time, and backfilled onto older rows by
// ensureFlowColumn()). Falls back to a category/subtag default for rows
// that somehow still have no flow value — real spend is always 'out',
// Income/Card Reload/From Others are always 'in', To Others is always
// 'out', and anything else defaults to 'in'.
function txnFlow(t) {
  if (t.flow === 'in' || t.flow === 'out') return t.flow;
  if (t.category === 'Income') return 'in';
  if (t.category === 'Transfer') {
    if (t.subTag === 'To Others') return 'out';
    return 'in';
  }
  return 'out';
}

// The amount to count toward a real-spend category's total. Normally just
// the raw amount (money going out), but if a transaction was recategorized
// INTO a spend category (e.g. Food) while its flow is still "in" — like a
// friend's reimbursement tagged the same category as the expense it's
// paying back, via the remark-link feature — it NETS OFF that category's
// total instead of inflating it, so Food shows your true out-of-pocket cost
// rather than double-counting both the spend and the refund. Only applies
// to real spend categories; Transfer/Income keep the plain sum since
// "in"/"out" already carries its own separate meaning there (e.g. Card
// Reload in vs Internal out).
function spendAmount(t) {
  const amt = Number(t.amount || 0);
  if (NON_SPEND_CATEGORIES.includes(t.category)) return amt;
  return txnFlow(t) === 'in' ? -amt : amt;
}

// Same as spendAmount(), but always contributes 0 for a row that's Internal
// from the frontend's point of view (real Internal rows AND the merged
// Card Reload/TNG Card Top-up rows — see normalizedSubTag()). Self-transfers
// should never count toward an "Expense" figure, even on a totals view
// filtered directly to the Transfer category — before this, tapping the
// Transfer chip would lump reloads/sends/receives/internal moves into one
// misleading "-RMxxx expense" number. Real sends (To Others) still count as
// spend-like and real receives (From Others) still count as income-like, so
// only Internal itself drops to 0 here. Deliberately NOT used by the subtag
// pie breakdown (renderChartOn still calls plain spendAmount()) — that pie
// is meant to show real transfer volumes (e.g. how much you've topped up),
// not an expense figure, so Card Reload/TNG Card Top-up still show their
// real amounts there.
function expenseTotalAmount(t) {
  if (t.category === 'Transfer' && normalizedSubTag(t.category, t.subTag) === 'Internal') return 0;
  return spendAmount(t);
}

// Used anywhere a group/day/period TOTAL built from spendAmount() sums is
// displayed (day-group headers, Calendar cells/day panel/account subtotals,
// Trends readout). In that sum, positive = net money spent that
// day/period — so it displays as "-RM50.00" (an expense), matching how every
// individual transaction row already shows spend as "-RMxx.xx". A negative
// sum (reimbursements outweighing spend) is a net credit, so it flips to
// "+RM20.00" instead.
function formatSignedRM(amount, decimals) {
  const d = decimals === undefined ? 2 : decimals;
  const abs = Math.abs(amount).toFixed(d);
  if (amount > 0) return '-RM' + abs;
  if (amount < 0) return '+RM' + abs;
  return 'RM' + abs;
}

// Sign + CSS class for the amount text. Real spend = red minus. Money
// genuinely coming in (Card Reload, From Others, Income) = green plus.
// To Others = red minus — it's leaving the account, even though "Transfer"
// as a category isn't counted as spend. Internal (movement between your own
// TNG/Bank A/Bank B accounts) is always yellow, with the sign following the
// real direction of that specific row.
function txnSignInfo(t) {
  const flow = txnFlow(t);
  const sign = flow === 'in' ? '+' : '-';
  if (t.category === 'Transfer' && t.subTag === 'Internal') {
    return { sign, cls: 'amount internal' };
  }
  return { sign, cls: flow === 'in' ? 'amount in' : 'amount' };
}

// Turns a name string into Title Case, e.g. "KHEK WEI KEAN" -> "Khek Wei
// Kean" — used only for the small blue transfer-context hint so it reads
// like a name instead of shouting in all caps.
function titleCaseName(s) {
  return (s || '').trim().split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}

// If a row's category has been manually changed AWAY from Transfer (e.g. a
// "To Others (KHEK WEI KEAN)" QR payment turned out to really be a Food
// purchase, so you recategorized it), the original transfer context would
// otherwise disappear from view once the category no longer says Transfer.
// This pulls that context back out of the Merchant text — which doesn't
// change when you recategorize — as a small hint like "(to Khek)", so you
// don't lose track of where the money actually went/came from. Returns null
// while the row is still shown as Transfer (no hint needed) or if the
// merchant text doesn't match a known transfer pattern.
function transferHint(t) {
  if (t.category === 'Transfer') return null;
  const m = (t.merchant || '').trim();
  let match;
  if ((match = m.match(/^To Others \((.+?)\)/i))) return 'to ' + titleCaseName(match[1]);
  if ((match = m.match(/^From Others \((.+?)\)/i))) return 'from ' + titleCaseName(match[1]);
  if (/^To HL Bank\b/i.test(m)) return 'to HL Bank';
  if (/^From HL Bank\b/i.test(m)) return 'from HL Bank';
  if (/^To PBank\b/i.test(m)) return 'to PBank';
  if (/^From PBank\b/i.test(m)) return 'from PBank';
  if (/^To TNG\b/i.test(m)) return 'to TNG';
  if ((match = m.match(/^Internal Transfer(?:\s*\((.+?)\))?/i))) {
    return match[1] ? ('internal · ' + titleCaseName(match[1])) : 'internal transfer';
  }
  return null;
}

// Options for the small secondary "+ tag" select next to the main category
// dropdown — offers every OTHER subtag in the same category (excluding the
// row's own primary subTag), so e.g. a Housing > Rent row can also be
// tagged "+ WiFi" when one payment genuinely covers both. Returns '' if the
// category doesn't have at least one other subtag to offer.
function extraTagOptionsHtml(category, subTag, extraTag) {
  const subtags = (SUBTAGS_BY_CATEGORY[category] || []).filter(s => s !== subTag);
  if (!subtags.length) return '';
  const opts = ['<option value="">+ tag…</option>'].concat(
    subtags.map(s => `<option value="${s}"${s === extraTag ? ' selected' : ''}>+ ${s}</option>`)
  );
  return opts.join('');
}

// Card Reload / TNG Card Top-up are folded into "Internal" for display,
// filtering, and editing everywhere in the frontend — the raw subTag on the
// sheet stays untouched (literally "Card Reload"/"TNG Card Top-up") so
// Code.gs's HL Bank matching pass and renameCardTopUps() keep working off
// the real value. Anywhere the frontend needs to treat a row as its
// user-facing subtag (dropdown selection, filter-chip matching), route it
// through this first.
const RELOAD_SUBTAGS = ['Card Reload', 'TNG Card Top-up'];
function normalizedSubTag(category, subTag) {
  if (category === 'Transfer' && RELOAD_SUBTAGS.includes(subTag)) return 'Internal';
  return subTag;
}

// Which two accounts a Transfer row moves money between, e.g. "HL Bank" or
// "TNG Card" as the OTHER side of t.account — derived from the row's own
// account + subTag + merchant (set by whichever Code.gs reconcile/import
// rule created it), not from remark text. Shared by tbcPairLabel() (TBC
// placeholder rows) and reloadPairLabel() (the always-on badge for
// Card Reload/TNG Card Top-up rows). Returns null if this doesn't match a
// known shape.
function accountPairOther_(t) {
  if (t.subTag === 'Internal' && t.account === 'TNG') return 'HL Bank';
  if (t.subTag === 'Internal' && t.account === 'HL Bank') return /From PBank/i.test(t.merchant || '') ? 'PBank' : 'TNG';
  if (t.subTag === 'Internal' && t.account === 'PBank') return 'HL Bank';
  if (RELOAD_SUBTAGS.includes(t.subTag) && t.account === 'TNG') return 'TNG Card';
  if (RELOAD_SUBTAGS.includes(t.subTag) && t.account === 'TNG Card') return 'TNG';
  return null;
}
const TBC_ACCOUNT_SHORT = { 'TNG': 'TNG', 'HL Bank': 'HL', 'PBank': 'P', 'TNG Card': 'Card' };
// Falls back to plain "TBC" if accountPairOther_ doesn't recognize the shape
// (e.g. an old/manually-added TBC row).
function tbcPairLabel(t) {
  const other = accountPairOther_(t);
  if (!other) return 'TBC';
  const mine = TBC_ACCOUNT_SHORT[t.account] || t.account;
  const otherShort = TBC_ACCOUNT_SHORT[other] || other;
  const flow = txnFlow(t);
  return flow === 'in' ? `${otherShort} > ${mine} TBC` : `${mine} > ${otherShort} TBC`;
}
// Small yellow "which accounts" badge shown on every Card Reload/TNG Card
// Top-up row (see renderTxnRow) — now that these no longer get their own
// yellow dot (they render as plain grey Internal rows), this is what keeps
// the top-up direction/amount visible at a glance instead of needing to open
// the row. Same account-pair logic as tbcPairLabel(), just without the
// "TBC" suffix since this isn't a placeholder waiting to be confirmed.
function reloadPairLabel(t) {
  const other = accountPairOther_(t);
  if (!other) return null;
  const mine = TBC_ACCOUNT_SHORT[t.account] || t.account;
  const otherShort = TBC_ACCOUNT_SHORT[other] || other;
  const flow = txnFlow(t);
  return flow === 'in' ? `${otherShort} > ${mine}` : `${mine} > ${otherShort}`;
}

function renderTxnRow(t) {
  const isReloadRow = t.category === 'Transfer' && RELOAD_SUBTAGS.includes(t.subTag);
  // Reload rows render exactly like every other Transfer row now (plain
  // grey dot) — the reloadFlagHtml badge below is what distinguishes them.
  const dotClass = ALL_CATEGORIES.includes(t.category) ? t.category : 'Custom';
  const { sign, cls: amtClass } = txnSignInfo(t);
  // Rows auto-added by the HL Bank <-> TNG reload rule carry a remark
  // starting with "*TBC" until the real bank record shows up and
  // confirmTbcIfMatches_() (Code.gs) clears it — show a small yellow "!"
  // instead of the raw remark text so it's easy to spot at a glance, and
  // it disappears on its own once the real CSV/PDF/screenshot is imported.
  const isTbc = !!(t.remark && t.remark.indexOf('*TBC') === 0);
  const tbcFlagHtml = isTbc
    ? `<span class="tbc-flag" title="${escapeHtml(t.remark)}">${escapeHtml(tbcPairLabel(t))}</span>`
    : '';
  // Reload rows that AREN'T a TBC placeholder still get the small yellow
  // account-pair badge (see reloadPairLabel) so folding them into Internal
  // doesn't lose the at-a-glance top-up direction the old yellow dot gave.
  const reloadLabel = (!isTbc && isReloadRow) ? reloadPairLabel(t) : null;
  const reloadFlagHtml = reloadLabel
    ? `<span class="tbc-flag" title="Internal · ${escapeHtml(reloadLabel)}">${escapeHtml(reloadLabel)}</span>`
    : '';
  // The Review tab's "Confirm" button stamps a generic "Confirmed manually
  // on <date>" remark (see renderReviewList) purely as an internal marker —
  // it's not a real split/note, so isSplitLinkableRemark() filters it out
  // here too (same check the Splits feature uses), otherwise it would show
  // up looking exactly like a real linked split note on the row.
  const remarkHtml = (t.remark && !isTbc && isSplitLinkableRemark(t.remark))
    ? `<div class="remark" data-remark="${escapeHtml(t.remark)}" title="Click to see every transaction sharing this note">${escapeHtml(t.remark)}</div>`
    : '';
  const hint = transferHint(t);
  const hintHtml = hint ? `<div class="transfer-hint">(${escapeHtml(hint)})</div>` : '';
  // Normalize the subTag passed to the "+ tag" options so a Card Reload/TNG
  // Card Top-up row doesn't offer "+ Internal" as a secondary tag on itself
  // (it already IS Internal from the frontend's point of view).
  const extraOpts = extraTagOptionsHtml(t.category, normalizedSubTag(t.category, t.subTag), t.extraTag);
  const extraSelectHtml = extraOpts
    ? `<select class="txn-extratag-select${t.extraTag ? ' has-extra' : ''}" data-row="${t.row}">${extraOpts}</select>`
    : '';
  // Only shown once a "+ tag" is actually picked — lets you say exactly how
  // much of this payment is for the tag (e.g. RM100 of a RM1500 Rent payment
  // is really WiFi) instead of always assuming an even 50/50 split.
  const extraAmountHtml = (extraOpts && t.extraTag)
    ? `<input type="number" class="txn-extratag-amount" data-row="${t.row}" step="0.01" min="0" placeholder="RM for + ${escapeHtml(t.extraTag)}" title="How much of this payment is for the + tag — leave blank to split it evenly" value="${(t.extraTagAmount !== null && t.extraTagAmount !== undefined && t.extraTagAmount !== '') ? t.extraTagAmount : ''}">`
    : '';
  // A Card Reload/TNG Card Top-up is money moving to your own accounts —
  // never something anyone reimburses you for — so the ✎ split-link button
  // (which opens "Link to a split", see openSplitPicker) doesn't apply and
  // is hidden here rather than shown for a feature that can't make sense.
  const remarkBtnHtml = isReloadRow ? '' : `<button class="remark-btn${t.remark ? ' has-remark' : ''}" data-row="${t.row}" title="Add/edit remark">✎</button>`;
  return `
    <div class="txn" data-row="${t.row}">
      <div class="dot ${dotClass}"></div>
      <div class="info">
        <div class="merchant">${txnTitle(t)}${tbcFlagHtml}${reloadFlagHtml}</div>
        ${hintHtml}
        <div class="meta">${new Date(t.date).toLocaleDateString()} · ${t.time || 'No time record'} · ${t.account || 'TNG'}</div>
        ${remarkHtml}
        <div class="cat-select-row">
          <select class="txn-cat-select" data-row="${t.row}">${categoryOptionsHtml(t.category, t.subTag, t.account)}</select>
          ${extraSelectHtml}
          ${extraAmountHtml}
        </div>
      </div>
      <div class="txn-actions">
        <div class="${amtClass}">${sign}RM${Number(t.amount || 0).toFixed(2)}</div>
        ${remarkBtnHtml}
      </div>
    </div>`;
}

// Lets you reassign a transaction's category/subtag right from the list
// (e.g. fixing an "Unsure" row, or moving a Pokemon Go charge from
// Entertainment to Subscription) without re-adding it. Changing the primary
// category/subtag also clears any secondary "+ tag" (extraTag), since it
// belonged to the old category's subtag set and may no longer make sense.
function attachCatSelectHandlers() {
  document.querySelectorAll('.txn-cat-select').forEach(el => {
    el.onchange = async () => {
      const row = Number(el.dataset.row);
      const [category, subTag] = el.value.split('|');
      const t = allTxns.find(x => x.row === row);
      const hadExtraTag = t && t.extraTag;
      if (t) { t.category = category; t.subTag = subTag; t.extraTag = ''; }
      el.disabled = true;
      await callApi('updateCategory', { row, category, subTag });
      if (hadExtraTag) await callApi('updateExtraTag', { row, extraTag: '' });
      renderApp();
    };
  });
}

// Lets a transaction that genuinely covers two things at once (e.g. one
// payment for both Housing > Rent and Housing > WiFi) also carry a second
// subtag from the same category — the row still counts once, under its one
// primary subTag, but now also shows up when you filter the list by either
// subtag (see the "present" set in renderSubFilters() and the match in
// render()). Only offered when the category has more than one subtag to
// choose from (see extraTagOptionsHtml()).
function attachExtraTagHandlers() {
  document.querySelectorAll('.txn-extratag-select').forEach(el => {
    el.onchange = async () => {
      const row = Number(el.dataset.row);
      const extraTag = el.value;
      const t = allTxns.find(x => x.row === row);
      // Picking a different tag (or clearing it) invalidates whatever amount
      // was set for the OLD tag, so reset it — the amount input reappears
      // blank (splits 50/50 by default) until a new amount is entered for
      // this tag specifically.
      if (t) { t.extraTag = extraTag; t.extraTagAmount = null; }
      el.disabled = true;
      await callApi('updateExtraTag', { row, extraTag, extraTagAmount: '' });
      renderApp();
    };
  });
}

// How much of this transaction's total actually belongs to the "+ tag"
// (secondary subtag) rather than the primary one — e.g. a Housing > Rent
// payment of RM1500 that also covers RM100 of WiFi should attribute RM100 to
// WiFi and RM1400 to Rent, not split 50/50. Left blank, the pie/breakdown
// views (see isHousingSplitMode) fall back to an even 50/50 split, same as
// before this field existed. See updateExtraTag (Code.gs) for the backend
// side — stored in its own column so it survives independently of the tag
// name itself.
function attachExtraTagAmountHandlers() {
  document.querySelectorAll('.txn-extratag-amount').forEach(el => {
    el.onchange = async () => {
      const row = Number(el.dataset.row);
      const t = allTxns.find(x => x.row === row);
      if (!t) return;
      const raw = el.value.trim();
      let amt = raw === '' ? null : Math.max(0, Number(raw) || 0);
      // Can't attribute more (or all) of the payment to the tag than the
      // row is actually worth — that would leave nothing for the primary
      // subtag, which doesn't make sense. Falls back to the 50/50 default
      // instead of silently clamping to a confusing edge value.
      const total = Number(t.amount || 0);
      if (amt !== null && (amt <= 0 || amt >= total)) amt = null;
      t.extraTagAmount = amt;
      el.value = amt !== null ? amt : '';
      await callApi('updateExtraTag', { row, extraTag: t.extraTag, extraTagAmount: amt !== null ? amt : '' });
    };
  });
}

// Lets you attach a free-text remark to any transaction (e.g. "lunch with
// Ali", "car aircon regas") — separate from Notes, which holds
// system/import-derived text. Also doubles as the split-link note (see
// groupByRemark below) — opens the split picker sheet instead of a plain
// prompt() so you can pick an EXISTING split by name (no retyping, no
// typos that would silently fail to link) or type a brand new note/split.
function attachRemarkHandlers() {
  document.querySelectorAll('.remark-btn').forEach(el => {
    el.onclick = () => openSplitPicker(Number(el.dataset.row));
  });
}

// Manual "link" for grouping transactions that belong together even across
// different accounts/categories — e.g. you pay a group lunch on TNG, then
// each friend's reimbursement lands as a separate Transfer row, maybe in a
// different account entirely. Rather than a new field, this reuses the
// existing free-text Remark: put the same note (e.g. "Lunch split") on the
// original payment AND on each reimbursement via the ✎ button. Clicking
// that note anywhere (Main, History, Review) opens the Splits sheet showing
// that one group's paid/received/net detail — groupByRemark (the raw
// filtered-list view) is still reachable from a button inside that sheet.
function groupByRemark(remark) {
  if (!remark) return;
  switchPage('main');
  searchQuery = remark;
  document.getElementById('searchBox').value = remark;
  activeAccountFilter = 'All';
  activeFilter = 'All';
  activeSubFilter = 'All';
  activeTimeFilter = null;
  render();
}
function attachLinkHandlers() {
  document.querySelectorAll('.remark[data-remark]').forEach(el => {
    el.onclick = () => openSplitsModal(el.dataset.remark);
  });
}

// ---- Splits (remark-linked reimbursement groups) ----
// The Review tab's "Confirm" button (see renderReviewList) stamps a
// generic "Confirmed manually on <date>" remark onto whatever you confirm
// that day — several unrelated confirmations on the same day end up
// sharing that exact text, which would otherwise look like a bogus "split
// group" of unrelated transactions. Filtered out of every split-related
// view below so only genuine split notes show up.
const CONFIRM_REMARK_RE = /^Confirmed manually on \d{4}-\d{2}-\d{2}$/;
function isSplitLinkableRemark(remark) {
  if (!remark) return false;
  if (remark.indexOf('*TBC') === 0) return false;
  if (CONFIRM_REMARK_RE.test(remark)) return false;
  return true;
}

// Every remark currently in use, with its member transactions and running
// paid/received/net totals — including remarks used on just ONE
// transaction so far. That single-use case matters for the split picker
// (see openSplitPicker): the moment you name a brand-new split on
// transaction A, it needs to be pickable when you open transaction B's
// picker next, even though it isn't a real "group" yet. splitGroups()
// below is just this filtered down to genuine 2+ groups, for views that
// should only ever show real links.
function remarkGroups() {
  const byRemark = {};
  allTxns.forEach(t => {
    if (!isSplitLinkableRemark(t.remark)) return;
    (byRemark[t.remark] = byRemark[t.remark] || []).push(t);
  });
  const list = Object.keys(byRemark).map(remark => {
    const txns = byRemark[remark].slice().sort((a, b) => txnTimestamp(b) - txnTimestamp(a));
    let totalOut = 0, totalIn = 0;
    txns.forEach(t => {
      const amt = Number(t.amount || 0);
      if (txnFlow(t) === 'in') totalIn += amt; else totalOut += amt;
    });
    return { remark, txns, count: txns.length, totalOut, totalIn, net: totalOut - totalIn, lastDate: txns[0].date };
  });
  list.sort((a, b) => (b.lastDate || '').localeCompare(a.lastDate || ''));
  return list;
}
function splitGroups() {
  return remarkGroups().filter(g => g.count >= 2);
}

function splitGroupCardHtml(g) {
  const rowsHtml = g.txns.map(t => {
    const flow = txnFlow(t);
    const sign = flow === 'in' ? '+' : '-';
    return `
      <div class="split-group-row">
        <span>${escapeHtml(txnTitle(t))} · ${new Date(t.date).toLocaleDateString()} · ${escapeHtml(t.account || '')}</span>
        <span class="sgr-amt ${flow}">${sign}RM${Number(t.amount || 0).toFixed(2)}</span>
      </div>`;
  }).join('');
  return `
    <div class="split-group" data-remark="${escapeHtml(g.remark)}">
      <div class="split-group-header">
        <div class="split-group-name">${escapeHtml(g.remark)}</div>
        <div class="split-group-net">${formatSignedRM(g.net)}</div>
      </div>
      <div class="split-group-rows">${rowsHtml}</div>
      <div class="split-group-summary">
        <span>You paid: <b>RM${g.totalOut.toFixed(2)}</b></span>
        <span>Received back: <b>RM${g.totalIn.toFixed(2)}</b></span>
        <span>Net cost to you: <b>${formatSignedRM(g.net)}</b></span>
      </div>
      <button class="toolbar-btn split-group-viewlist" data-remark="${escapeHtml(g.remark)}">Show in transaction list →</button>
    </div>`;
}

// Powers the Splits sheet, reachable from the 🔗 Splits buttons on
// Main/History/Review (full browse, filterRemark omitted) and from tapping
// any linked remark on a transaction row (filterRemark set — jumps
// straight to that one group's detail instead of making you find it in a
// list).
function renderSplitsModal(filterRemark) {
  const el = document.getElementById('splitsList');
  const label = document.getElementById('splitsSectionLabel');
  const groups = filterRemark ? remarkGroups().filter(g => g.remark === filterRemark) : splitGroups();
  if (!groups.length) {
    label.textContent = filterRemark || 'Split groups';
    el.innerHTML = filterRemark
      ? '<div class="empty">No other transactions linked to this note yet — add the same note to another transaction to form a split.</div>'
      : '<div class="empty">No splits yet — tap the ✎ note icon on a transaction and link two or more together.</div>';
    return;
  }
  label.textContent = filterRemark || `Split groups (${groups.length})`;
  el.innerHTML = groups.map(splitGroupCardHtml).join('');
  el.querySelectorAll('.split-group-viewlist').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      closeSplitsModal();
      groupByRemark(btn.dataset.remark);
    };
  });
}
function openSplitsModal(filterRemark) {
  renderSplitsModal(filterRemark || null);
  document.getElementById('splitsBackdrop').classList.add('open');
}
function closeSplitsModal() {
  document.getElementById('splitsBackdrop').classList.remove('open');
}
document.getElementById('splitsClose').onclick = closeSplitsModal;
document.getElementById('viewSplitsBtnMain').onclick = () => openSplitsModal();
document.getElementById('viewSplitsBtnHistory').onclick = () => openSplitsModal();
document.getElementById('viewSplitsBtnReview').onclick = () => openSplitsModal();

// Split/remark picker sheet — opened from the ✎ button on any transaction
// row. Lists every existing split name (including ones used on just one
// transaction so far, see remarkGroups) so you can TAP to link straight to
// it instead of retyping it — a typo would silently create a brand-new,
// unlinked group instead of joining the real one. Tapping an existing split
// saves + closes immediately (one tap, no separate Save press) — only
// typing a brand-new name still needs the explicit Save button below, since
// there's nothing in the list yet to tap. That typed name only needs the
// main word (e.g. "Lunch") — Save appends " split" automatically so every
// split ends up named consistently, unless the typed text exactly matches
// an existing split (then it's saved as-is, to actually join that group).
let splitPickerRow = null;
const splitPickerBackdrop = document.getElementById('splitPickerBackdrop');
function openSplitPicker(row) {
  splitPickerRow = row;
  const t = allTxns.find(x => x.row === row);
  const currentRemark = (t && isSplitLinkableRemark(t.remark)) ? t.remark : '';
  document.getElementById('splitPickerInput').value = currentRemark;

  const groups = remarkGroups();
  const listEl = document.getElementById('splitPickerList');
  if (!groups.length) {
    listEl.innerHTML = '<div class="split-picker-empty">No existing splits yet — type a new name below.</div>';
  } else {
    listEl.innerHTML = groups.map(g => `
      <div class="split-picker-option${g.remark === currentRemark ? ' selected' : ''}" data-remark="${escapeHtml(g.remark)}">
        <span>${escapeHtml(g.remark)}</span>
        <span class="spo-count">${g.count >= 2 ? `${g.count} txns · net ${formatSignedRM(g.net)}` : '1 txn so far'}</span>
      </div>
    `).join('');
    listEl.querySelectorAll('.split-picker-option').forEach(opt => {
      opt.onclick = () => saveSplitPickerRemark(opt.dataset.remark);
    });
  }
  splitPickerBackdrop.classList.add('open');
}
function closeSplitPicker() {
  splitPickerBackdrop.classList.remove('open');
  splitPickerRow = null;
}
async function saveSplitPickerRemark(remark) {
  const row = splitPickerRow;
  if (row === null) return;
  const t = allTxns.find(x => x.row === row);
  if (t) t.remark = remark;
  closeSplitPicker();
  await callApi('updateRemark', { row, remark });
  renderApp();
}
document.getElementById('splitPickerClose').onclick = closeSplitPicker;
document.getElementById('splitPickerSave').onclick = () => {
  let val = document.getElementById('splitPickerInput').value.trim();
  if (val) {
    const existingNames = remarkGroups().map(g => g.remark);
    const isExisting = existingNames.includes(val);
    if (!isExisting && !/\bsplit$/i.test(val)) val = val + ' split';
  }
  saveSplitPickerRemark(val);
};
document.getElementById('splitPickerClear').onclick = () => saveSplitPickerRemark('');

document.getElementById('groupBy').onchange = (e) => { groupMode = e.target.value; render(); };
document.getElementById('sortBy').onchange = (e) => { sortMode = e.target.value; render(); };
document.getElementById('importGroupBy').onchange = (e) => { importGroupMode = e.target.value; renderImportPreview(); };
document.getElementById('importSortBy').onchange = (e) => { importSortMode = e.target.value; renderImportPreview(); };
document.getElementById('searchBox').oninput = (e) => { searchQuery = e.target.value.trim(); render(); };

// ---- Add transaction ----
const addBackdrop = document.getElementById('addBackdrop');
// Re-renders the Category dropdown whenever the Account changes.
function refreshFCategoryOptions() {
  const sel = document.getElementById('fCategory');
  let [prevCategory, prevSubTag] = (sel.value || '').split('|');
  const account = document.getElementById('fAccount').value;
  sel.innerHTML = categoryOptionsHtml(prevCategory || 'Car', prevSubTag || 'Toll', account);
}
document.getElementById('fCategory').innerHTML = categoryOptionsHtml('Car', 'Toll', 'TNG');
document.getElementById('fAccount').onchange = refreshFCategoryOptions;
document.getElementById('addBtn').onclick = () => {
  const now = new Date();
  document.getElementById('fDate').value = now.toISOString().slice(0,10);
  document.getElementById('fTime').value = now.toTimeString().slice(0,5);
  document.getElementById('fRemember').checked = false;
  addBackdrop.classList.add('open');
};
document.getElementById('addClose').onclick = () => addBackdrop.classList.remove('open');

document.getElementById('fSubmit').onclick = async () => {
  const amount = parseFloat(document.getElementById('fAmount').value);
  const date = document.getElementById('fDate').value;
  const time = document.getElementById('fTime').value;
  const [category, subTag] = document.getElementById('fCategory').value.split('|');
  const merchant = document.getElementById('fMerchant').value;
  const account = document.getElementById('fAccount').value;
  const rememberMerchant = document.getElementById('fRemember').checked;
  if (!amount || !date) return;

  const btn = document.getElementById('fSubmit');
  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    await callApi('add', { row: { date, time, amount, category, subTag, merchant, source: 'Manual', notes: merchant, type: 'Manual', rememberMerchant, account } });
    addBackdrop.classList.remove('open');
    document.getElementById('fAmount').value = '';
    document.getElementById('fMerchant').value = '';
    loadData();
  } catch (err) {
    alert('Could not add: ' + err.message);
  }
  btn.disabled = false; btn.textContent = 'Add';
};
