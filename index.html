// ---- CSV parsing (wrapped as a promise) ----
function parseCsvFile(file) {
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const rows = [];
        results.data.forEach(r => {
          const type = r['Transaction Type'] || r['Type'] || '';
          const description = r['Description'] || r['Merchant'] || '';
          const dateRaw = r['Date'] || '';
          const amountRaw = (r['Amount (RM)'] || r['Amount'] || '0').toString().replace(/[^0-9.\-]/g, '');
          const guess = categorize(description, type);
          if (!guess) return;
          let date = dateRaw;
          const m = dateRaw.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
          if (m) date = `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
          // Time may come from its own column, or be embedded in the Date
          // cell itself (e.g. "30/06/2026 14:23").
          let time = r['Time'] || '';
          if (!time) {
            const tm = dateRaw.match(TIME_TOKEN_RE);
            if (tm) time = tm[1];
          }
          time = normalizeTime(time);
          rows.push({
            date, time, amount: parseFloat(amountRaw) || 0,
            category: guess.category, subTag: guess.subTag,
            merchant: description, source: 'TNG CSV Import', notes: type, type,
            account: 'TNG'
          });
        });
        resolve(rows);
      },
      error: reject
    });
  });
}

// ================== BANK STATEMENT IMPORT (Bank A / Bank B) ==================
// Bank A and Bank B are real bank accounts that feed the TNG wallet: salary
// lands in Bank A, gets moved to Bank B, then Bank B tops up the TNG wallet.
// Each bank exports a totally different CSV layout, so each gets its own
// small parser + categorizer rather than trying to force them through the
// TNG-shaped parseCsvFile above. Both ultimately produce the same row shape
// as every other import path: {date,time,amount,category,subTag,merchant,
// source,notes,type,account}.

// Strips a trailing digit run from a name string. Bank A's exports glue the
// transaction reference number onto the end of a truncated payer/payee name
// (e.g. "ENCIK MUHAMAD FAHMI BIN H283855" where "283855" is the reference),
// so this trims that back to something closer to just the name.
function stripTrailingRef(name) {
  return (name || '').replace(/\d+$/, '').trim();
}

// Bank A (Statement.csv): a Public Bank-style savings account export. It has
// a metadata header block (account number, balance, etc.), then a loosely
// comma-separated table — Date, Ref No, Description code, Debit, Credit,
// followed by several more comma-separated "details" fields (payer/payee
// name, memo) that don't line up with a clean header. Papa.parse without a
// header just gives raw arrays per line, which is what we want here so we
// can pick out real transaction rows by testing column 0 for a date.
// detailCols: the trimmed extra comma-separated fields after Debit/Credit,
// kept as SEPARATE columns rather than one joined string — a name sitting in
// one column shouldn't get confused with a reference number sitting in the
// column right next to it (e.g. col0 = reference-ish text, col1 = the
// payer's full name for a salary credit, col2+ = memo text).
function categorizeBankA(typeCode, detailCols) {
  const t = (typeCode || '').toUpperCase();
  const col0 = detailCols[0] || '';
  const col1 = detailCols[1] || '';
  const allUpper = detailCols.join(' ').toUpperCase();

  if (t === 'DEP-ECP') {
    if (allUpper.includes('PAYROLL')) {
      const payer = (col1.split(/\s{2,}/)[0] || col1).trim();
      return { category: 'Income', subTag: 'Salary', merchant: `Salary${payer ? ' (' + payer + ')' : ''}` };
    }
    return { category: 'Income', subTag: 'Other', merchant: 'Bank Credit' };
  }
  if (t.startsWith('TSFR FUND CR')) {
    const parts = col0.split(/\s{2,}/).map(s => s.trim()).filter(Boolean);
    const payer = parts.length > 1 ? parts[parts.length - 1] : parts[0];
    // A credit from HL Bank itself (rather than an external payer) would be
    // money moving back between your own accounts — Internal, not Income.
    if (/NG JIA YAO/i.test(col0)) {
      return { category: 'Transfer', subTag: 'Internal', merchant: 'From HL Bank' };
    }
    return { category: 'Income', subTag: 'Other', merchant: `Bank Credit${payer ? ' (' + payer + ')' : ''}` };
  }
  if (t === 'DUITNOW TRSF DR') {
    const name = stripTrailingRef(col0.split(/\s{2,}/)[0] || col0);
    // Movement to your own HL Bank account — filed under the single
    // "Internal" subtag (see CATEGORY_OPTIONS) rather than a dedicated
    // "To HL Bank" subtag; the merchant text still says which leg it was.
    if (/NG JIA YAO/i.test(col0)) {
      return { category: 'Transfer', subTag: 'Internal', merchant: 'To HL Bank' };
    }
    return { category: 'Transfer', subTag: 'To Others', merchant: `To Others (${name})` };
  }
  if (t === 'DUITNOW QR DR') {
    const name = stripTrailingRef(col0.split(/\s{2,}/)[0] || col0);
    return { category: 'Transfer', subTag: 'To Others', merchant: `To Others (${name})` };
  }
  if (t === 'PB DEBIT CARD DR' || t === 'DR MYDEBIT') {
    const merchantName = col0.replace(/^VISA\d+\s*/, '').replace(/^\d[\dX]{9,}\s*/i, '').split(/\s{2,}/)[0].trim();
    const col0Upper = col0.toUpperCase();
    for (const rule of CATEGORY_RULES) {
      for (const kw of rule.keywords) {
        if (col0Upper.includes(kw)) {
          return { category: rule.category, subTag: rule.subTag || '', merchant: merchantName || col0 };
        }
      }
    }
    return { category: 'Other', subTag: 'Unsure', merchant: merchantName || col0 };
  }
  return { category: 'Other', subTag: 'Unsure', merchant: col0 || t };
}

async function parseBankACsvFile(file) {
  const text = await file.text();
  const parsed = Papa.parse(text, { skipEmptyLines: false });
  const DATE_RE = /^(\d{2})-(\d{2})-(\d{4})$/;
  const rows = [];
  (parsed.data || []).forEach(cols => {
    if (!cols || !cols.length) return;
    const dateRaw = String(cols[0] || '').trim();
    const m = dateRaw.match(DATE_RE);
    if (!m) return; // skip metadata/header/blank rows
    const date = `${m[3]}-${m[2]}-${m[1]}`;
    const typeCode = String(cols[2] || '').trim();
    const debit = parseFloat(String(cols[3] || '').replace(/,/g, '').trim()) || 0;
    const credit = parseFloat(String(cols[4] || '').replace(/,/g, '').trim()) || 0;
    const amount = debit || credit;
    if (!amount) return;
    const detailCols = cols.slice(5).map(c => String(c || '').trim());
    const guess = categorizeBankA(typeCode, detailCols);
    rows.push({
      date, time: '', amount,
      category: guess.category, subTag: guess.subTag,
      merchant: guess.merchant, source: 'PBank CSV Import', notes: typeCode, type: typeCode,
      account: 'PBank',
      // PBank's statement always tells you which column the amount came
      // from — a credit is always money coming in, a debit always going
      // out — so the real direction is known outright here rather than
      // guessed from category/subtag.
      flow: credit ? 'in' : 'out'
    });
  });
  return rows;
}

// Bank B (CASATran...csv): a CASA account export — proper quoted CSV with a
// real header (Date, Description, Reference, Deposit (MYR), Withdrawal
// (MYR)). This is the account that funds the TNG wallet, so its "POS
// Purchase ... TNG-EWALLET" rows are recognized specially as Transfer > To
// TNG rather than a generic purchase.
function categorizeBankB(desc, reference) {
  const descUpper = (desc || '').toUpperCase();
  const ref = (reference || '').trim();
  const refUpper = ref.toUpperCase();

  // Money leaving to top up the TNG wallet — movement to your own account,
  // so it's filed under the single "Internal" subtag (see CATEGORY_OPTIONS)
  // rather than a dedicated "To TNG" subtag.
  if (refUpper.includes('TNG-EWALLET')) {
    return { category: 'Transfer', subTag: 'Internal', merchant: 'To TNG (Wallet Reload)' };
  }
  if (descUpper === 'INSTANT TRANSFER') {
    const nameMatch = ref.match(/from\s*ng\s*(.*?)\d{8,}/i);
    const isBankA = /NG JIA YAO/i.test(ref);
    // Same logic — money arriving from your own PBank account is Internal,
    // not an external "From Others" credit.
    if (isBankA) return { category: 'Transfer', subTag: 'Internal', merchant: 'From PBank' };
    const name = stripTrailingRef(nameMatch ? nameMatch[1] : ref);
    return { category: 'Transfer', subTag: 'From Others', merchant: `From Others (${name})` };
  }
  if (descUpper.startsWith('FUND TRF')) {
    const nameMatch = ref.match(/^Fund transfer\d*(.*)$/i);
    const name = stripTrailingRef(nameMatch ? nameMatch[1] : ref);
    return { category: 'Transfer', subTag: 'Internal', merchant: `Internal Transfer${name ? ' (' + name + ')' : ''}` };
  }
  if (descUpper === 'INTEREST') {
    return { category: 'Income', subTag: 'Interest', merchant: 'Interest' };
  }
  if (descUpper === 'DUITNOW QR') {
    const nameMatch = ref.match(/^QR Payment(.*?)\d{8,}/i);
    const name = stripTrailingRef(nameMatch ? nameMatch[1] : ref);
    return { category: 'Transfer', subTag: 'To Others', merchant: `To Others (${name})` };
  }
  if (descUpper === 'POS PURCHASE' || descUpper === 'MYDEBIT PURCHASE') {
    for (const rule of CATEGORY_RULES) {
      for (const kw of rule.keywords) {
        if (refUpper.includes(kw)) {
          const merchantName = ref.replace(/^DEBITCARD\s*/i, '').split(/\s{2,}/)[0].trim();
          return { category: rule.category, subTag: rule.subTag || '', merchant: merchantName || ref };
        }
      }
    }
    const merchantName = ref.replace(/^DEBITCARD\s*/i, '').split(/\s{2,}/)[0].trim();
    return { category: 'Other', subTag: 'Unsure', merchant: merchantName || ref };
  }
  return { category: 'Other', subTag: 'Unsure', merchant: ref || desc };
}

function parseBankBCsvFile(file) {
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const rows = [];
        results.data.forEach(r => {
          const dateRaw = (r['Date'] || '').trim();
          const desc = (r['Description'] || '').trim();
          const reference = (r['Reference'] || '').trim();
          const deposit = parseFloat((r['Deposit (MYR)'] || '').replace(/,/g, '')) || 0;
          const withdrawal = parseFloat((r['Withdrawal (MYR)'] || '').replace(/,/g, '')) || 0;
          const amount = deposit || withdrawal;
          if (!amount) return;
          const m = dateRaw.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
          const MONTHS = { Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12' };
          const date = m ? `${m[3]}-${MONTHS[m[2]] || '01'}-${m[1].padStart(2,'0')}` : dateRaw;
          const guess = categorizeBankB(desc, reference);
          rows.push({
            date, time: '', amount,
            category: guess.category, subTag: guess.subTag,
            merchant: guess.merchant, source: 'HL Bank CSV Import', notes: desc, type: desc,
            account: 'HL Bank',
            // Same reasoning as PBank — the Deposit/Withdrawal column the
            // amount actually came from tells you the real direction
            // outright, no need to guess from category/subtag.
            flow: withdrawal ? 'out' : 'in'
          });
        });
        resolve(rows);
      },
      error: reject
    });
  });
}

// ---- PDF parsing ----
// TNG's exported statement is a table with FIXED columns (Date, Status,
// Transaction Type, Reference, Description, Details, Amount (RM), Wallet
// Balance (RM)). Long cells (Reference, Details) wrap onto extra lines
// *within* a row, which breaks any parser that reconstructs plain text
// lines by grouping items purely by y-position (a wrapped cell's extra
// lines land in-between what should be two separate transaction rows).
// So instead of reconstructing "lines" at all, this works directly off
// pdf.js's positioned text items: find every Date-column item to mark
// row boundaries, then for every item between one row boundary and the
// next, bucket it into a column by its x position and join the pieces
// column-by-column.
const PDF_COLUMNS = [
  ['date', 0, 75],
  ['status', 75, 135],
  ['type', 135, 225],
  ['reference', 225, 290],
  ['description', 290, 455],
  ['details', 455, 650],
  ['amount', 650, 745],
  ['balance', 745, 100000],
];
const DATE_TOKEN_RE = /^\d{1,2}\/\d{1,2}\/\d{4}$/;
// Matches a time-of-day token like "14:23", "2:23:11", or "2:23 PM" —
// used to pick up the transaction time if the statement prints one
// anywhere in the row (commonly right next to the date).
const TIME_TOKEN_RE = /\b(\d{1,2}:\d{2}(?::\d{2})?\s?(?:AM|PM|am|pm)?)\b/;

// Normalizes a raw time token ("2:23 PM", "14:23:11", "9:05") to 24-hour
// "HH:MM" for storage/sorting; returns '' if it doesn't look like a time.
function normalizeTime(raw) {
  if (!raw) return '';
  const m = raw.trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s?(AM|PM|am|pm)?$/);
  if (!m) return '';
  let h = parseInt(m[1], 10);
  const min = m[2];
  const ampm = m[3] ? m[3].toUpperCase() : null;
  if (ampm === 'PM' && h < 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  if (h > 23) return '';
  return String(h).padStart(2, '0') + ':' + min;
}
const TXN_TYPES = ['DuitNow QR TNGD', 'PayDirect Payment', 'Transfer to Wallet', 'Receive from Wallet', 'RFID Payment', 'DuitNow QR', 'Reload', 'Payment', 'Cashback'];
const FOOTER_PATTERNS = [
  /\*?This is a system generated.*$/i,
  /email\.\s*For further enquiry.*$/i,
  /\+?603[\d\s]*$/,
  /\d{1,2}[:.]\d{2}\s?(am|pm) to \d{1,2}[:.]\d{2}\s?(am|pm).*$/i,
  /\(including public holidays\)\.?$/i,
  /Thank you\.?$/i,
];

function columnForX(x) {
  for (const [name, lo, hi] of PDF_COLUMNS) { if (x >= lo && x < hi) return name; }
  return 'balance';
}

function cleanMerchant(m) {
  FOOTER_PATTERNS.forEach(pat => { m = m.replace(pat, '').trim(); });
  m = m.replace(/\d{8,}.*$/, '').trim();
  return m;
}

// Parses one pdf.js page's text items (content.items, from getTextContent())
// into transaction records using the row/column reconstruction above.
function parsePdfPageItems(items) {
  const usable = items.filter(it => it.str && it.str.trim().length && it.transform);
  if (!usable.length) return [];
  // This statement's PDF page is rotated, so pdf.js's raw (unrotated)
  // per-item transform reports the axes swapped relative to how the page is
  // actually displayed: transform[5] is the horizontal/column position and
  // transform[4] is the vertical "distance down the page" (already
  // increasing downward, no flip needed) -- the reverse of the usual
  // bottom-left-origin convention. Verified against the real exported PDF's
  // actual pdf.js item coordinates.
  const withPos = usable.map(it => ({ x: it.transform[5], top: it.transform[4], str: it.str.trim() }));

  const dateRows = withPos.filter(it => it.x < 75 && DATE_TOKEN_RE.test(it.str));
  dateRows.sort((a, b) => a.top - b.top);
  if (!dateRows.length) return [];

  const records = [];
  for (let i = 0; i < dateRows.length; i++) {
    const rowTop = dateRows[i].top - 0.5;
    const rowBottom = i + 1 < dateRows.length ? dateRows[i + 1].top - 0.5 : Infinity;
    const rowItems = withPos.filter(it => it.top >= rowTop && it.top < rowBottom);
    rowItems.sort((a, b) => a.top - b.top || a.x - b.x);

    const cols = {};
    rowItems.forEach(it => { (cols[columnForX(it.x)] = cols[columnForX(it.x)] || []).push(it.str); });

    const dateRaw = (cols.date || [])[0];
    const typeStr = (cols.type || []).join(' ');
    let ttype = null;
    for (const t of TXN_TYPES) { if (typeStr.startsWith(t)) { ttype = t; break; } }
    if (!dateRaw || !ttype) continue;

    const amtStr = (cols.amount || []).join(' ');
    const amtMatch = amtStr.match(/RM\s?([\d,]+\.\d{2})/);
    if (!amtMatch) continue;
    const amount = parseFloat(amtMatch[1].replace(/,/g, ''));

    let merchant = cleanMerchant((cols.description || []).join(' '));
    if (!merchant) merchant = ttype;

    const dm = dateRaw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    const date = dm ? `${dm[3]}-${dm[2].padStart(2, '0')}-${dm[1].padStart(2, '0')}` : dateRaw;

    // Time isn't always in a fixed column — search every item in this row
    // (except the date token itself) for something that looks like a time.
    let time = '';
    for (const it of rowItems) {
      if (it.str === dateRaw) continue;
      const tm = it.str.match(TIME_TOKEN_RE);
      if (tm) { time = normalizeTime(tm[1]); if (time) break; }
    }

    records.push({ date, time, amount, merchant, type: ttype });
  }
  return records;
}

async function extractPdfRecords(file) {
  if (!window.pdfjsLib) throw new Error('PDF reader failed to load — check your connection and try again.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const loadingTask = pdfjsLib.getDocument({ data: buf });
  loadingTask.onPassword = (callback, reason) => {
    const msg = reason === 2 ? 'Incorrect password — try again:' : 'This PDF is password-protected. Enter the password:';
    const pwd = window.prompt(msg);
    callback(pwd || '');
  };
  const pdf = await loadingTask.promise;
  let records = [];
  let rawDump = null;
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    if (p === 1 && !rawDump) {
      rawDump = content.items.slice(0, 60).map((it, i) => {
        const x = Math.round(it.transform[4]);
        const y = Math.round(it.transform[5] * 10) / 10;
        return `${i}: x=${x} y=${y} "${it.str}"`;
      }).join('\n');
    }
    records = records.concat(parsePdfPageItems(content.items));
  }
  records.__rawDump = rawDump;
  return records;
}

async function parsePdfFile(file) {
  const records = await extractPdfRecords(file);

  if (!records.length) {
    const rawDump = records.__rawDump || '(none)';
    const err = new Error(`Couldn't recognize any transactions in that PDF.\n\nRaw items (page 1):\n${rawDump}`);
    err.diagnostic = true;
    throw err;
  }

  const rows = [];
  records.forEach(r => {
    const guess = categorize(r.merchant, r.type);
    if (!guess) return; // Reload / Transfer / Receive / Cashback — not spending
    rows.push({
      date: r.date, time: r.time || '', amount: r.amount,
      category: guess.category, subTag: guess.subTag,
      merchant: r.merchant, source: 'TNG PDF Import', notes: r.type, type: r.type,
      account: 'TNG'
    });
  });
  return rows;
}

// ---- Screenshot parsing (client-side OCR via Tesseract.js) ----
// The TNG "Activity"/"History" screen renders each transaction as 2-3
// stacked lines: a date+time line ("30 Jul, 18:45"), a merchant+amount line
// ("MC DER BOB BURGER   -RM11.00"), and an optional payment-method(+points)
// line ("DuitNow QR TNGD   +11 points"). Verified against real screenshots
// with Tesseract in --psm 6 ("assume a single uniform block of text") — the
// default auto page-segmentation mode was unreliable and dropped amounts
// entirely on some rows (especially Toll rows), --psm 6 recovered all of
// them. Tesseract.js groups same-line words into one text string per line
// (in left-to-right reading order) when running in this mode, which is
// exactly the row structure this parser expects.
const SCREENSHOT_DATE_RE = /^(\d{1,2})\s+([A-Za-z]{3}),?\s+(\d{1,2}:\d{2})$/;
const SCREENSHOT_MONTHS = { jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12' };
// Known toll plaza -> highway prefix, matching the "HIGHWAY - PLAZA" merchant
// text convention already used by past TNG PDF imports (e.g. "KESAS - AWAN
// BESAR WEST"). Unrecognized plazas are kept as just the plaza name — the
// CATEGORY_RULES keyword match (e.g. "AWAN BESAR") still works either way,
// this is purely cosmetic/consistency.
const TOLL_HIGHWAY_PREFIX = { 'AWAN BESAR': 'KESAS', 'PLAZA LOKE YEW': 'BESRAYA' };
const SCREENSHOT_TYPE_RE = /^[A-Za-z][A-Za-z0-9 ()\/.,:-]{2,}$/;

// The line right after a merchant+amount line is usually the payment method
// ("PayDirect Payment", "DuitNow QR TNGD"), sometimes with a "+11 points" /
// "0 points" badge merged onto the same OCR line — strip that off. Returns
// '' if the line doesn't look like a real payment-method string at all
// (e.g. stray OCR noise from icons/nav-bar text below the last transaction
// in the screenshot).
function extractScreenshotType(candidate) {
  if (!candidate) return '';
  if (/^Delayed on/i.test(candidate)) return '';
  const cleaned = candidate.replace(/[+-]?\d+\s*points\s*$/i, '').trim();
  if (!cleaned || !SCREENSHOT_TYPE_RE.test(cleaned)) return '';
  return cleaned;
}

// lines: OCR'd text, one string per visual line, top-to-bottom order.
function parseScreenshotLines(lines) {
  const dateIdxs = [];
  lines.forEach((l, i) => { if (SCREENSHOT_DATE_RE.test(l)) dateIdxs.push(i); });

  // The year isn't shown on each row ("30 Jul", not "30 Jul 2026") — assumes
  // the screenshot is recent (this year). Fix the date by hand afterward if
  // you're importing an old screenshot.
  const nowYear = new Date().getFullYear();
  const records = [];

  for (let k = 0; k < dateIdxs.length; k++) {
    const idx = dateIdxs[k];
    const m = lines[idx].match(SCREENSHOT_DATE_RE);
    const day = m[1].padStart(2, '0');
    const mon = SCREENSHOT_MONTHS[m[2].toLowerCase()] || '01';
    const time = m[3];
    const date = `${nowYear}-${mon}-${day}`;

    const merchantLine = lines[idx + 1] || '';
    const amtMatch = merchantLine.match(/([+-]?RM\s?[\d,]+\.\d{2})\s*$/i);
    if (!amtMatch) continue; // couldn't find an amount on this row — skip it

    const amount = parseFloat(amtMatch[1].replace(/[^0-9.]/g, ''));
    let merchant = merchantLine.slice(0, amtMatch.index).trim();

    let type = '';
    const nextIdx = idx + 2;
    if (nextIdx < lines.length && !SCREENSHOT_DATE_RE.test(lines[nextIdx])) {
      type = extractScreenshotType(lines[nextIdx]);
    }

    if (/^Reload$/i.test(merchant)) {
      type = 'Reload';
      merchant = 'Credit / Debit Card';
    } else {
      merchant = merchant.replace(/^Exit Toll:\s*/i, '').trim();
      const merchantUpper = merchant.toUpperCase();
      for (const plaza in TOLL_HIGHWAY_PREFIX) {
        if (merchantUpper.includes(plaza)) { merchant = TOLL_HIGHWAY_PREFIX[plaza] + ' - ' + merchant; break; }
      }
    }

    records.push({ date, time, amount, merchant, type });
  }
  return records;
}

async function extractScreenshotRecords(file) {
  if (!window.Tesseract) throw new Error('OCR library failed to load — check your connection and try again.');
  const worker = await Tesseract.createWorker('eng');
  let lines;
  try {
    await worker.setParameters({ tessedit_pageseg_mode: '6' });
    const { data } = await worker.recognize(file);
    lines = (data.lines || []).map(l => (l.text || '').trim()).filter(Boolean);
  } finally {
    await worker.terminate();
  }
  const records = parseScreenshotLines(lines);
  records.__rawLines = lines;
  return records;
}

async function parseScreenshotFile(file) {
  const records = await extractScreenshotRecords(file);
  if (!records.length) {
    const rawLines = (records.__rawLines || []).join('\n') || '(none)';
    const err = new Error(`Couldn't recognize any transactions in that screenshot.\n\nRecognized text:\n${rawLines}`);
    err.diagnostic = true;
    throw err;
  }
  const rows = [];
  records.forEach(r => {
    const guess = categorize(r.merchant, r.type);
    if (!guess) return;
    rows.push({
      date: r.date, time: r.time || '', amount: r.amount,
      category: guess.category, subTag: guess.subTag,
      merchant: r.merchant, source: 'TNG Screenshot Import', notes: r.type, type: r.type,
      account: 'TNG'
    });
  });
  return rows;
}

// ---- Preview / review step ----
function renderImportPreview() {
  importPreviewList.innerHTML = pendingImportRows.map((r, i) => {
    const { sign, cls: amtClass } = txnSignInfo(r);
    return `
    <div class="txn preview-row">
      <div class="preview-top">
        <div class="dot ${ALL_CATEGORIES.includes(r.category) ? r.category : 'Custom'}"></div>
        <div class="info">
          <div class="merchant">${txnTitle(r)}</div>
          <div class="meta">${r.date} · ${r.time || 'No time record'}</div>
        </div>
        <div class="${amtClass}">${sign}RM${Number(r.amount).toFixed(2)}</div>
        <span class="preview-remove" data-idx="${i}">✕</span>
      </div>
      <select data-cat-idx="${i}">${categoryOptionsHtml(r.category, r.subTag, r.account)}</select>
      <label class="preview-remember">
        <input type="checkbox" data-remember-idx="${i}"> Always categorize "${r.merchant}" this way
      </label>
    </div>
  `;
  }).join('');

  importPreviewList.querySelectorAll('[data-idx]').forEach(el => {
    el.onclick = () => {
      pendingImportRows.splice(Number(el.dataset.idx), 1);
      renderImportPreview();
      importSubmitBtn.textContent = `Import ${pendingImportRows.length} transactions`;
    };
  });
  importPreviewList.querySelectorAll('[data-cat-idx]').forEach(el => {
    el.onchange = () => {
      const idx = Number(el.dataset.catIdx);
      const [category, subTag] = el.value.split('|');
      pendingImportRows[idx].category = category;
      pendingImportRows[idx].subTag = subTag;
    };
  });
  importPreviewList.querySelectorAll('[data-remember-idx]').forEach(el => {
    el.onchange = () => {
      const idx = Number(el.dataset.rememberIdx);
      pendingImportRows[idx].rememberMerchant = el.checked;
    };
  });
}

function showImportPreview(rows) {
  pendingImportRows = rows;
  importStage = 'preview';
  importPickField.style.display = 'none';
  importPreviewList.style.display = 'flex';
  importBackBtn.style.display = 'block';
  renderImportPreview();
  importSubmitBtn.textContent = `Import ${pendingImportRows.length} transactions`;
  importStatusEl.textContent = pendingImportRows.length
    ? `Review the ${pendingImportRows.length} transactions below — fix the category if needed, tap ✕ to drop any that look wrong, then Import.`
    : '';
}

importSubmitBtn.onclick = async () => {
  if (importStage === 'pick') {
    const file = document.getElementById('fFile').files[0];
    if (!file) { importStatusEl.textContent = 'Choose a file first.'; return; }

    const importAccount = document.getElementById('importAccount').value;

    importStatusEl.className = 'status-msg';
    importStatusEl.textContent = importAccount === 'TNG-Screenshot'
      ? 'Reading screenshot… (OCR can take 10-30s, especially the first time)'
      : 'Reading file…';
    importSubmitBtn.disabled = true;
    let rows = [];
    try {
      if (importAccount === 'PBank') {
        rows = await parseBankACsvFile(file);
      } else if (importAccount === 'HL Bank') {
        rows = await parseBankBCsvFile(file);
      } else if (importAccount === 'TNG-Screenshot') {
        rows = await parseScreenshotFile(file);
      } else if (file.name.toLowerCase().endsWith('.pdf')) {
        rows = await parsePdfFile(file);
      } else {
        rows = await parseCsvFile(file);
      }
    } catch (err) {
      if (err && err.diagnostic) {
        importStatusEl.className = 'status-msg debug';
        importStatusEl.textContent = err.message;
      } else {
        importStatusEl.className = 'status-msg';
        importStatusEl.textContent = 'Could not read file: ' + (err && err.message ? err.message : err);
      }
      importSubmitBtn.disabled = false;
      return;
    }
    importSubmitBtn.disabled = false;

    if (!rows.length) { importStatusEl.textContent = 'No spending transactions found in that file.'; return; }
    showImportPreview(rows);
    return;
  }

  // importStage === 'preview' -> actually commit
  if (!pendingImportRows.length) { importStatusEl.textContent = 'Nothing left to import.'; return; }
  importStatusEl.textContent = `Importing ${pendingImportRows.length} transactions…`;
  importSubmitBtn.disabled = true;
  try {
    await callApi('import', { rows: pendingImportRows });
    importStatusEl.textContent = `Imported ${pendingImportRows.length} transactions.`;
    setTimeout(() => { importBackdrop.classList.remove('open'); loadData(); }, 800);
  } catch (err) {
    importStatusEl.textContent = 'Import failed — try again.';
    importSubmitBtn.disabled = false;
  }
};

loadData();
</script>
