<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trancker">
<meta name="theme-color" content="#0b0b0d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>Daily Spending Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<style>
  :root {
    --bg: #0b0b0d;
    --card: #17171b;
    --accent: #f5a623;
    --text: #f5f5f7;
    --muted: #8e8e93;
    /* Semantic palette: categories that are always spending (Car/Food/
       Shopping/Entertainment/Housing) get warm red/orange tones; Transfer
       stays neutral grey since money can move either direction; Unsure stays
       purple as a "needs review" flag. */
    --car: #ff453a;
    --shopping: #ff9f0a;
    --food: #ff6b35;
    --entertainment: #ffd60a;
    --housing: #ff7a9c;
    --unsure: #bf5af2;
    --transfer: #8e8e93;
    /* E-wallet Reload / TNG Card Top-up are still Transfer under the hood,
       but get their own yellow so they read as "internal transfer" at a
       glance, distinct from To Others/From Others/Internal's neutral grey. */
    --reload: #ffcc00;
    --income: #30d158;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    height: 100%; overscroll-behavior: none;
  }
  #app { max-width: 480px; margin: 0 auto; padding: env(safe-area-inset-top) 16px 100px; }
  header { padding: 18px 0 8px; }
  header h1 { font-size: 28px; margin: 0; font-weight: 700; }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .icon-btn {
    background: var(--card); border: none; color: var(--text); width: 40px; height: 40px;
    border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
  }
  .icon-btn.active { background: var(--accent); }
  .page-tabs { display: flex; gap: 8px; margin-top: 14px; }
  /* "Hide balance" mode — blurs only your real current-balance figures (the
     Overall "Balance" stat and the per-account/Card true-balance lines under
     the mini pies) so you can show the app to someone else without revealing
     how much money you actually have. Expense/Income, period totals,
     transaction amounts and charts all stay visible — those aren't what
     people are usually cagey about sharing. */
  body.hide-balance #statBalance,
  body.hide-balance .mini-chart-truebalance,
  body.hide-balance #statIncome,
  body.hide-balance .txn .amount.in,
  body.hide-balance #statBreakdown.breakdown-balance,
  body.hide-balance #statBreakdown.breakdown-income,
  body.hide-balance .total-all-value.income {
    filter: blur(7px);
    user-select: none;
  }
  .page-tab {
    position: relative;
    padding: 8px 16px; border-radius: 999px; background: var(--card); color: var(--text);
    font-size: 13px; font-weight: 500; border: 1px solid transparent;
  }
  .page-tab.active { background: #0a84ff; color: #fff; }
  .insights-subnav { display: flex; gap: 8px; margin: 4px 0 14px; }
  .insights-subtab {
    flex: 1; text-align: center; padding: 8px 0; border-radius: 10px;
    background: var(--card); color: var(--muted); font-size: 13px; border: none; font-weight: 500;
  }
  .insights-subtab.active { background: #1e1e22; color: var(--text); }
  .history-section-label-row { display: flex; justify-content: space-between; align-items: center; margin: 0 0 8px; gap: 8px; }
  .history-section-label-row .history-section-label { margin: 0; }
  .tab-badge {
    position: absolute; top: -6px; right: -6px; background: #ffb300; color: #1a1a1a;
    font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; line-height: 16px;
    border-radius: 999px; padding: 0 3px; text-align: center;
  }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
  .cal-nav-btn { background: var(--card); color: var(--text); font-size: 18px; width: 36px; height: 36px; border-radius: 10px; border: none; }
  #calMonthLabel { font-size: 15px; font-weight: 500; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .cal-weekdays span { text-align: center; font-size: 11px; color: var(--muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
  .cal-day {
    background: var(--card); border-radius: 10px; padding: 6px; min-height: 52px;
    border: 2px solid transparent; text-align: left; position: relative;
  }
  .cal-day.empty-cell { background: none; }
  .cal-day .cal-day-num { font-size: 12px; color: var(--muted); display: block; }
  .cal-day .cal-day-amt { font-size: 11px; font-weight: 500; margin-top: 12px; display: block; white-space: nowrap; }
  .cal-day.selected { border-color: var(--accent); }
  .cal-day-income-dot {
    position: absolute; top: 5px; right: 5px; width: 6px; height: 6px;
    border-radius: 50%; background: #30d158;
  }
  .cal-day-panel { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .cal-day-panel .cal-day-panel-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .cal-day-panel .cal-day-panel-head span:first-child { font-size: 15px; font-weight: 500; }
  .cal-day-panel .cal-day-panel-head span:last-child { font-size: 15px; font-weight: 500; color: var(--accent); }
  .cal-account-header {
    display: flex; justify-content: space-between; font-size: 12px; color: var(--muted);
    margin: 12px 2px 6px; text-transform: uppercase; letter-spacing: 0.02em;
  }

  .trend-group-toggle { display: flex; gap: 8px; margin: 4px 0 14px; }
  .trend-group-btn {
    flex: 1; text-align: center; padding: 8px 0; border-radius: 10px;
    background: var(--card); color: var(--muted); font-size: 13px; border: none;
  }
  .trend-group-btn.active { background: #1e1e22; color: var(--text); }
  .trend-card { background: var(--card); border-radius: 14px; padding: 14px; }
  .trend-card-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .trend-card-value { font-size: 20px; font-weight: 600; margin-bottom: 14px; }
  .trend-delta { font-size: 12px; font-weight: 400; margin-left: 6px; }
  .trend-delta.up { color: var(--car); }
  .trend-delta.down { color: var(--income); }
  .trend-chart-wrap { position: relative; height: 180px; }

  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-entry { background: var(--card); border-radius: 12px; padding: 10px 14px; }
  .history-entry.linked { cursor: pointer; }
  .history-entry.linked:active { opacity: 0.7; }
  .txn.jump-highlight { animation: jumpFlash 1.6s ease-out; border-radius: 12px; }
  @keyframes jumpFlash {
    0% { background: rgba(10, 132, 255, 0.35); }
    100% { background: transparent; }
  }
  .history-entry .history-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .history-entry .history-action { font-size: 12px; color: var(--accent); font-weight: 500; }
  .history-entry .history-time { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .history-entry .history-details { font-size: 14px; margin-top: 4px; }
  .history-summary { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .history-summary-row { background: var(--card); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .history-summary-row .acct { font-size: 14px; font-weight: 600; }
  .history-summary-row .when { font-size: 12px; color: var(--muted); text-align: right; }
  .history-section-label { font-size: 12px; color: var(--muted); margin: 0 2px 8px; }
  .review-entry { background: var(--card); border-radius: 12px; padding: 12px 14px; border: 1px solid #3a2f12; }
  .review-entry .review-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .review-entry .review-title { font-size: 14px; font-weight: 600; }
  .review-entry .review-amount { font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .review-entry .review-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .review-entry .review-note { font-size: 12px; color: #ffd60a; font-style: italic; margin-top: 4px; }
  .review-actions { display: flex; gap: 8px; margin-top: 10px; }
  .review-btn { flex: 1; border: none; border-radius: 8px; padding: 7px 0; font-size: 13px; font-weight: 600; cursor: pointer; }
  .review-btn.confirm { background: #1f3d2b; color: #30d158; }
  .review-btn.delete { background: #3d1f22; color: #ff453a; }

  .split-group { background: var(--card); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .split-group-header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .split-group-name { font-size: 14px; font-weight: 600; }
  .split-group-net { font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .split-group-rows { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .split-group-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .split-group-row .sgr-amt.in { color: #30d158; }
  .split-group-row .sgr-amt.out { color: #ff453a; }
  .split-group-summary { font-size: 12px; color: var(--muted); margin-top: 8px; border-top: 1px solid #3a3a3c; padding-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
  .split-group-summary b { color: var(--text); }
  .split-group-viewlist { margin-top: 10px; width: 100%; }

  .split-picker-list { display: flex; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; margin: 10px 0; }
  .split-picker-option {
    padding: 14px 14px; border-radius: 10px; background: #2c2c2e; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    border: 2px solid transparent;
  }
  .split-picker-option.selected { border-color: var(--accent); background: #241c0f; }
  .split-picker-option .spo-count { color: var(--muted); font-size: 11px; flex-shrink: 0; margin-left: 8px; }
  .split-picker-empty { font-size: 12px; color: var(--muted); padding: 2px 0 10px; }
  .split-picker-actions { display: flex; gap: 8px; margin-top: 4px; }
  .split-picker-actions .btn { flex: 1; }
  .split-picker-clear { background: #3d1f22; color: #ff453a; border: none; border-radius: 10px; padding: 12px 0; font-size: 15px; font-weight: 600; cursor: pointer; flex: 1; }
  .page-updated { text-align: center; font-size: 11px; color: var(--muted); margin: -4px 0 12px; }
  /* Back to the original 3-across row for Today/This week/This month —
     All time now lives in its own full-width rectangle below (see
     .totals-all) instead of being a 4th card squeezed into this row. */
  .totals { display: flex; gap: 10px; margin: 14px 0 10px; }
  .total-card { flex: 1; min-width: 0; background: var(--card); border-radius: 14px; padding: 12px; }
  .total-card .label { font-size: 12px; color: var(--muted); }
  .total-card .value { font-size: 18px; font-weight: 700; margin-top: 4px; white-space: nowrap; }
  @media (max-width: 400px) {
    .total-card .value { font-size: 15px; }
  }
  .total-card .sub { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .total-card { cursor: pointer; border: 1px solid transparent; }
  /* All time: a single wide rectangle with Expense/Income side by side,
     colored the same way (red/green) and sized the same as each other —
     unlike the earlier cramped 4th-card version, there's room here to show
     both numbers clearly instead of one muted and one bold. */
  .totals-all { margin: 0 0 14px; }
  .total-card-all { background: var(--card); border-radius: 14px; padding: 14px 16px; cursor: pointer; border: 1px solid transparent; }
  .total-card-all.active { border-color: var(--accent); background: #241c0f; }
  .total-card-all .label { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .total-all-row { display: flex; justify-content: space-around; align-items: center; }
  .total-all-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .total-all-label { font-size: 11px; color: var(--muted); }
  .total-all-value { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .total-all-value.expense { color: #ff453a; }
  .total-all-value.income { color: #30d158; }
  @media (max-width: 400px) {
    .total-all-value { font-size: 17px; }
  }
  .total-card.active { border-color: var(--accent); background: #241c0f; }
  .filters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; }
  .filter-chip {
    flex-shrink: 0; padding: 8px 14px; border-radius: 999px; background: var(--card);
    color: var(--text); font-size: 14px; border: 1px solid transparent;
  }
  .filter-chip.active { background: var(--accent); color: #1a1a1a; font-weight: 600; }
  .subfilters { display: none; gap: 6px; overflow-x: auto; padding: 0 0 12px; margin-top: -6px; }
  .subfilters .filter-chip { padding: 6px 12px; font-size: 12px; }
  .accountfilters .filter-chip { padding: 6px 12px; font-size: 12px; border: 1px solid #2c2c2e; }
  .accountfilters .filter-chip.active { background: #0a84ff; color: #fff; }

  .chart-card {
    background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 14px;
  }
  .chart-card .chart-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .chart-card .chart-head span { font-size: 13px; color: var(--muted); }
  .chart-mode-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
  .chart-mode-btn {
    background: #1c1c1e; border: 1px solid transparent; color: var(--muted);
    border-radius: 999px; padding: 6px 14px; font-size: 12px; cursor: pointer;
  }
  .chart-mode-btn.active { background: var(--accent); color: #1a1a1a; font-weight: 600; }
  .chart-wrap { position: relative; height: 180px; }
  .chart-stats { display: flex; gap: 10px; margin-bottom: 10px; }
  .chart-stats .stat { flex: 1; text-align: center; }
  .chart-stats .stat-label { display: block; font-size: 11px; color: var(--muted); }
  .chart-stats .stat-value { display: block; font-size: 15px; font-weight: 700; margin-top: 2px; }
  .chart-stats .stat-value.expense { color: #ff453a; }
  .chart-stats .stat-value.income { color: #30d158; }
  .chart-stats .stat-value.positive { color: #30d158; }
  .chart-stats .stat-value.negative { color: #ff453a; }
  .chart-stats .stat { cursor: pointer; }
  .stat-breakdown { display: none; margin: 10px 0 4px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); }
  .stat-breakdown.show { display: block; }
  .stat-breakdown-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 3px 0; }
  .stat-breakdown-row.total { color: #f5f5f7; font-weight: 600; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 4px; padding-top: 6px; }
  .stat-breakdown-note { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 8px; }
  .chart-loading {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--card); border-radius: 10px;
  }
  .chart-loading.show { display: flex; }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%; border: 3px solid #2c2c2e;
    border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  .mini-chart-wrap .spinner { width: 18px; height: 18px; border-width: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search-row { margin-bottom: 10px; }
  .search-row input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: none;
    background: var(--card); color: var(--text); font-size: 14px;
  }
  .search-row input::placeholder { color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .toolbar select {
    flex: 1; min-width: 120px; padding: 9px 10px; border-radius: 10px; border: none; background: var(--card);
    color: var(--text); font-size: 13px;
  }
  .toolbar-secondary { margin: -2px 0 10px; }
  .toolbar-btn {
    background: var(--card); border: 1px solid rgba(255,255,255,0.08); color: var(--text);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; flex-shrink: 0;
  }
  .toolbar .toolbar-btn { align-self: center; }
  .toolbar .toolbar-btn.active { border-color: var(--accent); color: var(--accent); }
  .trend-range-row { display: none; align-items: center; gap: 8px; margin: -6px 0 14px; font-size: 12px; color: var(--muted); }
  .trend-range-row.show { display: flex; }
  .range-date-btn {
    background: var(--card); border: 1px solid rgba(255,255,255,0.08); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font-size: 12px; cursor: pointer;
  }
  .range-date-btn.active { border-color: var(--accent); color: var(--accent); }
  .mini-cal-popup { display: none; background: var(--card); border-radius: 14px; padding: 12px; margin: -8px 0 14px; }
  .mini-cal-popup.show { display: block; }
  .mini-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .mini-cal-head span { font-size: 13px; font-weight: 500; }
  .mini-cal-head .cal-nav-btn { width: 28px; height: 28px; font-size: 15px; border-radius: 8px; }
  .mini-cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .mini-cal-weekdays span { text-align: center; font-size: 10px; color: var(--muted); }
  .mini-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .mini-cal-day {
    background: #1c1c1e; border-radius: 8px; padding: 7px 0; text-align: center;
    font-size: 12px; color: var(--text); border: 1px solid transparent; cursor: pointer;
  }
  .mini-cal-day.empty-cell { background: none; cursor: default; }
  .mini-cal-day.selected { background: var(--accent); color: #1a1a1a; font-weight: 600; }
  .mini-cal-day.in-range { border-color: var(--accent); }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .day-group { margin-top: 10px; }
  .day-header {
    font-size: 13px; color: var(--muted); margin: 10px 2px 6px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .day-header.collapsible { cursor: pointer; }
  .day-header-left { display: flex; align-items: center; gap: 6px; }
  .day-chevron { display: inline-block; font-size: 9px; transition: transform 0.15s; transform: rotate(0deg); }
  .day-header.collapsed .day-chevron { transform: rotate(-90deg); }
  .txn {
    background: var(--card); border-radius: 14px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.Car { background: var(--car); }
  .dot.Shopping { background: var(--shopping); }
  .dot.Food { background: var(--food); }
  .dot.Entertainment { background: var(--entertainment); }
  .dot.Housing { background: var(--housing); }
  .dot.Unsure { background: var(--unsure); }
  .dot.Transfer { background: var(--transfer); }
  .dot.Reload { background: var(--reload); }
  .dot.Income { background: var(--income); }
  .dot.Custom { background: var(--muted); }
  .txn .info { flex: 1; min-width: 0; }
  .txn .merchant { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbc-flag {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 1px 6px; border-radius: 8px; background: #ffd60a;
    color: #1a1a1a; font-size: 10px; font-weight: 800; margin-left: 5px;
    vertical-align: middle; flex-shrink: 0; cursor: default; white-space: nowrap;
  }
  .txn .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .txn .amount { font-size: 15px; font-weight: 700; color: #ff453a; }
  .txn .amount.in { color: #30d158; }
  .txn .amount.internal { color: #ffd60a; }
  .transfer-hint { font-size: 11px; color: #0a84ff; margin-top: 2px; }
  .txn-cat-select {
    margin-top: 5px; font-size: 11px; background: var(--bg); color: var(--muted);
    border: 1px solid #2c2c2e; border-radius: 6px; padding: 3px 4px; max-width: 100%;
  }
  .txn-extratag-select {
    margin-top: 5px; margin-left: 6px; font-size: 11px; background: var(--bg); color: var(--muted);
    border: 1px dashed #3a3a3c; border-radius: 6px; padding: 3px 4px; max-width: 100%;
  }
  .txn-extratag-select.has-extra { color: var(--accent); border-color: var(--accent); }
  .txn-extratag-amount {
    margin-top: 5px; margin-left: 6px; font-size: 11px; background: var(--bg); color: var(--text);
    border: 1px dashed var(--accent); border-radius: 6px; padding: 3px 4px; width: 92px;
  }
  .cat-select-row { display: flex; flex-wrap: wrap; align-items: center; }

    color: var(--text); font-size: 16px;
  }

  input[type=file] { color: var(--muted); }

<script>
// ==========================================================================
// This is a STANDALONE static page — it is NOT served by Apps Script.
// Host it anywhere (Netlify, GitHub Pages, Firebase Hosting, etc). All
// read/write calls hit the Apps Script /exec URL below as a plain JSON API
// via fetch(), instead of google.script.run (which only works when the
// page itself is served by HtmlService). This sidesteps the iOS Safari/
// Chrome bug where navigating directly to a script.google.com URL can fail
// with "Sorry, unable to open the file at present" (a known Apps Script +
// iOS multi-account redirect/cookie issue) — here script.google.com is
// only ever hit via background fetch() calls, never a full-page load.
// ==========================================================================
// NOTE: this project has (had) two separate Web App deployments of the same
// Apps Script — this URL previously pointed at a second deployment that had
// drifted to an old code version (stuck missing several fixes, including the
// Transfer/Income categories). Consolidated onto the one deployment that's
// consistently redeployed going forward, to remove that class of bug.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzRudNZs6s441X981A3t7uvHV7RiAB6enG7PB4orjsfujDARbm9kfgjdfmG9usyebXX2Q/exec';

// POST helper. Uses Content-Type: text/plain so the request stays a CORS
// "simple request" (no OPTIONS preflight) — Apps Script web apps can't
// answer custom preflight requests.
async function callApi(action, extra) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, extra))
  });
  return res.json();
}

// Category rules — mirrors Code.gs CATEGORY_RULES exactly. Used by manual
// add fallback, CSV import, and PDF import to pre-guess a category before
// the user reviews/confirms it.
const CATEGORY_RULES = [
  { category: 'Transfer', subTag: 'Card Reload', keywords: ['CARD RELOAD'] },
  { category: 'Car', subTag: 'Toll', keywords: [
    'SPE', 'KESAS', 'LDP', 'MEX', 'BESRAYA', 'SUKE', 'SMART',
    'PLAZA LOKE YEW', 'AWAN BESAR', 'PUCHONG SELATAN', 'SG RAMAL',
    'SALAK SELATAN', 'PETALING JAYA', 'ALAM DAMAI', 'BUKIT TERATAI',
    'AMPANG', 'SUNWAY'
  ] },
  { category: 'Car', subTag: 'Parking', keywords: ['PARKING', 'CARPARK', 'CAR PARK'] },
  { category: 'Car', subTag: 'Fuel', keywords: ['PETRONAS', 'SHELL', 'PETRON', 'CALTEX', 'BHP'] },
  { category: 'Car', subTag: 'Service', keywords: ['WORKSHOP', 'BENGKEL', 'TAYAR', 'SERVICE CENTRE', 'AUTO CARE', 'CAR WASH', 'CARWASH'] },
  { category: 'Car', subTag: 'Ride', keywords: ['GRAB', 'MYCAR', 'INDRIVE'] },
  // Council/traffic compounds (e.g. MBSJ RM80) — most local-council payments
  // that show up on a bank/e-wallet statement this way are parking or
  // traffic fines, so this lives under Car rather than as its own category.
  { category: 'Car', subTag: 'Fine', keywords: ['MBSJ', 'MBPJ', 'MBSA', 'MBI', 'DBKL', 'MPAJ', 'MPS', 'SAMAN', 'COMPOUND'] },
  // "Groceries" was renamed to "Shopping" to also cover online orders (see
  // the new Online subtag below) — not just grocery runs.
  { category: 'Shopping', subTag: 'Convenience Store', keywords: ['MYNEWS', '7-ELEVEN', 'KK MART'] },
  // Dress-type merchants are folded into Hypermarket rather than their own
  // subtag — the merchant name itself still shows which one it was.
  { category: 'Shopping', subTag: 'Hypermarket', keywords: [
    'AEON SMKT', 'SPEEDMART', 'TESCO', 'LOTUS', 'GIANT', 'JAYA GROCER',
    'VILLAGE GROCER', 'ECONSAVE', 'PACIFIC', 'MR D.I.Y',
    'AEON DEPT', 'FASHION', 'UNIQLO', 'PADINI', 'H&M'
  ] },
  { category: 'Shopping', subTag: 'Online', keywords: ['PINDUODUO', 'GWP', 'SHOPEE', 'LAZADA', 'TAOBAO'] },
  // Health/skincare shops — pharmacies specifically, not general Shopping.
  { category: 'Shopping', subTag: 'Pharmacies', keywords: [
    'GUARDIAN', 'WATSON', 'CARING PHARMACY', 'BIG PHARMACY', 'ALPRO PHARMACY',
    'HEALTH LANE', 'AEON WELLNESS'
  ] },
  // Grooming — haircuts, salons, spas. Lives under Shopping (things you
  // spend on yourself) alongside Pharmacies rather than as its own
  // top-level category.
  { category: 'Shopping', subTag: 'Personal Care', keywords: [
    'SALON', 'HAIR', 'BARBER', 'SPA'
  ] },
  { category: 'Food', keywords: [
    'KOPITIAM', 'RESTORAN', 'RESTAURANT', 'MIXED RICE', 'KITCHEN',
    'BURGER', 'RAMEN', 'CHAGEE', 'LAUK', 'BUN', 'THONG KEE', 'YCS',
    'CAFE', 'MAKAN', 'CIKTA', 'SUSHI'
  ] },
  { category: 'Entertainment', keywords: ['CTRL PLAY', 'CINEMA', 'GSC', 'TGV', 'LIBRARY', 'PC BANG', 'CYBERCAFE', 'ZAIKO'] },
  { category: 'Entertainment', subTag: 'Subscription', keywords: [
    'APPLE SERVICES', 'NETFLIX', 'SPOTIFY', 'APP STORE', 'GOOGLE PLAY',
    'ANTHROPIC', 'CLAUDE', 'EXITLAG'
  ] },
  { category: 'Sports', keywords: [
    'SPORTS CENTRE', 'SPORT CENTRE', 'GYM', 'FITNESS', 'BADMINTON',
    'FUTSAL', 'SWIMMING POOL'
  ] },
  { category: 'Housing', subTag: 'Rent', keywords: ['RENT'] },

// Learned per-merchant/per-person rules (e.g. "Ooi KX" -> Food), loaded
// from the backend on startup. Checked BEFORE the built-in keyword rules,
// same priority order as Code.gs's categorize_().
let merchantRules = [];

// "True balance" anchors — [{ account, asOfDate, asOfBalance }, ...] loaded
// from the AccountBalances sheet. Accounts with no entry here (e.g. Cash,
// whose real on-hand cash is hard to pin down) just don't show a true
// balance. See trueBalanceFor() below for how this combines with allTxns.
let accountBalances = [];

// Real running balance for one account: the anchor you gave (asOfBalance,
// as of asOfDate) plus every transaction on that account dated AFTER the
// anchor, summed by its REAL flow direction across every category — unlike
// the Income-Expense "Balance" stat (which deliberately excludes Transfer
// so wallet top-ups/sends don't inflate spend totals), this is meant to
// track your actual account balance, so nothing is excluded here. Returns
// null if this account has no anchor set yet.
function trueBalanceFor(account) {
  const anchor = accountBalances.find(b => b.account === account);
  if (!anchor) return null;
  // TNG Card used to be a pseudo-account computed purely from TNG rows
  // tagged "TNG Card Top-up" (an elimination guess, since the physical
  // Card's own statement wasn't imported anywhere yet) — it only ever went
  // up, since no data source captured Card spend (parking/tolls off the
  // Card itself). Now that the real Card statement can be imported (see
  // the "TNG Card (PDF or CSV)" option), TNG Card is a real account with
  // its own rows on both sides — reload-in AND parking spend-out — so its
  // balance comes straight from those, same as every other account. A
  // Card top-up is also now known to be a genuine transfer OUT of the
  // eWallet (confirmed against the real Card + eWallet statements), so
  // it's no longer excluded from TNG's own balance either. The two old
  // pseudo-tagged rows from before this fix (2026-07-10, 2026-07-29) both
  // predate every account's anchor date, so this change doesn't move
  // today's numbers — it only affects new imports going forward.
  const relevant = allTxns.filter(t => t.account === account);
  const after = relevant.filter(t => t.date > anchor.asOfDate);
  const delta = after.reduce((s, t) => s + (txnFlow(t) === 'in' ? Number(t.amount || 0) : -Number(t.amount || 0)), 0);
  return anchor.asOfBalance + delta;
}

// The Overall "Balance" stat is your real money right now, not an
// Income-Expense flow for whatever period is selected — so it's the sum of
// every account's true running balance (TNG eWallet, HL Bank, PBank, TNG
// Card), skipping Cash since it has no starting balance anchor. Unlike
// Expense/Income above it, this number doesn't change when you tap
// Today/This week/This month.
function currentBalanceTotal() {
  return ['TNG', 'HL Bank', 'PBank', 'TNG Card'].reduce((s, a) => {
    const b = trueBalanceFor(a);
    return s + (b === null ? 0 : b);
  }, 0);
}

// "Updated 30 Jul 2026" — the date you last told the tracker this account's
// real balance, shown under each true-balance line so it's clear how fresh
// (or stale) that anchor is, separate from the running total computed on
// top of it.
function formatAnchorDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return '';
  return 'Updated ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function categorize(description, type) {
  if (EXCLUDE_TYPES.includes(type)) return null;

  // Reload = card -> TNG wallet top-up, not spending. Filed under Transfer >
  // Card Reload; can be re-categorized by hand later once you know what a
  // specific reload was actually for.
  if (type === 'Reload') return { category: 'Transfer', subTag: 'Card Reload' };

  // Receive from Wallet (someone sent you money) / Cashback (rewards
  // rebate) are money coming IN, not spending. Filed under Transfer > From
  // Others — no separate "Income" category anymore.
  if (type === 'Receive from Wallet' || type === 'Cashback') {
    return { category: 'Transfer', subTag: 'From Others' };
  }

  const text = (description || '').toUpperCase();

  for (const r of merchantRules) {
    if (r.merchant && text.includes(r.merchant.toUpperCase())) {
      return { category: r.category, subTag: r.subTag || '' };
    }
  }
  for (const rule of CATEGORY_RULES) {
    for (const kw of rule.keywords) {
      if (text.includes(kw)) return { category: rule.category, subTag: rule.subTag || '' };
    }
  }

  // Unresolved person-to-person send -> Transfer > To Others; anything else
  // unmatched -> plain Unsure (no subtag).
  if (type === 'Transfer to Wallet') return { category: 'Transfer', subTag: 'To Others' };
  return { category: 'Unsure', subTag: '' };
}

// Total real spend (same definition as the Today/Week/Month stat cards —
// Transfer/Income excluded) for one calendar day, across every account.
// Plain formatSignedRM() on a big day (e.g. "-RM1428") is too wide for the
// narrow 7-column calendar grid at a readable font size and wraps onto a
// second line, making that one cell taller than its neighbors. Above
// RM1000 this abbreviates to "-RM1.4K" instead, so every cell's amount
// always fits on one line.
function formatCompactRM(amount) {
  const abs = Math.abs(amount);
  const sign = amount > 0 ? '-RM' : (amount < 0 ? '+RM' : 'RM');
  if (abs >= 1000) {
    const k = abs / 1000;
    return sign + (k >= 10 ? k.toFixed(0) : k.toFixed(1)) + 'K';
  }
  return sign + abs.toFixed(0);
}

function calendarDayTotal(dateStr) {
  const dayTxns = allTxns.filter(t => t.date === dateStr && !NON_SPEND_CATEGORIES.includes(t.category));
  return dayTxns.reduce((s, t) => s + spendAmount(t), 0);
}

// The heatmap deliberately stays spend-only (so it keeps answering "how much
// did I spend that day", not "net money that day" — a big payday would
// otherwise swamp the color scale and hide real spend patterns). Income days
// (e.g. payday) still deserve to stand out somehow, so a small green dot
// flags any day that had a real Income-category inflow, without touching
// the color/total logic above. Requires txnFlow(t) === 'in' too — an
// Income-category row can still be a real outflow (e.g. a bank interest
// CHARGE filed under Income · Interest with flow explicitly set to 'out'),
// and that shouldn't get a "money came in" dot.
function calendarDayHasIncome(dateStr) {
  return allTxns.some(t => t.date === dateStr && t.category === 'Income' && txnFlow(t) === 'in');
}

// Continuous heat scale for the calendar grid, on a fixed RM scale (not
// relative to the month's heaviest day, so a given amount always looks the
// same color regardless of which month you're viewing): RM0-300 fades light
// yellow to red, RM300-1000 fades red into brown, RM1000+ stays brown.
const HEAT_LIGHT_YELLOW = [255, 235, 130];
const HEAT_RED = [255, 69, 58];
const HEAT_BROWN = [139, 69, 19];
function lerpChannel(a, b, t) { return Math.round(a + (b - a) * t); }
function heatColorForAmount(amount) {
  if (amount <= 300) {
    const t = Math.max(0, amount) / 300;
    return [
      lerpChannel(HEAT_LIGHT_YELLOW[0], HEAT_RED[0], t),
      lerpChannel(HEAT_LIGHT_YELLOW[1], HEAT_RED[1], t),
      lerpChannel(HEAT_LIGHT_YELLOW[2], HEAT_RED[2], t)
    ];
  }
  const t = Math.min(1, (amount - 300) / 700);
  return [
    lerpChannel(HEAT_RED[0], HEAT_BROWN[0], t),
    lerpChannel(HEAT_RED[1], HEAT_BROWN[1], t),
    lerpChannel(HEAT_RED[2], HEAT_BROWN[2], t)
  ];
}
// Picks readable text (near-black vs near-white) against whatever heat color
// just came out of heatColorForRatio(), using standard perceived-luminance.
function heatTextColor(rgb) {
  const luminance = 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2];
  return luminance > 150 ? '#1a1a1a' : '#f5f5f7';
}

function renderCalendar() {
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  document.getElementById('calMonthLabel').textContent =
    calendarMonth.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  document.getElementById('calUpdated').textContent = lastUpdatedLabel();

  const startWeekday = new Date(year, month, 1).getDay(); // 0 = Sun
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const totalsByDay = {};
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    totalsByDay[dateStr] = calendarDayTotal(dateStr);
  }

  let html = '';
  for (let i = 0; i < startWeekday; i++) html += '<div class="cal-day empty-cell"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const total = totalsByDay[dateStr];
    let styleAttr = '';
    let numStyle = '';
    let amtStyle = '';
    if (total > 0) {
      const rgb = heatColorForAmount(total);
      const txt = heatTextColor(rgb);
      styleAttr = ` style="background:rgb(${rgb[0]},${rgb[1]},${rgb[2]});"`;
      numStyle = ` style="color:${txt};opacity:0.8;"`;
      amtStyle = ` style="color:${txt};"`;
    }
    const selectedClass = dateStr === selectedCalendarDay ? 'selected' : '';
    const incomeDot = calendarDayHasIncome(dateStr) ? '<span class="cal-day-income-dot" title="Income received"></span>' : '';
    html += `<button class="cal-day ${selectedClass}" data-date="${dateStr}"${styleAttr}>
      ${incomeDot}
      <span class="cal-day-num"${numStyle}>${d}</span>
      ${total !== 0 ? `<span class="cal-day-amt"${amtStyle}>${formatCompactRM(total)}</span>` : ''}
    </button>`;
  }
  document.getElementById('calGrid').innerHTML = html;
  document.querySelectorAll('.cal-day[data-date]').forEach(el => {
    el.onclick = () => {
      selectedCalendarDay = (selectedCalendarDay === el.dataset.date) ? null : el.dataset.date;
      renderCalendar();
    };
  });

  renderCalDayPanel();
}

// The full-size day detail panel underneath the grid — reuses renderTxnRow()
// and the same attach*Handlers() so a transaction can be edited (category,
// remark, extra tag) from right here, exactly like the Main list.
function renderCalDayPanel() {
  const panelEl = document.getElementById('calDayPanel');
  if (!selectedCalendarDay) { panelEl.innerHTML = ''; return; }
  const dayTxns = sortTxns(allTxns.filter(t => t.date === selectedCalendarDay));
  const total = dayTxns
    .filter(t => !NON_SPEND_CATEGORIES.includes(t.category))
    .reduce((s, t) => s + spendAmount(t), 0);
  const dateObj = new Date(selectedCalendarDay + 'T00:00:00');
  const label = dateObj.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

  let html = `<div class="cal-day-panel"><div class="cal-day-panel-head"><span>${label}</span><span>${formatSignedRM(total)}</span></div>`;
  if (!dayTxns.length) {
    html += '<div class="empty">No transactions.</div>';
  } else {
    // Grouped by account (TNG/HL Bank/PBank/Cash order, any other account
    // after) so a day touching multiple accounts reads as separate blocks
    // instead of one interleaved list.
    const byAccount = {};
    dayTxns.forEach(t => {
      const acct = t.account || 'Other';
      (byAccount[acct] = byAccount[acct] || []).push(t);
    });
    const order = ACCOUNTS.filter(a => byAccount[a]).concat(Object.keys(byAccount).filter(a => !ACCOUNTS.includes(a)));
    order.forEach(acct => {
      const acctTxns = byAccount[acct];
      const acctTotal = acctTxns
        .filter(t => !NON_SPEND_CATEGORIES.includes(t.category))
        .reduce((s, t) => s + spendAmount(t), 0);
      html += `<div class="cal-account-header"><span>${acct}</span><span>${formatSignedRM(acctTotal)}</span></div>`;
      html += acctTxns.map(t => renderTxnRow(t)).join('');
    });
  }
  html += '</div>';
  panelEl.innerHTML = html;
  attachCatSelectHandlers();
  attachExtraTagHandlers();
  attachExtraTagAmountHandlers();
  attachRemarkHandlers();
  attachLinkHandlers();
}

// Trends page — bar-chart comparison of spend across recent periods for a
// chosen category/subtag, e.g. "Car · Toll, last 6 months". Bars (not a
// candlestick — there's no open/high/low/close for spending, so a bar per
// period is the honest analog) with the most recent period highlighted, plus
// a %-change readout vs the period before it.

// 'YYYY-MM' for month grouping, or the Monday-of-that-week date ('YYYY-MM-DD')
// for week grouping — the bucket a given transaction date falls into.
function trendBucketKey(dateStr, group) {
  if (group === 'month') return dateStr.slice(0, 7);
  if (group === 'day' || group === 'custom') return dateStr.slice(0, 10);
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day; // shift back to that week's Monday
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}
// "31 Jul - 14 Aug" — the human label for a custom date range.
function formatRangeLabel(from, to) {
  if (!from || !to) return '';
  const f = (s) => new Date(s + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return `${f(from)} - ${f(to)}`;
}
function trendBucketLabel(key, group) {
  if (group === 'month') {
    const [y, m] = key.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'short' });
  }
  const d = new Date(key + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

// Same present-in-data-only chip pattern as renderFilters()/renderSubFilters()
// on the Main page, adapted for MULTI-select — tapping "All" resets to the
// single combined-total view; tapping any specific category toggles it in/out
// of trendCategories so you can compare 2+ categories side by side. Kept as a
// separate copy since Trends has its own independent selection state.
function renderTrendFilters() {
  const spendTxns = allTxns.filter(t => !NON_SPEND_CATEGORIES.includes(t.category));
  const present = new Set(spendTxns.map(t => t.category));
  trendCategories = trendCategories.filter(c => c === 'All' || present.has(c));
  if (!trendCategories.length) trendCategories = ['All'];
  const cats = ['All'].concat(ALL_CATEGORIES.filter(c => !NON_SPEND_CATEGORIES.includes(c) && present.has(c)));
  document.getElementById('trendFilters').innerHTML = cats.map(c =>
    `<div class="filter-chip ${trendCategories.includes(c) ? 'active' : ''}" data-cat="${c}">${c}</div>`
  ).join('');
  document.querySelectorAll('#trendFilters .filter-chip').forEach(el => {
    el.onclick = () => {
      const c = el.dataset.cat;
      if (c === 'All') {
        trendCategories = ['All'];
      } else {
        trendCategories = trendCategories.filter(x => x !== 'All');
        trendCategories = trendCategories.includes(c)
          ? trendCategories.filter(x => x !== c)
          : trendCategories.concat(c);
        if (!trendCategories.length) trendCategories = ['All'];
      }
      trendSubTag = 'All';
      renderTrends();
    };
  });
}
// Subtag drill-down only makes sense with exactly one specific category
// selected — with 2+ categories selected (comparison mode) or "All", this
// row just hides, matching the same present-in-data-only chip pattern.
function renderTrendSubFilters() {
  const el = document.getElementById('trendSubFilters');
  if (trendCategories.length !== 1 || trendCategories[0] === 'All') {
    el.style.display = 'none';
    el.innerHTML = '';
    trendSubTag = 'All';
    return;
  }
  const category = trendCategories[0];
  const possible = SUBTAGS_BY_CATEGORY[category];
  if (!possible || !possible.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const categoryTxns = allTxns.filter(t => t.category === category);
  const present = new Set(categoryTxns.map(t => t.subTag).filter(Boolean));
  categoryTxns.forEach(t => { if (t.extraTag) present.add(t.extraTag); });
  const subtags = possible.filter(s => present.has(s));
  if (!subtags.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
  if (trendSubTag !== 'All' && !present.has(trendSubTag)) trendSubTag = 'All';
  el.style.display = 'flex';
  const opts = ['All'].concat(subtags);
  el.innerHTML = opts.map(s =>
    `<div class="filter-chip ${s === trendSubTag ? 'active' : ''}" data-sub="${s}">${s}</div>`
  ).join('');
  el.querySelectorAll('.filter-chip').forEach(chip => {
    chip.onclick = () => { trendSubTag = chip.dataset.sub; renderTrends(); };
  });
}
function trendFilteredTxnsFor(category, subTag) {
  let txns = allTxns.filter(t => !NON_SPEND_CATEGORIES.includes(t.category));
  if (category !== 'All') txns = txns.filter(t => t.category === category);
  if (category !== 'All' && subTag && subTag !== 'All') {
    txns = txns.filter(t => (t.subTag || '') === subTag || t.extraTag === subTag);
  }
  return txns;
}
function trendBucketsFor(txns) {
  const map = {};
  txns.forEach(t => {
    const key = trendBucketKey(t.date, trendGroup);
    map[key] = (map[key] || 0) + spendAmount(t);
  });
  return map;
}
// A dedicated high-contrast palette for the Trends comparison chart —
// deliberately NOT the same warm red/orange/yellow tones used for dot
// colors/pie slices elsewhere, since those all sit too close together on
// the hue wheel to tell apart when several categories are plotted side by
// side as bars. Each category gets its own distinct hue here instead.
const TREND_CATEGORY_COLORS = {
  Car: '#0a84ff', Shopping: '#ff9f0a', Food: '#30d158',
  Entertainment: '#ffd60a', Sports: '#64d2ff', Housing: '#ff375f', Unsure: '#bf5af2'
};

// Compresses bar HEIGHT only (sign-preserving square root) so a month with
// a RM1000+ outlier doesn't flatten every normal ~RM200 bar down to an
// invisible sliver — 1000 -> ~31.6, 200 -> ~14.1, so the normal days stay
// readable next to the spike. The real RM figure is kept separately
// (dataset._raw) for the tooltip and on-bar value label, so nothing about
// the actual numbers is hidden — only the bar height is rescaled.
function sqrtTransform(v) {
  return Math.sign(v) * Math.sqrt(Math.abs(v));
}

// Draws the real RM value just above each bar so the exact number is always
// visible even when sqrtTransform has squashed a small bar down — skipped
// once there are too many bars (long custom ranges) to avoid clutter; the
// tooltip still has the real number on tap/hover either way.
const trendValueLabelPlugin = {
  id: 'trendValueLabels',
  afterDatasetsDraw(chart) {
    if (chart.data.labels.length > 16) return;
    const { ctx } = chart;
    chart.data.datasets.forEach((dataset, dsIndex) => {
      const meta = chart.getDatasetMeta(dsIndex);
      if (meta.hidden) return;
      meta.data.forEach((bar, i) => {
        const raw = dataset._raw ? dataset._raw[i] : null;
        if (!raw) return;
        ctx.save();
        ctx.fillStyle = '#8e8e93';
        ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        const pos = bar.tooltipPosition();
        ctx.fillText(formatSignedRM(raw, 0), pos.x, pos.y - 6);
        ctx.restore();
      });
    });
  }
};

// Shared "current period total + %change vs prior period" readout, used by
// both the single-category view and (now) the multi-category comparison
// view's combined total — same rules either way: custom range just sums
// everything (no meaningful "prior period" to diff against), and a %change
// against a near-empty prior bucket is suppressed rather than shown as a
// misleading number like "18929%".
function currentAndDeltaHtml(values, isCustom, trendGroup) {
  let current, deltaHtml = '';
  if (isCustom) {
    current = values.reduce((s, v) => s + v, 0);
  } else {
    current = values.length ? values[values.length - 1] : 0;
    const prev = values.length > 1 ? values[values.length - 2] : undefined;
    const MIN_MEANINGFUL_PREV = 20;
    if (prev !== undefined && prev >= MIN_MEANINGFUL_PREV) {
      const pct = Math.round(((current - prev) / prev) * 100);
      const cls = pct > 0 ? 'up' : (pct < 0 ? 'down' : '');
      const arrow = pct > 0 ? '▲' : (pct < 0 ? '▼' : '–');
      const periodWord = trendGroup === 'month' ? 'last month' : (trendGroup === 'week' ? 'last week' : 'yesterday');
      deltaHtml = `<span class="trend-delta ${cls}">${arrow} ${Math.abs(pct)}% vs ${periodWord}</span>`;
    }
  }
  return { current, deltaHtml };
}

function renderTrends() {
  document.getElementById('trendsUpdated').textContent = lastUpdatedLabel();
  renderTrendFilters();
  renderTrendSubFilters();

  const labelEl = document.getElementById('trendLabel');
  const valueEl = document.getElementById('trendValue');
  const canvas = document.getElementById('trendsChart');
  const isCustom = trendGroup === 'custom';
  document.getElementById('trendRangeRow').classList.toggle('show', isCustom);
  // Day buckets can span weeks/months of data, so give it a wider window
  // than week; a custom range shows every day inside it (no window cap).
  const windowSize = trendGroup === 'month' ? 6 : (trendGroup === 'day' ? 14 : 8);
  const inRange = (t) => !isCustom || (t.date >= trendRangeFrom && t.date <= trendRangeTo);

  if (trendCategories.length <= 1) {
    // Single series — same "current period + %change vs prior" readout as
    // before, optionally drilled into one subtag. In custom-range mode the
    // "current" figure becomes the total for the whole range instead of just
    // the latest bucket, and there's no meaningful "prior period" to diff
    // against, so the %-change readout is skipped.
    const category = trendCategories[0];
    const buckets = trendBucketsFor(trendFilteredTxnsFor(category, trendSubTag).filter(inRange));
    const sortedKeys = Object.keys(buckets).sort();
    const keys = isCustom ? sortedKeys : sortedKeys.slice(-windowSize);
    const labels = keys.map(k => trendBucketLabel(k, trendGroup));
    const values = keys.map(k => Math.round((buckets[k] || 0) * 100) / 100);

    const baseLabel = category === 'All'
      ? 'All spending'
      : (trendSubTag !== 'All' ? category + ' · ' + trendSubTag : category);
    labelEl.textContent = isCustom ? baseLabel + ' · ' + formatRangeLabel(trendRangeFrom, trendRangeTo) : baseLabel;

    const { current, deltaHtml } = currentAndDeltaHtml(values, isCustom, trendGroup);
    valueEl.innerHTML = `${formatSignedRM(current)}${deltaHtml}`;

    const chartData = {
      labels,
      datasets: [{
        data: values.map(sqrtTransform),
        _raw: values,
        backgroundColor: values.map((v, i) => (!isCustom && i === values.length - 1) ? '#f5a623' : '#3a3a3d'),
        borderRadius: 6,
        maxBarThickness: isCustom ? 16 : 40
      }]
    };
    renderTrendsChart(canvas, chartData, false);
  } else {
    // Comparison mode — 2+ categories selected. One dataset per category,
    // sharing the same bucket window so bars for the same period line up
    // side by side. The headline readout combines every selected category
    // into one total + %change (same rules as the single-category view);
    // the legend + tooltips still carry the per-category breakdown.
    const perCategory = trendCategories.map(cat => ({ cat, buckets: trendBucketsFor(trendFilteredTxnsFor(cat, 'All').filter(inRange)) }));
    const allKeys = new Set();
    perCategory.forEach(pc => Object.keys(pc.buckets).forEach(k => allKeys.add(k)));
    const sortedAll = Array.from(allKeys).sort();
    const keys = isCustom ? sortedAll : sortedAll.slice(-windowSize);
    const labels = keys.map(k => trendBucketLabel(k, trendGroup));

    labelEl.textContent = trendCategories.join(' vs ') + (isCustom ? ' · ' + formatRangeLabel(trendRangeFrom, trendRangeTo) : '');
    const combinedValues = keys.map(k => Math.round(perCategory.reduce((s, pc) => s + (pc.buckets[k] || 0), 0) * 100) / 100);
    const { current: combinedCurrent, deltaHtml: combinedDeltaHtml } = currentAndDeltaHtml(combinedValues, isCustom, trendGroup);
    valueEl.innerHTML = `${formatSignedRM(combinedCurrent)}${combinedDeltaHtml}`;

    const chartData = {
      labels,
      datasets: perCategory.map(pc => {
        const raw = keys.map(k => Math.round((pc.buckets[k] || 0) * 100) / 100);
        return {
          label: pc.cat,
          data: raw.map(sqrtTransform),
          _raw: raw,
          backgroundColor: TREND_CATEGORY_COLORS[pc.cat] || '#8e8e93',
          borderRadius: 6,
          maxBarThickness: isCustom ? 12 : 24
        };
      })
    };
    renderTrendsChart(canvas, chartData, true);
  }
}

// Shared chart lifecycle for the Trends bar chart, whether it's a single
// series (comparison off) or one dataset per selected category (comparison
// on) — mirrors the create-once/update-in-place pattern renderChartOn() uses
// for the pie charts, via the same chartInstances map.
function renderTrendsChart(canvas, chartData, showLegend) {
  if (chartInstances['trendsChart']) {
    chartInstances['trendsChart'].data = chartData;
    chartInstances['trendsChart'].options.plugins.legend.display = showLegend;
    chartInstances['trendsChart'].update();
  } else if (window.Chart) {
    chartInstances['trendsChart'] = new Chart(canvas.getContext('2d'), {
      type: 'bar',
      data: chartData,
      plugins: [trendValueLabelPlugin],
      options: {
        // Extra top padding so the on-bar value labels (drawn by
        // trendValueLabelPlugin) never get clipped by the canvas edge.
        layout: { padding: { top: 16 } },
        plugins: {
          legend: {
            display: showLegend, position: 'bottom',
            labels: { color: '#8e8e93', boxWidth: 10, font: { size: 11 } }
          },
          tooltip: {
            callbacks: {
              label: (c) => {
                const raw = c.dataset._raw ? c.dataset._raw[c.dataIndex] : c.parsed.y;
                return (c.dataset.label ? c.dataset.label + ': ' : '') + formatSignedRM(Number(raw));
              }
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#8e8e93', font: { size: 10 } } },
          y: { display: false, grid: { display: false } }
        }
      }
    });
  }
}
