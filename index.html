// ---- CSV parsing (wrapped as a promise) ----
function parseCsvFile(file) {
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const rows = [];
        results.data.forEach(r => {
          const type = r['Transaction Type'] || r['Type'] || '';
          const description = r['Description'] || r['Merchant'] || '';
          const dateRaw = r['Date'] || '';
          const amountRaw = (r['Amount (RM)'] || r['Amount'] || '0').toString().replace(/[^0-9.\-]/g, '');
          let date = dateRaw;
          const m = dateRaw.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
          if (m) date = `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
          if (isInImportExcludeWindow(date)) return;
          const guess = categorize(description, type);
          if (!guess) return;
          // Time may come from its own column, or be embedded in the Date
          // cell itself (e.g. "30/06/2026 14:23").
          let time = r['Time'] || '';
          if (!time) {
            const tm = dateRaw.match(TIME_TOKEN_RE);
            if (tm) time = tm[1];
          }
          time = normalizeTime(time);
          rows.push({
            date, time, amount: parseFloat(amountRaw) || 0,
            category: guess.category, subTag: guess.subTag,
            merchant: description, source: 'TNG CSV Import', notes: type, type,
            account: 'TNG'
          });
        });
        resolve(rows);
      },
      error: reject
    });
  });
}

// ================== BANK STATEMENT IMPORT (Bank A / Bank B) ==================
// Bank A and Bank B are real bank accounts that feed the TNG wallet: salary
// lands in Bank A, gets moved to Bank B, then Bank B tops up the TNG wallet.
// Each bank exports a totally different CSV layout, so each gets its own
// small parser + categorizer rather than trying to force them through the
// TNG-shaped parseCsvFile above. Both ultimately produce the same row shape
// as every other import path: {date,time,amount,category,subTag,merchant,
// source,notes,type,account}.

// Strips a trailing digit run from a name string. Bank A's exports glue the
// transaction reference number onto the end of a truncated payer/payee name
// (e.g. "ENCIK MUHAMAD FAHMI BIN H283855" where "283855" is the reference),
// so this trims that back to something closer to just the name.
function stripTrailingRef(name) {
  return (name || '').replace(/\d+$/, '').trim();
}

// Bank A (Statement.csv): a Public Bank-style savings account export. It has
// a metadata header block (account number, balance, etc.), then a loosely
// comma-separated table — Date, Ref No, Description code, Debit, Credit,
// followed by several more comma-separated "details" fields (payer/payee
// name, memo) that don't line up with a clean header. Papa.parse without a
// header just gives raw arrays per line, which is what we want here so we
// can pick out real transaction rows by testing column 0 for a date.
// detailCols: the trimmed extra comma-separated fields after Debit/Credit,
// kept as SEPARATE columns rather than one joined string — a name sitting in
// one column shouldn't get confused with a reference number sitting in the
// column right next to it (e.g. col0 = reference-ish text, col1 = the
// payer's full name for a salary credit, col2+ = memo text).
function categorizeBankA(typeCode, detailCols) {
  const t = (typeCode || '').toUpperCase();
  const col0 = detailCols[0] || '';
  const col1 = detailCols[1] || '';
  const allUpper = detailCols.join(' ').toUpperCase();

  if (t === 'DEP-ECP') {
    if (allUpper.includes('PAYROLL')) {
      const payer = (col1.split(/\s{2,}/)[0] || col1).trim();
      return { category: 'Income', subTag: 'Salary', merchant: `Salary${payer ? ' (' + payer + ')' : ''}` };
    }
    return { category: 'Income', subTag: 'Other', merchant: 'Bank Credit' };
  }
  if (t.startsWith('TSFR FUND CR')) {
    const parts = col0.split(/\s{2,}/).map(s => s.trim()).filter(Boolean);
    const payer = parts.length > 1 ? parts[parts.length - 1] : parts[0];
    // A credit from HL Bank itself (rather than an external payer) would be
    // money moving back between your own accounts — Internal, not Income.
    if (/NG JIA YAO/i.test(col0)) {
      return { category: 'Transfer', subTag: 'Internal', merchant: 'From HL Bank' };
    }
    return { category: 'Income', subTag: 'Other', merchant: `Bank Credit${payer ? ' (' + payer + ')' : ''}` };
  }
  if (t === 'DUITNOW TRSF DR') {
    const name = stripTrailingRef(col0.split(/\s{2,}/)[0] || col0);
    // Movement to your own HL Bank account — filed under the single
    // "Internal" subtag (see CATEGORY_OPTIONS) rather than a dedicated
    // "To HL Bank" subtag; the merchant text still says which leg it was.
    if (/NG JIA YAO/i.test(col0)) {
      return { category: 'Transfer', subTag: 'Internal', merchant: 'To HL Bank' };
    }
    return { category: 'Transfer', subTag: 'To Others', merchant: `To Others (${name})` };
  }
  if (t === 'DUITNOW QR DR') {
    const name = stripTrailingRef(col0.split(/\s{2,}/)[0] || col0);
    return { category: 'Transfer', subTag: 'To Others', merchant: `To Others (${name})` };
  }
  if (t === 'PB DEBIT CARD DR' || t === 'DR MYDEBIT') {
    const merchantName = col0.replace(/^VISA\d+\s*/, '').replace(/^\d[\dX]{9,}\s*/i, '').split(/\s{2,}/)[0].trim();
    const col0Upper = col0.toUpperCase();
    for (const rule of CATEGORY_RULES) {
      for (const kw of rule.keywords) {
        if (col0Upper.includes(kw)) {
          return { category: rule.category, subTag: rule.subTag || '', merchant: merchantName || col0 };
        }
      }
    }
    return { category: 'Unsure', subTag: '', merchant: merchantName || col0 };
  }
  return { category: 'Unsure', subTag: '', merchant: col0 || t };
}

async function parseBankACsvFile(file) {
  const text = await file.text();
  const parsed = Papa.parse(text, { skipEmptyLines: false });
  const DATE_RE = /^(\d{2})-(\d{2})-(\d{4})$/;
  const rows = [];
  (parsed.data || []).forEach(cols => {
    if (!cols || !cols.length) return;
    const dateRaw = String(cols[0] || '').trim();
    const m = dateRaw.match(DATE_RE);
    if (!m) return; // skip metadata/header/blank rows
    const date = `${m[3]}-${m[2]}-${m[1]}`;
    const typeCode = String(cols[2] || '').trim();
    const debit = parseFloat(String(cols[3] || '').replace(/,/g, '').trim()) || 0;
    const credit = parseFloat(String(cols[4] || '').replace(/,/g, '').trim()) || 0;
    const amount = debit || credit;
    if (!amount) return;
    const detailCols = cols.slice(5).map(c => String(c || '').trim());
    const guess = categorizeBankA(typeCode, detailCols);
    rows.push({
      date, time: '', amount,
      category: guess.category, subTag: guess.subTag,
      merchant: guess.merchant, source: 'PBank CSV Import', notes: typeCode, type: typeCode,
      account: 'PBank',
      // PBank's statement always tells you which column the amount came
      // from — a credit is always money coming in, a debit always going
      // out — so the real direction is known outright here rather than
      // guessed from category/subtag.
      flow: credit ? 'in' : 'out'
    });
  });
  return rows;
}

// Bank B (CASATran...csv): a CASA account export — proper quoted CSV with a
// real header (Date, Description, Reference, Deposit (MYR), Withdrawal
// (MYR)). This is the account that funds the TNG wallet, so its "POS
// Purchase ... TNG-EWALLET" rows are recognized specially as Transfer > To
// TNG rather than a generic purchase.
function categorizeBankB(desc, reference) {
  const descUpper = (desc || '').toUpperCase();
  const ref = (reference || '').trim();
  const refUpper = ref.toUpperCase();

  // Money leaving to top up the TNG wallet — movement to your own account,
  // so it's filed under the single "Internal" subtag (see CATEGORY_OPTIONS)
  // rather than a dedicated "To TNG" subtag.
  if (refUpper.includes('TNG-EWALLET')) {
    return { category: 'Transfer', subTag: 'Internal', merchant: 'To TNG (Wallet Reload)' };
  }
  if (descUpper === 'INSTANT TRANSFER') {
    const nameMatch = ref.match(/from\s*ng\s*(.*?)\d{8,}/i);
    const isBankA = /NG JIA YAO/i.test(ref);
    // Same logic — money arriving from your own PBank account is Internal,
    // not an external "From Others" credit.
    if (isBankA) return { category: 'Transfer', subTag: 'Internal', merchant: 'From PBank' };
    const name = stripTrailingRef(nameMatch ? nameMatch[1] : ref);
    return { category: 'Transfer', subTag: 'From Others', merchant: `From Others (${name})` };
  }
  if (descUpper.startsWith('FUND TRF')) {
    const nameMatch = ref.match(/^Fund transfer\d*(.*)$/i);
    const name = stripTrailingRef(nameMatch ? nameMatch[1] : ref);
    return { category: 'Transfer', subTag: 'Internal', merchant: `Internal Transfer${name ? ' (' + name + ')' : ''}` };
  }
  if (descUpper === 'INTEREST') {
    return { category: 'Income', subTag: 'Interest', merchant: 'Interest' };
  }
  if (descUpper === 'DUITNOW QR') {
    const nameMatch = ref.match(/^QR Payment(.*?)\d{8,}/i);
    const name = stripTrailingRef(nameMatch ? nameMatch[1] : ref);
    return { category: 'Transfer', subTag: 'To Others', merchant: `To Others (${name})` };
  }
  if (descUpper === 'POS PURCHASE' || descUpper === 'MYDEBIT PURCHASE') {
    for (const rule of CATEGORY_RULES) {
      for (const kw of rule.keywords) {
        if (refUpper.includes(kw)) {
          const merchantName = ref.replace(/^DEBITCARD\s*/i, '').split(/\s{2,}/)[0].trim();
          return { category: rule.category, subTag: rule.subTag || '', merchant: merchantName || ref };
        }
      }
    }
    const merchantName = ref.replace(/^DEBITCARD\s*/i, '').split(/\s{2,}/)[0].trim();
    return { category: 'Unsure', subTag: '', merchant: merchantName || ref };
  }
  return { category: 'Unsure', subTag: '', merchant: ref || desc };
}

function parseBankBCsvFile(file) {
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const rows = [];
        results.data.forEach(r => {
          const dateRaw = (r['Date'] || '').trim();
          const desc = (r['Description'] || '').trim();
          const reference = (r['Reference'] || '').trim();
          const deposit = parseFloat((r['Deposit (MYR)'] || '').replace(/,/g, '')) || 0;
          const withdrawal = parseFloat((r['Withdrawal (MYR)'] || '').replace(/,/g, '')) || 0;
          const amount = deposit || withdrawal;
          if (!amount) return;
          const m = dateRaw.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
          const MONTHS = { Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12' };
          const date = m ? `${m[3]}-${MONTHS[m[2]] || '01'}-${m[1].padStart(2,'0')}` : dateRaw;
          const guess = categorizeBankB(desc, reference);
          rows.push({
            date, time: '', amount,
            category: guess.category, subTag: guess.subTag,
            merchant: guess.merchant, source: 'HL Bank CSV Import', notes: desc, type: desc,
            account: 'HL Bank',
            // Same reasoning as PBank — the Deposit/Withdrawal column the
            // amount actually came from tells you the real direction
            // outright, no need to guess from category/subtag.
            flow: withdrawal ? 'out' : 'in'
          });
        });
        resolve(rows);
      },
      error: reject
    });
  });
}

// A short testing window that used to drop any parsed transaction dated
// inside this range from every TNG/TNG Card import (PDF, CSV, or
// screenshot), so it could be added by hand from the phone instead and
// compared against what auto-import would have produced. That comparison
// is done, and the window was left switched on by mistake — it was
// silently deleting 30 Jul-1 Aug data from every real import. Disabled by
// setting both bounds to '' so isInImportExcludeWindow() never matches;
// left in place (rather than deleted outright) in case a similar
// hold-out window is useful for a future testing pass.
const IMPORT_EXCLUDE_FROM = '';
const IMPORT_EXCLUDE_TO = '';
function isInImportExcludeWindow(date) {
  if (!IMPORT_EXCLUDE_FROM || !IMPORT_EXCLUDE_TO) return false;
  return date >= IMPORT_EXCLUDE_FROM && date <= IMPORT_EXCLUDE_TO;
}

// ---- PDF parsing ----
// TNG's exported statement is a table with FIXED columns (Date, Status,
// Transaction Type, Reference, Description, Details, Amount (RM), Wallet
// Balance (RM)). Long cells (Reference, Details) wrap onto extra lines
// *within* a row, which breaks any parser that reconstructs plain text
// lines by grouping items purely by y-position (a wrapped cell's extra
// lines land in-between what should be two separate transaction rows).
// So instead of reconstructing "lines" at all, this works directly off
// pdf.js's positioned text items: find every Date-column item to mark
// row boundaries, then for every item between one row boundary and the
// next, bucket it into a column by its x position and join the pieces
// column-by-column.
const PDF_COLUMNS = [
  ['date', 0, 75],
  ['status', 75, 135],
  ['type', 135, 225],
  ['reference', 225, 290],
  ['description', 290, 455],
  ['details', 455, 650],
  ['amount', 650, 745],
  ['balance', 745, 100000],
];
const DATE_TOKEN_RE = /^\d{1,2}\/\d{1,2}\/\d{4}$/;
// Matches a time-of-day token like "14:23", "2:23:11", or "2:23 PM" —
// used to pick up the transaction time if the statement prints one
// anywhere in the row (commonly right next to the date).
const TIME_TOKEN_RE = /\b(\d{1,2}:\d{2}(?::\d{2})?\s?(?:AM|PM|am|pm)?)\b/;

// Normalizes a raw time token ("2:23 PM", "14:23:11", "9:05") to 24-hour
// "HH:MM" for storage/sorting; returns '' if it doesn't look like a time.
function normalizeTime(raw) {
  if (!raw) return '';
  const m = raw.trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s?(AM|PM|am|pm)?$/);
  if (!m) return '';
  let h = parseInt(m[1], 10);
  const min = m[2];
  const ampm = m[3] ? m[3].toUpperCase() : null;
  if (ampm === 'PM' && h < 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  if (h > 23) return '';
  return String(h).padStart(2, '0') + ':' + min;
}
const TXN_TYPES = ['DuitNow QR TNGD', 'PayDirect Payment', 'Transfer to Wallet', 'Receive from Wallet', 'RFID Payment', 'DuitNow QR', 'Reload', 'Payment', 'Cashback'];
const FOOTER_PATTERNS = [
  /\*?This is a system generated.*$/i,
  /email\.\s*For further enquiry.*$/i,
  /\+?603[\d\s]*$/,
  /\d{1,2}[:.]\d{2}\s?(am|pm) to \d{1,2}[:.]\d{2}\s?(am|pm).*$/i,
  /\(including public holidays\)\.?$/i,
  /Thank you\.?$/i,
];

function columnForX(x) {
  for (const [name, lo, hi] of PDF_COLUMNS) { if (x >= lo && x < hi) return name; }
  return 'balance';
}

function cleanMerchant(m) {
  FOOTER_PATTERNS.forEach(pat => { m = m.replace(pat, '').trim(); });
  m = m.replace(/\d{8,}.*$/, '').trim();
  return m;
}

// Parses one pdf.js page's text items (content.items, from getTextContent())
// into transaction records using the row/column reconstruction above.
function parsePdfPageItems(items) {
  const usable = items.filter(it => it.str && it.str.trim().length && it.transform);
  if (!usable.length) return [];
  // This statement's PDF page is rotated, so pdf.js's raw (unrotated)
  // per-item transform reports the axes swapped relative to how the page is
  // actually displayed: transform[5] is the horizontal/column position and
  // transform[4] is the vertical "distance down the page" (already
  // increasing downward, no flip needed) -- the reverse of the usual
  // bottom-left-origin convention. Verified against the real exported PDF's
  // actual pdf.js item coordinates.
  const withPos = usable.map(it => ({ x: it.transform[5], top: it.transform[4], str: it.str.trim() }));

  const dateRows = withPos.filter(it => it.x < 75 && DATE_TOKEN_RE.test(it.str));
  dateRows.sort((a, b) => a.top - b.top);
  if (!dateRows.length) return [];

  const records = [];
  for (let i = 0; i < dateRows.length; i++) {
    const rowTop = dateRows[i].top - 0.5;
    const rowBottom = i + 1 < dateRows.length ? dateRows[i + 1].top - 0.5 : Infinity;
    const rowItems = withPos.filter(it => it.top >= rowTop && it.top < rowBottom);
    rowItems.sort((a, b) => a.top - b.top || a.x - b.x);

    const cols = {};
    rowItems.forEach(it => { (cols[columnForX(it.x)] = cols[columnForX(it.x)] || []).push(it.str); });

    const dateRaw = (cols.date || [])[0];
    const typeStr = (cols.type || []).join(' ');
    let ttype = null;
    for (const t of TXN_TYPES) { if (typeStr.startsWith(t)) { ttype = t; break; } }
    if (!dateRaw || !ttype) continue;

    const amtStr = (cols.amount || []).join(' ');
    const amtMatch = amtStr.match(/RM\s?([\d,]+\.\d{2})/);
    if (!amtMatch) continue;
    const amount = parseFloat(amtMatch[1].replace(/,/g, ''));

    let merchant = cleanMerchant((cols.description || []).join(' '));
    if (!merchant) merchant = ttype;
    // The "details" column (x 455-650) holds wildly different content
    // depending on transaction type: for RFID/PayDirect/DuitNow rows it's
    // just the timestamp (already pulled out separately below); for Reload
    // rows it's an opaque base64-looking payment-gateway reference; only for
    // Transfer to Wallet/Receive from Wallet rows does TNG occasionally put
    // real identifying text there (e.g. a recipient name) when the
    // Description column just says the generic "Fund Transfer". A previous
    // version of this merged Details into the merchant for EVERY row type,
    // which polluted ordinary merchant names with timestamps/reference
    // blobs and broke duplicate-detection against already-imported data
    // (see Review tab / import preview showing far more "new" than
    // expected). Scoped to just the transfer types now, and skips details
    // that are only a time-of-day token or a long digit/base64 blob with no
    // real letters in it — cleanMerchant already strips runs of 8+ digits,
    // but a real look-like-a-name check guards against anything that slips
    // through (e.g. mixed-case base64 fragments).
    if (ttype === 'Transfer to Wallet' || ttype === 'Receive from Wallet') {
      const details = cleanMerchant((cols.details || []).join(' '));
      const looksLikeRealText = details && /[A-Za-z]{3,}/.test(details) && !TIME_TOKEN_RE.test(details);
      if (looksLikeRealText && /^FUND TRANSFER$/i.test(merchant)) {
        merchant = details;
      } else if (looksLikeRealText && details.toUpperCase() !== merchant.toUpperCase()) {
        merchant = merchant + ' - ' + details;
      }
    }

    const dm = dateRaw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    const date = dm ? `${dm[3]}-${dm[2].padStart(2, '0')}-${dm[1].padStart(2, '0')}` : dateRaw;

    // Time isn't always in a fixed column — search every item in this row
    // (except the date token itself) for something that looks like a time.
    let time = '';
    for (const it of rowItems) {
      if (it.str === dateRaw) continue;
      const tm = it.str.match(TIME_TOKEN_RE);
      if (tm) { time = normalizeTime(tm[1]); if (time) break; }
    }

    records.push({ date, time, amount, merchant, type: ttype });
  }
  return records;
}

async function extractPdfRecords(file) {
  if (!window.pdfjsLib) throw new Error('PDF reader failed to load — check your connection and try again.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const loadingTask = pdfjsLib.getDocument({ data: buf });
  loadingTask.onPassword = (callback, reason) => {
    const msg = reason === 2 ? 'Incorrect password — try again:' : 'This PDF is password-protected. Enter the password:';
    const pwd = window.prompt(msg);
    callback(pwd || '');
  };
  const pdf = await loadingTask.promise;
  let records = [];
  let rawDump = null;
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    if (p === 1 && !rawDump) {
      rawDump = content.items.slice(0, 60).map((it, i) => {
        const x = Math.round(it.transform[4]);
        const y = Math.round(it.transform[5] * 10) / 10;
        return `${i}: x=${x} y=${y} "${it.str}"`;
      }).join('\n');
    }
    records = records.concat(parsePdfPageItems(content.items));
  }
  records.__rawDump = rawDump;
  return records;
}

async function parsePdfFile(file) {
  const records = await extractPdfRecords(file);

  if (!records.length) {
    const rawDump = records.__rawDump || '(none)';
    const err = new Error(`Couldn't recognize any transactions in that PDF.\n\nRaw items (page 1):\n${rawDump}`);
    err.diagnostic = true;
    throw err;
  }

  const rows = [];
  records.forEach(r => {
    if (isInImportExcludeWindow(r.date)) return;
    const guess = categorize(r.merchant, r.type);
    if (!guess) return; // Reload / Transfer / Receive / Cashback — not spending
    rows.push({
      date: r.date, time: r.time || '', amount: r.amount,
      category: guess.category, subTag: guess.subTag,
      merchant: r.merchant, source: 'TNG PDF Import', notes: r.type, type: r.type,
      account: 'TNG'
    });
  });
  return rows;
}

// ---- TNG Card PDF parsing ----
// The physical Card's statement is a completely different table shape from
// the eWallet's — not rotated like the eWallet PDF, standard top-down page
// coords (y decreases going down the page). Two sections: "Offline Card
// Transactions" (parking fares + one Reload event, each with their own
// Card Balance running total — this is genuinely new data, never captured
// anywhere else) and "Online Card Transactions" (highway tolls, which are
// confirmed duplicates of the eWallet's own RFID/PayDirect entries — same
// real-world charge, reported on both statements — so these are skipped
// entirely rather than double-imported). Row anchor is the "Trans No."
// column (a bare 5-digit number at the far left); each row's extent runs
// from its own anchor down to the next one, same boundary technique as the
// eWallet parser above, just with un-swapped axes.
const CARD_TRANSNO_MAXX = 45;
const CARD_DATE_COL = [95, 148];   // "Exit Date & Time" column — this also
                                    // catches a Reload row's one-and-only
                                    // date, which prints into this same slot
const CARD_TYPE_COL = [195, 236];  // "Tran Type" column (multi-line)
const CARD_AMOUNT_COL = [460, 528]; // Trans Amount + Card Balance zone —
                                     // occasionally merge into one text run
                                     // (seen on the Reload row), so both
                                     // sub-columns are read together and the
                                     // FIRST RM figure found is taken as the
                                     // Trans Amount
const CARD_SECTOR_COL_MIN = 528;   // "Sector" column (PARKING / TOLL / RETAIL)

// Parses one pdf.js page's text items into Offline-section Card records.
// Stops at the first "Online Card Transactions" marker, if present on this
// page, so Online rows are never picked up even by accident.
function parseCardPdfPageItems(items) {
  const usable = items.filter(it => it.str && it.str.trim().length && it.transform);
  if (!usable.length) return [];
  const withPos = usable.map(it => ({ x: it.transform[4], y: it.transform[5], str: it.str.trim() }));

  // Cut off by Y position, not array index — pdf.js's item order isn't
  // guaranteed to match visual top-to-bottom reading order (some of this
  // statement's own online-section text showed up ahead of a few of the
  // last offline rows in the raw item list), so anything at or below the
  // "Online Card Transactions" heading's own height is excluded regardless
  // of where it fell in the array.
  const onlineHeader = withPos.find(it => it.str.indexOf('Online Card Transactions') !== -1);
  const scoped = onlineHeader ? withPos.filter(it => it.y > onlineHeader.y) : withPos;

  const rowAnchors = scoped.filter(it => it.x < CARD_TRANSNO_MAXX && /^\d{5}$/.test(it.str));
  rowAnchors.sort((a, b) => b.y - a.y); // standard PDF coords: higher y = higher on the page = earlier row

  const records = [];
  for (let i = 0; i < rowAnchors.length; i++) {
    // The Trans No. anchor sits a few points BELOW the top of its own row
    // (the Entry/Exit Date & Time lines print a bit higher) — bisecting the
    // gap to the neighboring anchors, rather than starting exactly at this
    // anchor's own y, is what correctly keeps a row's date/time lines from
    // being attributed to the row above it.
    const rowTop = i > 0 ? (rowAnchors[i - 1].y + rowAnchors[i].y) / 2 : Infinity;
    const rowBottom = i + 1 < rowAnchors.length ? (rowAnchors[i].y + rowAnchors[i + 1].y) / 2 : -Infinity;
    const rowItems = scoped.filter(it => it.y <= rowTop && it.y > rowBottom);

    const dateCandidates = rowItems.filter(it => it.x >= CARD_DATE_COL[0] && it.x < CARD_DATE_COL[1]).map(it => it.str);
    const dateStr = dateCandidates.find(s => /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s));
    const timeStr = dateCandidates.find(s => /^\d{1,2}:\d{2}:\d{2}$/.test(s)) || '';
    if (!dateStr) continue;

    const typeStr = rowItems.filter(it => it.x >= CARD_TYPE_COL[0] && it.x < CARD_TYPE_COL[1]).map(it => it.str).join(' ');
    const amtStr = rowItems.filter(it => it.x >= CARD_AMOUNT_COL[0] && it.x < CARD_AMOUNT_COL[1]).map(it => it.str).join(' ');
    const amtMatches = amtStr.match(/\d+\.\d{2}/g);
    if (!amtMatches || !amtMatches.length) continue;
    // The first data row on each page can also pick up that page's own
    // repeated "...Sector" column-header label bleeding in above it (same
    // top-of-page boundary issue as the date column) — match the known
    // sector keyword out of the joined text rather than comparing it
    // exactly, so a stray leading "Sector" word doesn't break the match.
    const sectorText = rowItems.filter(it => it.x >= CARD_SECTOR_COL_MIN).map(it => it.str).join(' ');
    const sectorMatch = sectorText.match(/\b(PARKING|TOLL|RETAIL)\b/);
    const sector = sectorMatch ? sectorMatch[1] : sectorText.trim();

    const dm = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    const date = `${dm[3]}-${dm[2].padStart(2, '0')}-${dm[1].padStart(2, '0')}`;
    const amount = parseFloat(amtMatches[0]);
    const isReload = /Reload/i.test(typeStr);

    records.push({ date, time: normalizeTime(timeStr), amount, sector, isReload, typeStr });
  }
  return records;
}

async function extractCardPdfRecords(file) {
  if (!window.pdfjsLib) throw new Error('PDF reader failed to load — check your connection and try again.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let records = [];
  let sawOnline = false;
  for (let p = 1; p <= pdf.numPages && !sawOnline; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    if (content.items.some(it => it.str && it.str.indexOf('Online Card Transactions') !== -1)) sawOnline = true;
    records = records.concat(parseCardPdfPageItems(content.items));
  }
  return records;
}

async function parseCardPdfFile(file) {
  const records = await extractCardPdfRecords(file);
  if (!records.length) {
    const err = new Error("Couldn't recognize any transactions in that Card statement PDF.");
    err.diagnostic = true;
    throw err;
  }
  const rows = [];
  records.forEach(r => {
    if (isInImportExcludeWindow(r.date)) return;
    if (r.sector === 'TOLL') return; // duplicate of the eWallet's own RFID/PayDirect entry — don't double-import
    if (r.isReload) {
      rows.push({
        date: r.date, time: r.time || '', amount: r.amount,
        category: 'Transfer', subTag: 'TNG Card Top-up',
        merchant: 'TNG Card Reload', source: 'TNG Card PDF Import', notes: r.typeStr, type: 'Reload',
        account: 'TNG Card', flow: 'in'
      });
      return;
    }
    if (r.sector === 'PARKING') {
      rows.push({
        date: r.date, time: r.time || '', amount: r.amount,
        category: 'Car', subTag: 'Parking',
        merchant: 'TNG Card Parking', source: 'TNG Card PDF Import', notes: r.typeStr, type: 'Parking',
        account: 'TNG Card'
      });
      return;
    }
    // Unrecognized sector — skip rather than guess.
  });
  return rows;
}

// Best-effort CSV path for the Card — there's no real sample of what a
// Card CSV export looks like yet, so this guesses at generic Date/Type/
// Description/Amount columns (same shape as the eWallet's own CSV parser)
// rather than a verified layout. Flag any issues if this doesn't line up
// with an actual export.
function parseCardCsvFile(file) {
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const rows = [];
        results.data.forEach(r => {
          const type = r['Type'] || r['Transaction Type'] || r['Tran Type'] || '';
          const description = r['Description'] || r['Sector'] || '';
          const dateRaw = r['Date'] || r['Exit Date'] || '';
          const amountRaw = (r['Amount (RM)'] || r['Trans Amount (RM)'] || r['Amount'] || '0').toString().replace(/[^0-9.\-]/g, '');
          const m = String(dateRaw).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
          const date = m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : dateRaw;
          if (isInImportExcludeWindow(date)) return;
          const typeUpper = String(type).toUpperCase();
          const descUpper = String(description).toUpperCase();
          if (typeUpper.indexOf('TOLL') !== -1 || descUpper.indexOf('TOLL') !== -1) return; // duplicate of eWallet
          const isReload = /RELOAD/.test(typeUpper) || /RELOAD/.test(descUpper);
          rows.push({
            date, time: '', amount: parseFloat(amountRaw) || 0,
            category: isReload ? 'Transfer' : 'Car',
            subTag: isReload ? 'TNG Card Top-up' : 'Parking',
            merchant: isReload ? 'TNG Card Reload' : 'TNG Card Parking',
            source: 'TNG Card CSV Import', notes: type, type,
            account: 'TNG Card',
            flow: isReload ? 'in' : ''
          });
        });
        resolve(rows);
      },
      error: reject
    });
  });
}

// ---- Screenshot parsing (client-side OCR via Tesseract.js) ----
// The TNG "Activity"/"History" screen renders each transaction as 2-3
// stacked lines: a date+time line ("30 Jul, 18:45"), a merchant+amount line
// ("MC DER BOB BURGER   -RM11.00"), and an optional payment-method(+points)
// line ("DuitNow QR TNGD   +11 points"). Verified against real screenshots
// with Tesseract in --psm 6 ("assume a single uniform block of text") — the
// default auto page-segmentation mode was unreliable and dropped amounts
// entirely on some rows (especially Toll rows), --psm 6 recovered all of
// them. Tesseract.js groups same-line words into one text string per line
// (in left-to-right reading order) when running in this mode, which is
// exactly the row structure this parser expects.
// Not end-anchored ($ dropped) — on dense screenshots Tesseract sometimes
// merges the date/time and the merchant+amount into a single OCR line
// instead of two, and parseScreenshotLines() below needs to detect "this
// line starts a record" even when there's more text after the time.
const SCREENSHOT_DATE_RE = /^(\d{1,2})\s+([A-Za-z]{3}),?\s+(\d{1,2}:\d{2})/;
const SCREENSHOT_MONTHS = { jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12' };
// Known toll plaza -> highway prefix, matching the "HIGHWAY - PLAZA" merchant
// text convention already used by past TNG PDF imports (e.g. "KESAS - AWAN
// BESAR WEST"). Unrecognized plazas are kept as just the plaza name — the
// CATEGORY_RULES keyword match (e.g. "AWAN BESAR") still works either way,
// this is purely cosmetic/consistency.
const TOLL_HIGHWAY_PREFIX = { 'AWAN BESAR': 'KESAS', 'PLAZA LOKE YEW': 'BESRAYA' };
const SCREENSHOT_TYPE_RE = /^[A-Za-z][A-Za-z0-9 ()\/.,:-]{2,}$/;

// The line right after a merchant+amount line is usually the payment method
// ("PayDirect Payment", "DuitNow QR TNGD"), sometimes with a "+11 points" /
// "0 points" badge merged onto the same OCR line — strip that off. Returns
// '' if the line doesn't look like a real payment-method string at all
// (e.g. stray OCR noise from icons/nav-bar text below the last transaction
// in the screenshot).
function extractScreenshotType(candidate) {
  if (!candidate) return '';
  if (/^Delayed on/i.test(candidate)) return '';
  const cleaned = candidate.replace(/[+-]?\d+\s*points\s*$/i, '').trim();
  if (!cleaned || !SCREENSHOT_TYPE_RE.test(cleaned)) return '';
  return cleaned;
}

// lines: OCR'd text, one string per visual line, top-to-bottom order.
function parseScreenshotLines(lines) {
  const dateIdxs = [];
  lines.forEach((l, i) => { if (SCREENSHOT_DATE_RE.test(l)) dateIdxs.push(i); });

  // The year isn't shown on each row ("30 Jul", not "30 Jul 2026") — assumes
  // the screenshot is recent (this year). Fix the date by hand afterward if
  // you're importing an old screenshot.
  const nowYear = new Date().getFullYear();
  const records = [];

  for (let k = 0; k < dateIdxs.length; k++) {
    const idx = dateIdxs[k];
    const line = lines[idx];
    const m = line.match(SCREENSHOT_DATE_RE);
    const day = m[1].padStart(2, '0');
    const mon = SCREENSHOT_MONTHS[m[2].toLowerCase()] || '01';
    const time = m[3];
    const date = `${nowYear}-${mon}-${day}`;

    // Usually the date/time is its own OCR line and the merchant+amount is
    // the next line down. But on some screenshots (lots of close-together
    // rows) Tesseract merges the date/time and merchant+amount onto one
    // line — try that first so those rows aren't silently dropped, and
    // fall back to the next line otherwise.
    let merchantLine = line.slice(m[0].length).trim();
    let usedNextLineForMerchant = false;
    let amtMatch = merchantLine.match(/([+-]?RM\s?[\d,]+\.\d{2})\s*$/i);
    if (!amtMatch) {
      merchantLine = lines[idx + 1] || '';
      usedNextLineForMerchant = true;
      amtMatch = merchantLine.match(/([+-]?RM\s?[\d,]+\.\d{2})\s*$/i);
    }
    if (!amtMatch) continue; // couldn't find an amount on this row — skip it

    const amount = parseFloat(amtMatch[1].replace(/[^0-9.]/g, ''));
    let merchant = merchantLine.slice(0, amtMatch.index).trim();

    let type = '';
    const nextIdx = usedNextLineForMerchant ? idx + 2 : idx + 1;
    if (nextIdx < lines.length && !SCREENSHOT_DATE_RE.test(lines[nextIdx])) {
      type = extractScreenshotType(lines[nextIdx]);
    }

    if (/^Reload$/i.test(merchant)) {
      type = 'Reload';
      merchant = 'Credit / Debit Card';
    } else {
      merchant = merchant.replace(/^Exit Toll:\s*/i, '').trim();
      const merchantUpper = merchant.toUpperCase();
      for (const plaza in TOLL_HIGHWAY_PREFIX) {
        if (merchantUpper.includes(plaza)) { merchant = TOLL_HIGHWAY_PREFIX[plaza] + ' - ' + merchant; break; }
      }
    }

    records.push({ date, time, amount, merchant, type });
  }
  return records;
}

async function extractScreenshotRecords(file) {
  if (!window.Tesseract) throw new Error('OCR library failed to load — check your connection and try again.');
  const worker = await Tesseract.createWorker('eng');
  let lines;
  try {
    await worker.setParameters({ tessedit_pageseg_mode: '6' });
    const { data } = await worker.recognize(file);
    lines = (data.lines || []).map(l => (l.text || '').trim()).filter(Boolean);
  } finally {
    await worker.terminate();
  }
  const records = parseScreenshotLines(lines);
  records.__rawLines = lines;
  return records;
}

async function parseScreenshotFile(file) {
  const records = await extractScreenshotRecords(file);
  if (!records.length) {
    const rawLines = (records.__rawLines || []).join('\n') || '(none)';
    const err = new Error(`Couldn't recognize any transactions in that screenshot.\n\nRecognized text:\n${rawLines}`);
    err.diagnostic = true;
    throw err;
  }
  const rows = [];
  records.forEach(r => {
    if (isInImportExcludeWindow(r.date)) return;
    const guess = categorize(r.merchant, r.type);
    if (!guess) return;
    rows.push({
      date: r.date, time: r.time || '', amount: r.amount,
      category: guess.category, subTag: guess.subTag,
      merchant: r.merchant, source: 'TNG Screenshot Import', notes: r.type, type: r.type,
      account: 'TNG'
    });
  });
  return rows;
}

// Best-effort — there's no confirmed screenshot format for the physical
// Card yet (unlike the eWallet's well-tested "Activity" screen), so this
// reuses the exact same OCR line parser on the assumption a Card history
// screen follows the same date/merchant+amount/type row layout. Test
// against a real screenshot and adjust if the format turns out different.
async function parseCardScreenshotFile(file) {
  const records = await extractScreenshotRecords(file);
  if (!records.length) {
    const rawLines = (records.__rawLines || []).join('\n') || '(none)';
    const err = new Error(`Couldn't recognize any transactions in that screenshot.\n\nRecognized text:\n${rawLines}`);
    err.diagnostic = true;
    throw err;
  }
  const rows = [];
  records.forEach(r => {
    if (isInImportExcludeWindow(r.date)) return;
    const isReload = /Reload/i.test(r.type) || /^Reload$/i.test(r.merchant);
    if (isReload) {
      rows.push({
        date: r.date, time: r.time || '', amount: r.amount,
        category: 'Transfer', subTag: 'TNG Card Top-up',
        merchant: 'TNG Card Reload', source: 'TNG Card Screenshot Import', notes: r.type, type: 'Reload',
        account: 'TNG Card', flow: 'in'
      });
      return;
    }
    const guess = categorize(r.merchant, r.type) || { category: 'Car', subTag: 'Parking' };
    rows.push({
      date: r.date, time: r.time || '', amount: r.amount,
      category: guess.category, subTag: guess.subTag,
      merchant: r.merchant, source: 'TNG Card Screenshot Import', notes: r.type, type: r.type,
      account: 'TNG Card'
    });
  });
  return rows;
}

// ---- Preview / review step ----
// Group by / Sort by for the import preview list — separate state from the
// Main list's groupMode/sortMode so changing one never affects the other.
// Reuses the same txnTimestamp() helper (it only reads .date/.time, which
// parsed rows have too) so "Newest first" etc. behaves identically to Main.
let importGroupMode = 'none';
let importSortMode = 'date_desc';

function sortPreviewIndexed(indexed) {
  const sorted = [...indexed];
  if (importSortMode === 'date_desc') sorted.sort((a, b) => txnTimestamp(b.r) - txnTimestamp(a.r));
  else if (importSortMode === 'date_asc') sorted.sort((a, b) => txnTimestamp(a.r) - txnTimestamp(b.r));
  else if (importSortMode === 'amount_desc') sorted.sort((a, b) => Number(b.r.amount) - Number(a.r.amount));
  else if (importSortMode === 'amount_asc') sorted.sort((a, b) => Number(a.r.amount) - Number(b.r.amount));
  return sorted;
}
function previewGroupKeyFor(r) {
  if (importGroupMode === 'day') return new Date(r.date).toDateString();
  if (importGroupMode === 'category') return (r.category || 'Unsure') + (r.subTag ? ' · ' + r.subTag : '');
  if (importGroupMode === 'merchant') return r.merchant || r.notes || 'Unknown';
  return '__all__';
}

// Fixed display order + labels for the status sections the preview screen
// groups rows into (see classifyImportRows below). "restored" only shows up
// once you've tapped "Keep anyway" on a duplicate.
const IMPORT_SECTION_ORDER = ['reviewSynced', 'newDate', 'oldDate', 'restored'];
const IMPORT_SECTION_LABEL = {
  reviewSynced: '🔄 Will sync a pending review record',
  newDate: '🆕 New — first record for this date',
  oldDate: '➕ New — added to a date you already have',
  restored: '↩️ Restored (kept anyway)',
};

function renderImportPreview() {
  // Sorting/grouping only changes what order rows are DISPLAYED in — the
  // underlying pendingImportRows array (and its indices) never gets
  // reordered, since the ✕/category/remember controls below all target a
  // row by its original index into that array.
  const indexed = pendingImportRows.map((r, i) => ({ r, i, section: pendingImportSections[i] }));

  const rowHtml = ({ r, i, section }) => {
    const { sign, cls: amtClass } = txnSignInfo(r);
    // Only reviewSynced rows have a pair label — shows which side of a
    // transfer this import will confirm, e.g. "HL > TNG TBC", using the
    // same yellow badge as the TBC flag in History/Review.
    const reviewLabel = section === 'reviewSynced' ? pendingImportReviewLabels[i] : null;
    const reviewBadgeHtml = reviewLabel
      ? `<span class="tbc-flag" title="This import confirms the ${escapeHtml(reviewLabel)} transfer — the other account was already recorded, no need to import it again">${escapeHtml(reviewLabel)}</span>`
      : '';
    return `
    <div class="txn preview-row">
      <div class="preview-top">
        <div class="dot ${ALL_CATEGORIES.includes(r.category) ? r.category : 'Custom'}"></div>
        <div class="info">
          <div class="merchant">${txnTitle(r)}${reviewBadgeHtml}</div>
          <div class="meta">${r.date} · ${r.time || 'No time record'}</div>
        </div>
        <div class="${amtClass}">${sign}RM${Number(r.amount).toFixed(2)}</div>
        <span class="preview-remove" data-idx="${i}">✕</span>
      </div>
      <select data-cat-idx="${i}">${categoryOptionsHtml(r.category, r.subTag, r.account)}</select>
      <label class="preview-remember">
        <input type="checkbox" data-remember-idx="${i}"> Always categorize "${r.merchant}" this way
      </label>
    </div>
  `;
  };

  const dupRowHtml = (r, i) => `
    <div class="txn preview-row preview-row-dup">
      <div class="preview-top">
        <div class="dot ${ALL_CATEGORIES.includes(r.category) ? r.category : 'Custom'}"></div>
        <div class="info">
          <div class="merchant">${txnTitle(r)}</div>
          <div class="meta">${r.date} · ${r.time || 'No time record'} · matches an existing record</div>
        </div>
        <div>RM${Number(r.amount).toFixed(2)}</div>
        <span class="preview-keep" data-dup-idx="${i}">Keep anyway</span>
      </div>
    </div>
  `;

  const renderSectionBody = (items) => {
    const sorted = sortPreviewIndexed(items);
    if (importGroupMode === 'none') return sorted.map(rowHtml).join('');
    const groups = {};
    const order = [];
    sorted.forEach(item => {
      const key = previewGroupKeyFor(item.r);
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(item);
    });
    return order.map(key => `
      <div class="preview-group">
        <div class="history-section-label history-section-sublabel">${escapeHtml(key)}</div>
        ${groups[key].map(rowHtml).join('')}
      </div>
    `).join('');
  };

  let html = '';

  if (pendingImportDuplicates.length) {
    const chevron = importDuplicatesCollapsed ? '▸' : '▾';
    html += `
      <div class="preview-group">
        <div class="history-section-label preview-section-toggle" id="dupSectionToggle">
          <span class="preview-section-chevron">${chevron}</span> ✕ Already in your data (${pendingImportDuplicates.length}) — not imported
        </div>
        ${importDuplicatesCollapsed ? '' : pendingImportDuplicates.map(dupRowHtml).join('')}
      </div>
    `;
  }

  IMPORT_SECTION_ORDER.forEach(sectionKey => {
    const items = indexed.filter(it => it.section === sectionKey);
    if (!items.length) return;
    html += `
      <div class="preview-group">
        <div class="history-section-label">${IMPORT_SECTION_LABEL[sectionKey]} (${items.length})</div>
        ${renderSectionBody(items)}
      </div>
    `;
  });

  importPreviewList.innerHTML = html;

  const dupToggle = document.getElementById('dupSectionToggle');
  if (dupToggle) {
    dupToggle.onclick = () => {
      importDuplicatesCollapsed = !importDuplicatesCollapsed;
      renderImportPreview();
    };
  }

  importPreviewList.querySelectorAll('[data-idx]').forEach(el => {
    el.onclick = () => {
      const idx = Number(el.dataset.idx);
      pendingImportRows.splice(idx, 1);
      pendingImportSections.splice(idx, 1);
      pendingImportReviewLabels.splice(idx, 1);
      renderImportPreview();
      importSubmitBtn.textContent = `Import ${pendingImportRows.length} transactions`;
    };
  });
  importPreviewList.querySelectorAll('[data-cat-idx]').forEach(el => {
    el.onchange = () => {
      const idx = Number(el.dataset.catIdx);
      const [category, subTag] = el.value.split('|');
      pendingImportRows[idx].category = category;
      pendingImportRows[idx].subTag = subTag;
    };
  });
  importPreviewList.querySelectorAll('[data-remember-idx]').forEach(el => {
    el.onchange = () => {
      const idx = Number(el.dataset.rememberIdx);
      pendingImportRows[idx].rememberMerchant = el.checked;
    };
  });
  importPreviewList.querySelectorAll('[data-dup-idx]').forEach(el => {
    el.onclick = () => {
      const idx = Number(el.dataset.dupIdx);
      const [row] = pendingImportDuplicates.splice(idx, 1);
      pendingImportRows.push(row);
      pendingImportSections.push('restored');
      pendingImportReviewLabels.push(null);
      renderImportPreview();
      importSubmitBtn.textContent = `Import ${pendingImportRows.length} transactions`;
    };
  });
}

// Duplicate detection — a parsed row is treated as a duplicate if an
// existing transaction on the SAME account already has the exact same
// date, time, amount, and merchant/notes text ("context"). This catches
// re-importing the same statement twice, or two date ranges that overlap.
// Also catches duplicates WITHIN the same import batch — e.g. picking the
// same screenshot twice, or two screenshots that both cover part of the
// same day. Duplicates are held out of what gets submitted, but — unlike
// before — they're still shown in the preview (in their own read-only
// section) with a "Keep anyway" option, instead of silently vanishing.
function importRowContext(r) {
  return String(r.merchant || r.notes || '').trim().toLowerCase();
}
function importRowsMatch(a, b) {
  return (a.account || 'TNG') === (b.account || 'TNG') &&
    a.date === b.date &&
    String(a.time || '') === String(b.time || '') &&
    Math.abs(Number(a.amount || 0) - Number(b.amount || 0)) < 0.005 &&
    importRowContext(a) === importRowContext(b);
}

// Mirrors the account+date+amount check the backend's confirmTbcIfMatches_
// uses to auto-clear a pending "*TBC" review placeholder — deliberately
// looser than importRowsMatch (no time/context needed) since that's what
// actually decides whether importing this row will sync a review record
// instead of adding a brand new one.
function findReviewMatch(r) {
  return allTxns.find(t => t.remark && t.remark.indexOf('*TBC') === 0 &&
    (t.account || 'TNG') === (r.account || 'TNG') &&
    t.date === r.date &&
    Math.abs(Number(t.amount || 0) - Number(r.amount || 0)) <= 0.01);
}

function accountDateKey(account, date) { return (account || 'TNG') + '|' + date; }

// Splits freshly-parsed rows into the buckets the preview screen shows:
// duplicate (exact match, held back from import), reviewSynced (matches a
// pending review placeholder — importing it clears that placeholder rather
// than adding a new row), newDate (first transaction ever seen for that
// account+date) and oldDate (adds to a date that already has other
// transactions). The new/old-date split is based on a snapshot of allTxns
// taken before this batch, so two rows landing on the same brand-new date
// within the same batch both count as "new date" rather than the second
// one flipping to "old date".
function classifyImportRows(rows) {
  const existingDateKeys = new Set(allTxns.map(t => accountDateKey(t.account, t.date)));
  const duplicate = [], reviewSynced = [], reviewSyncedLabels = [], newDate = [], oldDate = [];
  const keptSoFar = [];
  rows.forEach(r => {
    const dupExisting = allTxns.some(t => importRowsMatch(t, r));
    const dupInBatch = keptSoFar.some(k => importRowsMatch(k, r));
    if (dupExisting || dupInBatch) { duplicate.push(r); return; }
    keptSoFar.push(r);
    const reviewMatch = findReviewMatch(r);
    if (reviewMatch) { reviewSynced.push(r); reviewSyncedLabels.push(tbcPairLabel(reviewMatch)); return; }
    if (existingDateKeys.has(accountDateKey(r.account, r.date))) oldDate.push(r);
    else newDate.push(r);
  });
  return { duplicate, reviewSynced, reviewSyncedLabels, newDate, oldDate };
}

function showImportPreview(rows, extraNote) {
  const { duplicate, reviewSynced, reviewSyncedLabels, newDate, oldDate } = classifyImportRows(rows);
  pendingImportDuplicates = duplicate;
  pendingImportRows = [...reviewSynced, ...newDate, ...oldDate];
  pendingImportSections = [
    ...reviewSynced.map(() => 'reviewSynced'),
    ...newDate.map(() => 'newDate'),
    ...oldDate.map(() => 'oldDate'),
  ];
  pendingImportReviewLabels = [
    ...reviewSyncedLabels,
    ...newDate.map(() => null),
    ...oldDate.map(() => null),
  ];

  importStage = 'preview';
  importPickField.style.display = 'none';
  document.getElementById('importToolbar').style.display = 'flex';
  importPreviewList.style.display = 'flex';
  importBackBtn.style.display = 'block';
  renderImportPreview();
  importSubmitBtn.textContent = `Import ${pendingImportRows.length} transactions`;
  const dupNote = duplicate.length
    ? `${duplicate.length} likely duplicate${duplicate.length > 1 ? 's' : ''} already in your data (shown below, not imported unless you keep them). `
    : '';
  const notes = [extraNote, dupNote].filter(Boolean).join(' ');
  importStatusEl.textContent = pendingImportRows.length
    ? `${notes}Review the ${pendingImportRows.length} transaction(s) below — fix the category if needed, tap ✕ to drop any that look wrong, then Import.`
    : `${notes}Nothing new to import — every transaction found was already in your data.`;
}

importSubmitBtn.onclick = async () => {
  if (importStage === 'pick') {
    const files = Array.from(document.getElementById('fFile').files || []);
    if (!files.length) { importStatusEl.textContent = 'Choose a file first.'; return; }

    const importAccount = document.getElementById('importAccount').value;
    const isScreenshot = importAccount.endsWith('-Screenshot');

    importStatusEl.className = 'status-msg';
    importSubmitBtn.disabled = true;
    let rows = [];

    if (isScreenshot) {
      // Multiple screenshots can be picked at once (e.g. a day's worth of
      // TNG activity) — read each one in turn and merge everything found
      // into a single preview list. One bad/unreadable screenshot doesn't
      // block the rest; its error just gets listed at the end.
      const failures = [];
      for (let i = 0; i < files.length; i++) {
        importStatusEl.textContent = files.length > 1
          ? `Reading screenshot ${i + 1} of ${files.length}… (OCR can take 10-30s each)`
          : 'Reading screenshot… (OCR can take 10-30s, especially the first time)';
        const f = files[i];
        try {
          const fileRows = importAccount === 'TNG Card-Screenshot'
            ? await parseCardScreenshotFile(f)
            : await parseScreenshotFile(f);
          rows = rows.concat(fileRows);
        } catch (err) {
          failures.push(f.name + ': ' + (err && err.message ? err.message.split('\n')[0] : err));
        }
      }
      importSubmitBtn.disabled = false;
      if (!rows.length) {
        importStatusEl.className = 'status-msg debug';
        importStatusEl.textContent = failures.length
          ? `Couldn't recognize any transactions.\n\n${failures.join('\n')}`
          : 'No spending transactions found in that screenshot.';
        return;
      }
      // showImportPreview() sets its own status text right after this, so
      // pass the failure note through instead of setting it here directly —
      // otherwise it would be overwritten before ever being seen.
      const failNote = failures.length
        ? `${failures.length} screenshot(s) failed: ${failures.join('; ')}`
        : '';
      showImportPreview(rows, failNote);
      return;
    }

    const file = files[0];
    importStatusEl.textContent = 'Reading file…';
    try {
      if (importAccount === 'PBank') {
        rows = await parseBankACsvFile(file);
      } else if (importAccount === 'HL Bank') {
        rows = await parseBankBCsvFile(file);
      } else if (importAccount === 'TNG Card') {
        rows = file.name.toLowerCase().endsWith('.pdf') ? await parseCardPdfFile(file) : await parseCardCsvFile(file);
      } else if (file.name.toLowerCase().endsWith('.pdf')) {
        rows = await parsePdfFile(file);
      } else {
        rows = await parseCsvFile(file);
      }
    } catch (err) {
      if (err && err.diagnostic) {
        importStatusEl.className = 'status-msg debug';
        importStatusEl.textContent = err.message;
      } else {
        importStatusEl.className = 'status-msg';
        importStatusEl.textContent = 'Could not read file: ' + (err && err.message ? err.message : err);
      }
      importSubmitBtn.disabled = false;
      return;
    }
    importSubmitBtn.disabled = false;

    if (!rows.length) { importStatusEl.textContent = 'No spending transactions found in that file.'; return; }
    showImportPreview(rows);
    return;
  }

  // importStage === 'preview' -> actually commit
  if (!pendingImportRows.length) { importStatusEl.textContent = 'Nothing left to import.'; return; }
  importStatusEl.textContent = `Importing ${pendingImportRows.length} transactions…`;
  importSubmitBtn.disabled = true;
  try {
    await callApi('import', { rows: pendingImportRows });
    importStatusEl.textContent = `Imported ${pendingImportRows.length} transactions.`;
    setTimeout(() => { importBackdrop.classList.remove('open'); loadData(); }, 800);
  } catch (err) {
    importStatusEl.textContent = 'Import failed — try again.';
    importSubmitBtn.disabled = false;
  }
};

loadData();
</script>
</body>
</html>
