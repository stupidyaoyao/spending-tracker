<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spending">
<title>Daily Spending Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<style>
  :root {
    --bg: #0b0b0d;
    --card: #17171b;
    --accent: #f5a623;
    --text: #f5f5f7;
    --muted: #8e8e93;
    /* Semantic palette: categories that are always spending (Car/Food/
       Shopping/Entertainment/Housing) get warm red/orange tones; Transfer
       stays neutral grey since money can move either direction; Other stays
       purple as a "needs review" flag since it holds the Unsure subtag. */
    --car: #ff453a;
    --shopping: #ff9f0a;
    --food: #ff6b35;
    --entertainment: #ffd60a;
    --housing: #ff7a9c;
    --other: #bf5af2;
    --transfer: #8e8e93;
    --income: #30d158;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    height: 100%; overscroll-behavior: none;
  }
  #app { max-width: 480px; margin: 0 auto; padding: env(safe-area-inset-top) 16px 100px; }
  header { padding: 18px 0 8px; }
  header h1 { font-size: 28px; margin: 0; font-weight: 700; }
  .page-tabs { display: flex; gap: 8px; margin-top: 14px; }
  .page-tab {
    padding: 8px 16px; border-radius: 999px; background: var(--card); color: var(--text);
    font-size: 13px; font-weight: 500; border: 1px solid transparent;
  }
  .page-tab.active { background: #0a84ff; color: #fff; }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
  .cal-nav-btn { background: var(--card); color: var(--text); font-size: 18px; width: 36px; height: 36px; border-radius: 10px; border: none; }
  #calMonthLabel { font-size: 15px; font-weight: 500; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .cal-weekdays span { text-align: center; font-size: 11px; color: var(--muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
  .cal-day {
    background: var(--card); border-radius: 10px; padding: 6px; min-height: 52px;
    border: 2px solid transparent; text-align: left;
  }
  .cal-day.empty-cell { background: none; }
  .cal-day .cal-day-num { font-size: 12px; color: var(--muted); display: block; }
  .cal-day .cal-day-amt { font-size: 11px; font-weight: 500; margin-top: 12px; display: block; }
  .cal-day.selected { border-color: var(--accent); }
  .cal-day.spend-light { background: #241c14; }
  .cal-day.spend-medium { background: #33231a; }
  .cal-day.spend-heavy { background: #43241c; }
  .cal-day-panel { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .cal-day-panel .cal-day-panel-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .cal-day-panel .cal-day-panel-head span:first-child { font-size: 15px; font-weight: 500; }
  .cal-day-panel .cal-day-panel-head span:last-child { font-size: 15px; font-weight: 500; color: var(--accent); }

  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-entry { background: var(--card); border-radius: 12px; padding: 10px 14px; }
  .history-entry .history-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .history-entry .history-action { font-size: 12px; color: var(--accent); font-weight: 500; }
  .history-entry .history-time { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .history-entry .history-details { font-size: 14px; margin-top: 4px; }
  .totals { display: flex; gap: 10px; margin: 14px 0; }
  .total-card { flex: 1; background: var(--card); border-radius: 14px; padding: 12px; }
  .total-card .label { font-size: 12px; color: var(--muted); }
  .total-card .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
  .total-card { cursor: pointer; border: 1px solid transparent; }
  .total-card.active { border-color: var(--accent); background: #241c0f; }
  .filters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; }
  .filter-chip {
    flex-shrink: 0; padding: 8px 14px; border-radius: 999px; background: var(--card);
    color: var(--text); font-size: 14px; border: 1px solid transparent;
  }
  .filter-chip.active { background: var(--accent); color: #1a1a1a; font-weight: 600; }
  .subfilters { display: none; gap: 6px; overflow-x: auto; padding: 0 0 12px; margin-top: -6px; }
  .subfilters .filter-chip { padding: 6px 12px; font-size: 12px; }
  .accountfilters .filter-chip { padding: 6px 12px; font-size: 12px; border: 1px solid #2c2c2e; }
  .accountfilters .filter-chip.active { background: #0a84ff; color: #fff; }

  .chart-card {
    background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 14px;
  }
  .chart-card .chart-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .chart-card .chart-head span { font-size: 13px; color: var(--muted); }
  .chart-wrap { position: relative; height: 180px; }
  .chart-stats { display: flex; gap: 10px; margin-bottom: 10px; }
  .chart-stats .stat { flex: 1; text-align: center; }
  .chart-stats .stat-label { display: block; font-size: 11px; color: var(--muted); }
  .chart-stats .stat-value { display: block; font-size: 15px; font-weight: 700; margin-top: 2px; }
  .chart-stats .stat-value.expense { color: #ff453a; }
  .chart-stats .stat-value.income { color: #30d158; }
  .chart-stats .stat-value.positive { color: #30d158; }
  .chart-stats .stat-value.negative { color: #ff453a; }
  .chart-loading {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--card); border-radius: 10px;
  }
  .chart-loading.show { display: flex; }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%; border: 3px solid #2c2c2e;
    border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  .mini-chart-wrap .spinner { width: 18px; height: 18px; border-width: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search-row { margin-bottom: 10px; }
  .search-row input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: none;
    background: var(--card); color: var(--text); font-size: 14px;
  }
  .search-row input::placeholder { color: var(--muted); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
  .toolbar select {
    flex: 1; padding: 9px 10px; border-radius: 10px; border: none; background: var(--card);
    color: var(--text); font-size: 13px;
  }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .day-group { margin-top: 10px; }
  .day-header { font-size: 13px; color: var(--muted); margin: 10px 2px 6px; display: flex; justify-content: space-between; }
  .txn {
    background: var(--card); border-radius: 14px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.Car { background: var(--car); }
  .dot.Shopping { background: var(--shopping); }
  .dot.Food { background: var(--food); }
  .dot.Entertainment { background: var(--entertainment); }
  .dot.Housing { background: var(--housing); }
  .dot.Other { background: var(--other); }
  .dot.Transfer { background: var(--transfer); }
  .dot.Income { background: var(--income); }
  .dot.Custom { background: var(--muted); }
  .txn .info { flex: 1; min-width: 0; }
  .txn .merchant { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txn .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .txn .amount { font-size: 15px; font-weight: 700; color: #ff453a; }
  .txn .amount.in { color: #30d158; }
  .txn .amount.internal { color: #ffd60a; }
  .transfer-hint { font-size: 11px; color: #0a84ff; margin-top: 2px; }
  .txn-cat-select {
    margin-top: 5px; font-size: 11px; background: var(--bg); color: var(--muted);
    border: 1px solid #2c2c2e; border-radius: 6px; padding: 3px 4px; max-width: 100%;
  }
  .txn-extratag-select {
    margin-top: 5px; margin-left: 6px; font-size: 11px; background: var(--bg); color: var(--muted);
    border: 1px dashed #3a3a3c; border-radius: 6px; padding: 3px 4px; max-width: 100%;
  }
  .txn-extratag-select.has-extra { color: var(--accent); border-color: var(--accent); }
  .cat-select-row { display: flex; flex-wrap: wrap; }
  .txn-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .remark-btn {
    background: none; border: none; color: var(--muted); font-size: 15px; padding: 2px 2px;
    cursor: pointer; line-height: 1;
  }
  .remark-btn.has-remark { color: var(--accent); }
  .link-btn {
    background: none; border: none; color: var(--muted); font-size: 15px; padding: 2px 2px;
    cursor: pointer; line-height: 1;
  }
  .link-btn.has-link { color: #0a84ff; }
  .txn .remark {
    font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }

  .fab-row { position: fixed; bottom: 24px; right: 16px; display: flex; flex-direction: column; gap: 10px; }
  .fab {
    width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #1a1a1a;
    border: none; font-size: 26px; box-shadow: 0 6px 16px rgba(0,0,0,.4); display: flex;
    align-items: center; justify-content: center;
  }
  .fab.secondary { background: var(--card); color: var(--text); width: 46px; height: 46px; font-size: 18px; }

  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none;
    align-items: flex-end; justify-content: center; z-index: 20;
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    background: #1c1c1e; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height: 85vh; overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 14px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 12px; border-radius: 10px; border: none; background: #2c2c2e;
    color: var(--text); font-size: 16px;
  }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .btn {
    width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--accent);
    color: #1a1a1a; font-size: 16px; font-weight: 700; margin-top: 6px;
  }
  .btn.secondary { background: #2c2c2e; color: var(--text); }
  .close-x { position: absolute; top: 14px; right: 16px; color: var(--muted); font-size: 22px; }
  .sheet-inner { position: relative; }
  .status-msg { text-align: center; font-size: 13px; color: var(--muted); margin: 8px 0; white-space: pre-wrap; }
  .status-msg.debug { text-align: left; font-family: ui-monospace, monospace; font-size: 11px; background: #2c2c2e; padding: 10px; border-radius: 8px; max-height: 220px; overflow-y: auto; }
  input[type=file] { color: var(--muted); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { font-size: 13px; color: var(--muted); margin: 0; }

  .preview-row { padding: 10px; flex-direction: column; align-items: stretch; gap: 6px; }
  .preview-row .preview-top { display: flex; align-items: center; gap: 10px; }
  .preview-row .info { flex: 1; min-width: 0; }
  .preview-remove { font-size: 16px; color: var(--muted); padding: 0 4px; flex-shrink: 0; }
  .preview-row select { width: 100%; padding: 8px; border-radius: 8px; border: none; background: #2c2c2e; color: var(--text); font-size: 13px; }
  .preview-row .preview-remember { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .preview-row .preview-remember input { width: auto; }
  .preview-list { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }

  .mini-charts { display: flex; gap: 10px; margin-bottom: 14px; }
  .mini-charts.zoomed { flex-direction: column; }
  .mini-chart-card { flex: 1; min-width: 0; background: var(--card); border-radius: 16px; padding: 14px 10px; }
  .mini-charts.zoomed .mini-chart-card { flex: none; padding: 16px; }
  .mini-chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; font-size: 12px; color: var(--muted); margin-bottom: 8px; white-space: nowrap; overflow: hidden; }
  .mini-chart-head span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .mini-chart-wrap { position: relative; height: 110px; }
  .mini-charts.zoomed .mini-chart-wrap { height: 220px; }
  .mini-chart-truebalance { text-align: center; font-size: 13px; color: var(--muted); margin-top: 8px; font-weight: 500; }
  .mini-chart-updated { text-align: center; font-size: 11px; color: var(--muted); opacity: 0.7; margin-top: 2px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Spending</h1>
    <div class="page-tabs" id="pageTabs">
      <button class="page-tab active" data-page="main">Main</button>
      <button class="page-tab" data-page="calendar">Calendar</button>
      <button class="page-tab" data-page="history">History</button>
    </div>
  </header>

  <div id="mainPage">
    <div class="totals" id="totals"></div>

    <div class="chart-card">
      <div class="chart-head">
        <span id="chartTitle">Overall</span>
        <span id="chartTotal"></span>
      </div>
      <div class="chart-stats" id="chartStats" style="display:none;">
        <div class="stat"><span class="stat-label">Expense</span><span class="stat-value expense" id="statExpense"></span></div>
        <div class="stat"><span class="stat-label">Income</span><span class="stat-value income" id="statIncome"></span></div>
        <div class="stat"><span class="stat-label">Balance</span><span class="stat-value" id="statBalance"></span></div>
      </div>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
        <div class="chart-loading show" id="chartLoading"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="mini-charts" id="miniCharts"></div>

    <div class="filters accountfilters" id="accountfilters"></div>
    <div class="filters" id="filters"></div>
    <div class="filters subfilters" id="subfilters"></div>

    <div class="search-row">
      <input type="search" id="searchBox" placeholder="Search merchant, notes, remark…">
    </div>

    <div class="toolbar">
      <select id="groupBy">
        <option value="day">Group by: Day</option>
        <option value="category">Group by: Category</option>
        <option value="merchant">Group by: Merchant</option>
        <option value="none">Group by: None</option>
      </select>
      <select id="sortBy">
        <option value="date_desc">Sort: Newest first</option>
        <option value="date_asc">Sort: Oldest first</option>
        <option value="amount_desc">Sort: Amount high-low</option>
        <option value="amount_asc">Sort: Amount low-high</option>
      </select>
    </div>

    <div class="list" id="list"><div class="empty">Loading…</div></div>
  </div>

  <div id="calendarPage" style="display:none;">
    <div class="cal-nav">
      <button class="cal-nav-btn" id="calPrev">&lsaquo;</button>
      <span id="calMonthLabel"></span>
      <button class="cal-nav-btn" id="calNext">&rsaquo;</button>
    </div>
    <div class="cal-weekdays">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="calDayPanel"></div>
  </div>

  <div id="historyPage" style="display:none;">
    <div class="history-list" id="historyList"><div class="empty">Loading…</div></div>
  </div>
</div>

<div class="fab-row">
  <button class="fab secondary" id="importBtn" title="Import">⇪</button>
  <button class="fab" id="addBtn" title="Add">+</button>
</div>

<!-- Add transaction sheet -->
<div class="sheet-backdrop" id="addBackdrop">
  <div class="sheet">
    <div class="sheet-inner">
      <span class="close-x" id="addClose">✕</span>
      <h2>Add expense</h2>
      <div class="row2">
        <div class="field">
          <label>Amount (RM)</label>
          <input type="number" step="0.01" id="fAmount" placeholder="0.00">
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="fDate">
        </div>
      </div>
      <div class="field">
        <label>Time</label>
        <input type="time" id="fTime">
      </div>
      <div class="row2">
        <div class="field">
          <label>Category</label>
          <select id="fCategory"></select>
        </div>
        <div class="field">
          <label>Account</label>
          <select id="fAccount">
            <option value="TNG">TNG</option>
            <option value="HL Bank">HL Bank</option>
            <option value="PBank">PBank</option>
            <option value="Cash">Cash</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Merchant / Notes</label>
        <input type="text" id="fMerchant" placeholder="e.g. Thong Kee, KESAS, Ooi KX">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="fRemember">
        <label for="fRemember">Always categorize this merchant/person the same way</label>
      </div>
      <button class="btn" id="fSubmit">Add</button>
    </div>
  </div>
</div>

<!-- Import sheet: PDF or CSV, with a review step before committing -->
<div class="sheet-backdrop" id="importBackdrop">
  <div class="sheet">
    <div class="sheet-inner">
      <span class="close-x" id="importClose">✕</span>
      <h2>Import statement</h2>

      <div class="field" id="importAccountField">
        <label>Import from</label>
        <select id="importAccount">
          <option value="TNG">TNG eWallet (PDF or CSV)</option>
          <option value="TNG-Screenshot">TNG eWallet (Screenshot)</option>
          <option value="HL Bank">HL Bank (CSV)</option>
          <option value="PBank">PBank (CSV)</option>
        </select>
      </div>

      <div class="field" id="importPickField">
        <label id="importPickLabel">Statement file</label>
        <input type="file" id="fFile" accept=".pdf,.csv">
      </div>

      <div class="preview-list" id="importPreviewList" style="display:none;"></div>

      <div class="status-msg" id="importStatus"></div>
      <button class="btn" id="importSubmit">Read file</button>
      <button class="btn secondary" id="importBack" style="display:none;">Choose a different file</button>
    </div>
  </div>
</div>

<script>
// ==========================================================================
// This is a STANDALONE static page — it is NOT served by Apps Script.
// Host it anywhere (Netlify, GitHub Pages, Firebase Hosting, etc). All
// read/write calls hit the Apps Script /exec URL below as a plain JSON API
// via fetch(), instead of google.script.run (which only works when the
// page itself is served by HtmlService). This sidesteps the iOS Safari/
// Chrome bug where navigating directly to a script.google.com URL can fail
// with "Sorry, unable to open the file at present" (a known Apps Script +
// iOS multi-account redirect/cookie issue) — here script.google.com is
// only ever hit via background fetch() calls, never a full-page load.
// ==========================================================================
// NOTE: this project has (had) two separate Web App deployments of the same
// Apps Script — this URL previously pointed at a second deployment that had
// drifted to an old code version (stuck missing several fixes, including the
// Transfer/Income categories). Consolidated onto the one deployment that's
// consistently redeployed going forward, to remove that class of bug.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby95kLVf8_mho2dIxQ4GsncTBLBNIVZ_azjhko5bRhMioXy-r-H6_a_Qv1YA1Si4uUzkA/exec';

// POST helper. Uses Content-Type: text/plain so the request stays a CORS
// "simple request" (no OPTIONS preflight) — Apps Script web apps can't
// answer custom preflight requests.
async function callApi(action, extra) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, extra))
  });
  return res.json();
}

// Category rules — mirrors Code.gs CATEGORY_RULES exactly. Used by manual
// add fallback, CSV import, and PDF import to pre-guess a category before
// the user reviews/confirms it.
const CATEGORY_RULES = [
  { category: 'Transfer', subTag: 'Card Reload', keywords: ['CARD RELOAD'] },
  { category: 'Car', subTag: 'Toll', keywords: [
    'SPE', 'KESAS', 'LDP', 'MEX', 'BESRAYA', 'SUKE', 'SMART',
    'PLAZA LOKE YEW', 'AWAN BESAR', 'PUCHONG SELATAN', 'SG RAMAL',
    'SALAK SELATAN', 'PETALING JAYA', 'ALAM DAMAI', 'BUKIT TERATAI',
    'AMPANG', 'SUNWAY'
  ] },
  { category: 'Car', subTag: 'Parking', keywords: ['PARKING', 'CARPARK', 'CAR PARK'] },
  { category: 'Car', subTag: 'Fuel', keywords: ['PETRONAS', 'SHELL', 'PETRON', 'CALTEX', 'BHP'] },
  { category: 'Car', subTag: 'Service', keywords: ['WORKSHOP', 'BENGKEL', 'TAYAR', 'SERVICE CENTRE', 'AUTO CARE', 'CAR WASH', 'CARWASH'] },

function categoryOptionsHtml(selectedCategory, selectedSubTag, account) {
  const isCurrent = (o) => o.category === selectedCategory && o.subTag === (selectedSubTag || '');
  return CATEGORY_OPTIONS.filter(o => {
    const isCardReload = o.category === 'Transfer' && (o.subTag === 'Card Reload' || o.subTag === 'TNG Card Top-up');
    if (isCardReload && account && account !== 'TNG' && !isCurrent(o)) return false;
    return true;
  }).map(o => {
    const val = optionValue(o);
    const sel = isCurrent(o) ? ' selected' : '';
    return `<option value="${val}"${sel}>${o.label}</option>`;
  }).join('');
}

// Learned per-merchant/per-person rules (e.g. "Ooi KX" -> Food), loaded
// from the backend on startup. Checked BEFORE the built-in keyword rules,
// same priority order as Code.gs's categorize_().
let merchantRules = [];

// "True balance" anchors — [{ account, asOfDate, asOfBalance }, ...] loaded
// from the AccountBalances sheet. Accounts with no entry here (e.g. Cash,
// whose real on-hand cash is hard to pin down) just don't show a true
// balance. See trueBalanceFor() below for how this combines with allTxns.
let accountBalances = [];

// Real running balance for one account: the anchor you gave (asOfBalance,
// as of asOfDate) plus every transaction on that account dated AFTER the
// anchor, summed by its REAL flow direction across every category — unlike
// the Income-Expense "Balance" stat (which deliberately excludes Transfer
// so wallet top-ups/sends don't inflate spend totals), this is meant to
// track your actual account balance, so nothing is excluded here. Returns
// null if this account has no anchor set yet.
function trueBalanceFor(account) {
  const anchor = accountBalances.find(b => b.account === account);
  if (!anchor) return null;
  let relevant;
  if (account === 'TNG Card') {
    // Pseudo-account: the physical TNG Card's own balance (separate from the
    // eWallet — see the CATEGORY_OPTIONS note on "TNG Card Top-up"). It has
    // no Account column of its own; it's funded purely by TNG rows tagged
    // with that subtag.
    relevant = allTxns.filter(t => t.account === 'TNG' && t.subTag === 'TNG Card Top-up');
  } else if (account === 'TNG') {
    // Card top-ups never touch the eWallet, so they're excluded here too —
    // otherwise this would double as both the eWallet AND the card balance.
    relevant = allTxns.filter(t => t.account === 'TNG' && t.subTag !== 'TNG Card Top-up');
  } else {
    relevant = allTxns.filter(t => t.account === account);
  }
  const after = relevant.filter(t => t.date > anchor.asOfDate);
  const delta = after.reduce((s, t) => s + (txnFlow(t) === 'in' ? Number(t.amount || 0) : -Number(t.amount || 0)), 0);
  return anchor.asOfBalance + delta;
}

// "Updated 30 Jul 2026" — the date you last told the tracker this account's
// real balance, shown under each true-balance line so it's clear how fresh
// (or stale) that anchor is, separate from the running total computed on
// top of it.
function formatAnchorDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return '';
  return 'Updated ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function categorize(description, type) {
  if (EXCLUDE_TYPES.includes(type)) return null;

  // Reload = card -> TNG wallet top-up, not spending. Filed under Transfer >
  // Card Reload; can be re-categorized by hand later once you know what a
  // specific reload was actually for.
  if (type === 'Reload') return { category: 'Transfer', subTag: 'Card Reload' };

  // Receive from Wallet (someone sent you money) / Cashback (rewards
  // rebate) are money coming IN, not spending. Filed under Transfer > From
  // Others — no separate "Income" category anymore.
  if (type === 'Receive from Wallet' || type === 'Cashback') {
    return { category: 'Transfer', subTag: 'From Others' };
  }

  const text = (description || '').toUpperCase();

  for (const r of merchantRules) {
    if (r.merchant && text.includes(r.merchant.toUpperCase())) {
      return { category: r.category, subTag: r.subTag || '' };
    }
  }
  for (const rule of CATEGORY_RULES) {
    for (const kw of rule.keywords) {
      if (text.includes(kw)) return { category: rule.category, subTag: rule.subTag || '' };
    }
  }

  // Unresolved person-to-person send -> Transfer > To Others; anything else
  // unmatched -> Other > Unsure.
  if (type === 'Transfer to Wallet') return { category: 'Transfer', subTag: 'To Others' };
  return { category: 'Other', subTag: 'Unsure' };
}

// Minimal HTML-escaping for free-text remarks before they're dropped into
// innerHTML, so a remark containing <, >, & etc. can't break the row markup.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadData() {

// Total real spend (same definition as the Today/Week/Month stat cards —
// Transfer/Income excluded) for one calendar day, across every account.
function calendarDayTotal(dateStr) {
  const dayTxns = allTxns.filter(t => t.date === dateStr && !NON_SPEND_CATEGORIES.includes(t.category));
  return dayTxns.reduce((s, t) => s + spendAmount(t), 0);
}

function renderCalendar() {
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  document.getElementById('calMonthLabel').textContent =
    calendarMonth.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

  const startWeekday = new Date(year, month, 1).getDay(); // 0 = Sun
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // Heat-color the day cells relative to the heaviest spend day THIS month,
  // rather than a fixed RM threshold, so the heatmap stays meaningful
  // whether you're a big spender or a light one.
  let maxTotal = 0;
  const totalsByDay = {};
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const total = calendarDayTotal(dateStr);
    totalsByDay[dateStr] = total;
    if (total > maxTotal) maxTotal = total;
  }

  let html = '';
  for (let i = 0; i < startWeekday; i++) html += '<div class="cal-day empty-cell"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const total = totalsByDay[dateStr];
    let heatClass = '';
    if (total > 0 && maxTotal > 0) {
      const ratio = total / maxTotal;
      heatClass = ratio > 0.66 ? 'spend-heavy' : ratio > 0.33 ? 'spend-medium' : 'spend-light';
    }
    const selectedClass = dateStr === selectedCalendarDay ? 'selected' : '';
    html += `<button class="cal-day ${heatClass} ${selectedClass}" data-date="${dateStr}">
      <span class="cal-day-num">${d}</span>
      ${total > 0 ? `<span class="cal-day-amt">RM${total.toFixed(0)}</span>` : ''}
    </button>`;
  }
  document.getElementById('calGrid').innerHTML = html;
  document.querySelectorAll('.cal-day[data-date]').forEach(el => {
    el.onclick = () => {
      selectedCalendarDay = (selectedCalendarDay === el.dataset.date) ? null : el.dataset.date;
      renderCalendar();
    };
  });

  renderCalDayPanel();
}

// The full-size day detail panel underneath the grid — reuses renderTxnRow()
// and the same attach*Handlers() so a transaction can be edited (category,
// remark, extra tag) from right here, exactly like the Main list.
function renderCalDayPanel() {
  const panelEl = document.getElementById('calDayPanel');
  if (!selectedCalendarDay) { panelEl.innerHTML = ''; return; }
  const dayTxns = sortTxns(allTxns.filter(t => t.date === selectedCalendarDay));
  const total = dayTxns
    .filter(t => !NON_SPEND_CATEGORIES.includes(t.category))
    .reduce((s, t) => s + spendAmount(t), 0);
  const dateObj = new Date(selectedCalendarDay + 'T00:00:00');
  const label = dateObj.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

  let html = `<div class="cal-day-panel"><div class="cal-day-panel-head"><span>${label}</span><span>RM${total.toFixed(2)}</span></div>`;
  html += dayTxns.length ? dayTxns.map(t => renderTxnRow(t)).join('') : '<div class="empty">No transactions.</div>';
  html += '</div>';
  panelEl.innerHTML = html;
  attachCatSelectHandlers();
  attachExtraTagHandlers();
  attachRemarkHandlers();
  attachLinkHandlers();
}

// History page — a reverse-chronological audit trail of real edits (see
// ACTIVITY_LOG_SHEET in Code.gs). Only starts from when this feature was
// added, so it won't show anything from before today.
function renderHistory() {
  const el = document.getElementById('historyList');
  if (!activityLog.length) {
    el.innerHTML = '<div class="empty">No history yet — new edits will show up here.</div>';
    return;
  }
  el.innerHTML = activityLog.map(h => {
    const d = new Date(h.timestamp);
    const when = isNaN(d.getTime())
      ? h.timestamp
      : d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    return `<div class="history-entry">
      <div class="history-top"><span class="history-action">${escapeHtml(h.action)}</span><span class="history-time">${when}</span></div>
      <div class="history-details">${escapeHtml(h.details)}</div>
    </div>`;
  }).join('');
}

function isSameDay(d, ref) {
  return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth() && d.getDate() === ref.getDate();
}
function startOfWeek(d) {
  const r = new Date(d);
  const day = (r.getDay() + 6) % 7; // Monday start
  r.setDate(r.getDate() - day);
  r.setHours(0,0,0,0);
  return r;
}

// Which time window the pies (big + mini) are scoped to — null means all
// time (no scoping). Set by tapping one of the Today/This week/This month
// cards below; tapping the already-active one clears it back to all time.
let activeTimeFilter = null; // null | 'today' | 'week' | 'month'

function isInTimeFilter(t) {
  if (!activeTimeFilter) return true;
  const now = new Date();
  const d = new Date(t.date);
  if (activeTimeFilter === 'today') return isSameDay(d, now);
  if (activeTimeFilter === 'week') return d >= startOfWeek(now);
  if (activeTimeFilter === 'month') return d >= new Date(now.getFullYear(), now.getMonth(), 1);
  return true;
}

function renderTotals(txns) {
  const now = new Date();
  const weekStart = startOfWeek(now);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

  const sum = (filterFn) => txns.filter(filterFn).reduce((s, t) => s + spendAmount(t), 0);

  const today = sum(t => isSameDay(new Date(t.date), now));
  const week = sum(t => new Date(t.date) >= weekStart);
  const month = sum(t => new Date(t.date) >= monthStart);

  const cardActive = (scope) => activeTimeFilter === scope ? ' active' : '';
  document.getElementById('totals').innerHTML = `
    <div class="total-card${cardActive('today')}" data-scope="today"><div class="label">Today</div><div class="value">RM${today.toFixed(2)}</div></div>
    <div class="total-card${cardActive('week')}" data-scope="week"><div class="label">This week</div><div class="value">RM${week.toFixed(2)}</div></div>
    <div class="total-card${cardActive('month')}" data-scope="month"><div class="label">This month</div><div class="value">RM${month.toFixed(2)}</div></div>
  `;
  // Tapping a card scopes the pies (big + mini, see renderCharts()) to that
  // period; tapping the same card again clears back to all-time. This is
  // purely a pie-scoping control — the totals cards themselves always show
  // their own fixed period regardless, and the transaction list below isn't
  // affected.
  document.querySelectorAll('#totals .total-card').forEach(el => {
    el.onclick = () => {
      const scope = el.dataset.scope;
      activeTimeFilter = activeTimeFilter === scope ? null : scope;
      render();
    };
  });
}

// Semantic palette: categories that are always spending get warm red/orange
// tones (Car/Food/Shopping/Entertainment/Housing), Transfer stays neutral
// grey since money moves either direction, and Other stays purple as a
// "needs review" flag since it holds the Unsure subtag.
const CHART_COLORS = {
  Car: '#ff453a', Shopping: '#ff9f0a', Food: '#ff6b35', Entertainment: '#ffd60a',
  Housing: '#ff7a9c', Other: '#bf5af2', Transfer: '#8e8e93', Income: '#30d158'
};

// Not real spending — Transfer covers wallet top-ups (Card Reload), P2P
// sends (To Others), inter-account movement (To Bank B/From Bank A/To TNG/
// Internal); Income covers real external money in (Salary, Interest, and
// other bank credits) that TNG never had. Tracked and filterable like any
// other category, but left out of the "All" totals/pie so none of this
// inflates spend numbers.
const NON_SPEND_CATEGORIES = ['Transfer', 'Income'];
function colorFor(key) { return CHART_COLORS[key] || '#8e8e93'; }

// Subtag palette used when a single category is selected (e.g. Car ->
// Toll/Parking/Fuel/Service/Ride) so the donut breaks down further instead
// of collapsing into one slice. Transfer's subtags are all grey shades since
// the category itself is neutral regardless of which subtag.
const SUBTAG_COLORS = {
  Toll: '#0a84ff', Parking: '#64d2ff', Fuel: '#5e5ce6', Service: '#30d5ff', Ride: '#ff6961',
  'Convenience Store': '#34c759', Hypermarket: '#30d158',
  Subscription: '#ff6482',
  Rent: '#30b0c7', 'Water & Electric': '#64d2ff', WiFi: '#5e5ce6', 'Carpark Rent': '#0a84ff',
  Unsure: '#ff453a',
  'Card Reload': '#a1a1a6', 'TNG Card Top-up': '#6e6e73', 'To Others': '#8e8e93', 'From Others': '#636366', 'Internal': '#48484a',
  Salary: '#30d158', Interest: '#64d2ff'
};
function colorForSub(key) { return SUBTAG_COLORS[key] || '#8e8e93'; }

// Strips anything that isn't a letter/digit, for building a DOM-id-safe
// suffix out of an account name (e.g. "Bank A" -> "BankA").
function cssSafe(s) { return String(s).replace(/[^a-zA-Z0-9]/g, ''); }

function searchFilter(txns) {
  if (!searchQuery) return txns;
  const q = searchQuery.toLowerCase();
  return txns.filter(t =>
    (t.merchant || '').toLowerCase().includes(q) ||
    (t.notes || '').toLowerCase().includes(q) ||
    (t.remark || '').toLowerCase().includes(q) ||
    (t.subTag || '').toLowerCase().includes(q)
  );
}

// Given a "base" pool of transactions (already scoped to whichever account
// this particular pie represents — allTxns for the combined pie, or one
// account's slice for a mini pie), applies the time/category/search
// narrowing a pie should reflect. Mirrors the exact same category/All +
// search rules the transaction list/totals use, just parametrized by base
// so it can run once for the combined pie and once per mini pie.
function chartTxnsFor(base) {
  const scoped = base.filter(isInTimeFilter);
  if (activeFilter === 'All') {
    return searchFilter(scoped).filter(t => !NON_SPEND_CATEGORIES.includes(t.category));
  }
  return scoped.filter(t => t.category === activeFilter);
}

// Same idea, but for the Income category specifically — used alongside
// chartTxnsFor (which deliberately excludes Income, same as spend totals)
// to build the Expense/Income/Balance trio shown on the "Overall" pie.
function incomeTxnsFor(base) {
  return searchFilter(base.filter(isInTimeFilter)).filter(t => t.category === 'Income');
}

// Expense/Income/Balance for whichever base pool (allTxns for the combined
// pie, or one account's slice for a mini pie) — Balance is simply Income
// minus Expense for the currently selected time window (Today/This week/
// This month/all-time), not a real running account balance.
function statsFor(base) {
  const expense = chartTxnsFor(base).reduce((s, t) => s + spendAmount(t), 0);
  const income = incomeTxnsFor(base).reduce((s, t) => s + Number(t.amount || 0), 0);
  return { expense, income, balance: income - expense };
}

// txns: rows to chart. highlightKey: when set to a specific subtag (not
// 'All'), the pie still shows every subtag slice for the category — it does
// NOT collapse down to just that one slice — but only the selected slice
// keeps its real color; every other slice is greyed out. This way tapping a
// sub-filter chip highlights where that subtag sits within the whole
// category instead of hiding the rest of the picture.
// opts: { titleEl, totalEl, legend } — titleEl/totalEl are optional element
// ids to update with the "By category"/"By type" label and the RM total;
// legend controls whether Chart.js draws its own bottom legend (only the
// big combined pie has room for one — the mini pies are too small).
function renderChartOn(canvasId, txns, highlightKey, opts) {
  opts = opts || {};
  // When viewing a single category, break the donut down by subTag instead
  // of category (every row would otherwise share the same category label
  // and collapse into a single slice).
  const bySubTag = activeFilter !== 'All';
  const totals = {};
  txns.forEach(t => {
    const key = bySubTag ? (t.subTag || 'Uncategorized') : t.category;
    totals[key] = (totals[key] || 0) + spendAmount(t);
  });
  const labels = Object.keys(totals);
  const values = labels.map(l => totals[l]);
  const grand = values.reduce((a, b) => a + b, 0);
  const colorFn = bySubTag ? colorForSub : colorFor;
  const GREYED_OUT = '#3a3a3c';
  const isHighlighting = bySubTag && highlightKey && highlightKey !== 'All';

  if (opts.titleEl) document.getElementById(opts.titleEl).textContent = bySubTag ? 'By type' : 'Overall';
  if (opts.totalEl) {
    const totalEl = document.getElementById(opts.totalEl);
    if (totalEl) totalEl.textContent = 'RM' + grand.toFixed(2);
  }

  const canvasEl = document.getElementById(canvasId);
  if (!canvasEl) return;
  const ctx = canvasEl.getContext('2d');
  const data = {
    labels: labels.length ? labels : ['No data'],
    datasets: [{
      data: labels.length ? values : [1],
      backgroundColor: labels.length
        ? labels.map(l => isHighlighting ? (l === highlightKey ? colorFn(l) : GREYED_OUT) : colorFn(l))
        : ['#2c2c2e'],
      borderWidth: 0
    }]
  };
  if (chartInstances[canvasId]) {
    chartInstances[canvasId].data = data;
    chartInstances[canvasId].update();
  } else if (window.Chart) {
    chartInstances[canvasId] = new Chart(ctx, {
      // The big combined "Overall" chart renders as a full pie (opts.pie) —
      // the per-account mini charts stay doughnuts so their center hole
      // still has room for the RM total text overlay.
      type: opts.pie ? 'pie' : 'doughnut',
      data,
      options: {
        responsive: true, maintainAspectRatio: false, cutout: opts.pie ? '0%' : '65%',
        plugins: {
          legend: opts.legend
            ? { position: 'bottom', labels: { color: '#f5f5f7', boxWidth: 10, font: { size: 11 } } }
            : { display: false }
        }
      }
    });
  }
}

// The big "Overall" pie always reflects ALL 3 accounts combined, regardless
// of the Account filter chips — it's a constant whole-picture reference
// point. Below it, a row of mini pies shows the per-account breakdown: one
// each for TNG/HL Bank/PBank when the Account filter is "All", or just the
// one selected account (bigger) when you've drilled into a specific account
// — i.e. picking an account "zooms" the mini row down to that account
// instead of touching the combined pie above it. Both the big pie and the
// minis are further scoped by activeTimeFilter (Today/This week/This
// month/all-time) via chartTxnsFor()/statsFor().
function renderCharts() {
  renderChartOn('chart', chartTxnsFor(allTxns), activeSubFilter, {
    titleEl: 'chartTitle', totalEl: 'chartTotal', legend: true, pie: true
  });
  updateBigStats(allTxns);
  document.getElementById('chartLoading').classList.remove('show');

  const container = document.getElementById('miniCharts');

  // innerHTML replacement below destroys every existing canvas node (even
  // ones for accounts still shown), so every mini Chart.js instance has to
  // be torn down and rebuilt from scratch each render — otherwise Chart.js
  // is left holding a reference to a canvas that's no longer in the DOM.
  Object.keys(chartInstances).forEach(id => {
    if (id.indexOf('miniChart-') === 0) {
      chartInstances[id].destroy();
      delete chartInstances[id];
    }
  });

  // While a text search is active (including the remark-link "group by
  // note" feature), the per-account mini pies would each get re-scoped down
  // to just the 1-2 matching rows — mostly empty/meaningless rings. Simpler
  // to just hide the whole mini-pie row until the search is cleared; the
  // combined pie above still reflects the search results.
  if (searchQuery) {
    container.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  container.style.display = '';

  const accountsToShow = activeAccountFilter === 'All' ? MINI_PIE_ACCOUNTS : [activeAccountFilter];
  container.classList.toggle('zoomed', activeAccountFilter !== 'All');

  container.innerHTML = accountsToShow.map(a => `
    <div class="mini-chart-card">
      <div class="mini-chart-head"><span>${a}</span><span id="miniTotal-${cssSafe(a)}"></span></div>
      <div class="mini-chart-wrap">
        <canvas id="miniChart-${cssSafe(a)}"></canvas>
        <div class="chart-loading"><div class="spinner"></div></div>
      </div>
      <div class="mini-chart-truebalance" id="miniTrue-${cssSafe(a)}"></div>
      <div class="mini-chart-updated" id="miniTrueUpdated-${cssSafe(a)}"></div>
      ${a === 'TNG' ? `<div class="mini-chart-truebalance" id="miniCardTrue-TNG"></div><div class="mini-chart-updated" id="miniCardTrueUpdated-TNG"></div>` : ''}
    </div>
  `).join('');

  accountsToShow.forEach(a => {
    const acctTxns = allTxns.filter(t => t.account === a);
    renderChartOn('miniChart-' + cssSafe(a), chartTxnsFor(acctTxns), activeSubFilter, {
      totalEl: 'miniTotal-' + cssSafe(a), legend: false
    });
    // On the "All categories" view, the mini pie's number is its Balance
    // (Income minus Expense) for that account, colored green/red by sign,
    // instead of the plain Expense-only total renderChartOn just wrote —
    // when a specific category is selected, leave that as-is (the
    // category's own subtotal for this account is more useful there).
    if (activeFilter === 'All') {
      const { balance } = statsFor(acctTxns);
      const el = document.getElementById('miniTotal-' + cssSafe(a));
      if (el) {
        el.textContent = (balance < 0 ? '-RM' : '+RM') + Math.abs(balance).toFixed(2);
        el.className = balance < 0 ? 'negative' : 'positive';
      }
    }
    // True running balance — the real account balance (anchor + every
    // transaction since), not the Income-Expense "Balance" stat above.
    // Only shows for accounts with an anchor set (see trueBalanceFor()) —
    // Cash intentionally has none, so it just shows nothing here.
    const trueEl = document.getElementById('miniTrue-' + cssSafe(a));
    if (trueEl) {
      const tb = trueBalanceFor(a);
      trueEl.textContent = tb === null ? '' : 'Balance: RM' + tb.toFixed(2);
    }
    const trueUpdatedEl = document.getElementById('miniTrueUpdated-' + cssSafe(a));
    if (trueUpdatedEl) {
      const anchor = accountBalances.find(b => b.account === a);
      trueUpdatedEl.textContent = anchor ? formatAnchorDate(anchor.asOfDate) : '';
    }
    // TNG's physical Card balance (separate pseudo-account) shows as a
    // second line right under the eWallet Balance line — see the
    // "TNG Card Top-up" note on CATEGORY_OPTIONS.
    if (a === 'TNG') {
      const cardEl = document.getElementById('miniCardTrue-TNG');
      if (cardEl) {
        const cardBal = trueBalanceFor('TNG Card');
        cardEl.textContent = cardBal === null ? '' : 'Card: RM' + cardBal.toFixed(2);
      }
      const cardUpdatedEl = document.getElementById('miniCardTrueUpdated-TNG');
      if (cardUpdatedEl) {
        const cardAnchor = accountBalances.find(b => b.account === 'TNG Card');
        cardUpdatedEl.textContent = cardAnchor ? formatAnchorDate(cardAnchor.asOfDate) : '';
      }
    }
  });
}

// Fills in the Expense/Income/Balance trio (shown only on the "Overall" —
// i.e. all-categories — view) and toggles it against the plain single RM
// total renderChartOn already wrote for the "By type" (one category
// selected) view.
function updateBigStats(base) {
  const statsEl = document.getElementById('chartStats');
  const totalEl = document.getElementById('chartTotal');
  if (activeFilter !== 'All') {
    statsEl.style.display = 'none';
    totalEl.style.display = '';
    return;
  }
  totalEl.style.display = 'none';
  statsEl.style.display = 'flex';
  const { expense, income, balance } = statsFor(base);
  document.getElementById('statExpense').textContent = 'RM' + expense.toFixed(2);
  document.getElementById('statIncome').textContent = 'RM' + income.toFixed(2);
  const balEl = document.getElementById('statBalance');
  balEl.textContent = (balance < 0 ? '-RM' : '+RM') + Math.abs(balance).toFixed(2);
  balEl.className = 'stat-value ' + (balance < 0 ? 'negative' : 'positive');
}

const ALL_CATEGORIES = ['Car', 'Shopping', 'Food', 'Entertainment', 'Housing', 'Other', 'Transfer', 'Income'];

// Top-level "which real-world account" filter — All / TNG / HL Bank / PBank
// — a separate dimension from the category filters below it. Which account
// something belongs to is orthogonal to what it was spent on, so this is
// its own chip row rather than folded into the category one.
function renderAccountFilters() {
  const accounts = ['All'].concat(ACCOUNTS);
  document.getElementById('accountfilters').innerHTML = accounts.map(a =>
    `<div class="filter-chip ${a === activeAccountFilter ? 'active' : ''}" data-acct="${a}">${a}</div>`
  ).join('');
  document.querySelectorAll('#accountfilters .filter-chip').forEach(el => {
    el.onclick = () => { activeAccountFilter = el.dataset.acct; render(); };
  });
}

// Only shows a category chip if the currently-selected account actually has
// at least one transaction in it — e.g. PBank has no Shopping, so that
// chip just doesn't appear while PBank is selected, instead of showing an
// always-empty category. Recomputed every render() since it depends on
// accountTxns (which changes whenever the Account filter changes).
function renderFilters(accountTxns) {
  const present = new Set(accountTxns.map(t => t.category));
  // If the category you had selected isn't available for the account you
  // just switched to, fall back to All rather than showing an empty list.
  if (activeFilter !== 'All' && !present.has(activeFilter)) {
    activeFilter = 'All';
    activeSubFilter = 'All';
  }
  const cats = ['All'].concat(ALL_CATEGORIES.filter(c => present.has(c)));
  document.getElementById('filters').innerHTML = cats.map(c =>
    `<div class="filter-chip ${c === activeFilter ? 'active' : ''}" data-cat="${c}">${c}</div>`
  ).join('');
  document.querySelectorAll('#filters .filter-chip').forEach(el => {
    el.onclick = () => { activeFilter = el.dataset.cat; activeSubFilter = 'All'; render(); };
  });
}

// Second row of chips shown only when the active category has subtags (Car,
// Housing, Other) — e.g. selecting Car reveals Toll/Parking/Fuel/Service/Ride
// so you can drill into just one without leaving the category. Same idea as
// renderFilters() hiding unused category chips per account: a subtag chip
// only shows if the current account+category slice actually has a row with
// it (e.g. PBank has no "Ride" rows, so that chip won't appear while PBank
// is selected), rather than always showing every subtag the category could
// ever have. categoryTxns is the account+category-filtered set from render()
// (before any subtag filter is applied), so "present" reflects real data.
function renderSubFilters(categoryTxns) {
  const el = document.getElementById('subfilters');
  const possible = SUBTAGS_BY_CATEGORY[activeFilter];
  if (!possible || !possible.length) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  const present = new Set((categoryTxns || []).map(t => t.subTag).filter(Boolean));
  (categoryTxns || []).forEach(t => { if (t.extraTag) present.add(t.extraTag); });
  const subtags = possible.filter(s => present.has(s));
  if (!subtags.length) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  // If the subtag you had selected isn't available anymore (e.g. you just
  // switched account), fall back to "All" rather than showing an empty list.
  if (activeSubFilter !== 'All' && !present.has(activeSubFilter)) {
    activeSubFilter = 'All';
  }
  el.style.display = 'flex';
  const opts = ['All'].concat(subtags);
  el.innerHTML = opts.map(s =>
    `<div class="filter-chip ${s === activeSubFilter ? 'active' : ''}" data-sub="${s}">${s}</div>`
  ).join('');
  el.querySelectorAll('.filter-chip').forEach(chip => {
    chip.onclick = () => { activeSubFilter = chip.dataset.sub; render(); };
  });
}

// Combines date + time (when present) into one sortable timestamp, so
// same-day transactions order correctly instead of tying on date alone.
function txnTimestamp(t) {
  return new Date(t.date + 'T' + (t.time || '00:00') + ':00').getTime();
}

function sortTxns(txns) {
  const sorted = [...txns];
  if (sortMode === 'date_desc') sorted.sort((a, b) => txnTimestamp(b) - txnTimestamp(a));
  else if (sortMode === 'date_asc') sorted.sort((a, b) => txnTimestamp(a) - txnTimestamp(b));
  else if (sortMode === 'amount_desc') sorted.sort((a, b) => Number(b.amount) - Number(a.amount));
  else if (sortMode === 'amount_asc') sorted.sort((a, b) => Number(a.amount) - Number(b.amount));
  return sorted;
}

function groupKeyFor(t) {
  if (groupMode === 'day') return new Date(t.date).toDateString();
  if (groupMode === 'category') return t.category + (t.subTag ? ' · ' + t.subTag : '');
  if (groupMode === 'merchant') return t.merchant || t.notes || 'Unknown';
  return '__all__';
}

function render() {
  renderAccountFilters();
  // Account filter (All/TNG/HL Bank/PBank) narrows the pool everything else
  // below operates on, same as how the category filter narrows further.
  const accountTxns = activeAccountFilter === 'All' ? allTxns : allTxns.filter(t => t.account === activeAccountFilter);
  renderFilters(accountTxns);
  const categoryTxns = activeFilter === 'All' ? accountTxns : accountTxns.filter(t => t.category === activeFilter);
  renderSubFilters(categoryTxns);
  let filtered = categoryTxns;
  if (activeFilter !== 'All' && activeSubFilter !== 'All') {
    // A row matches either its primary subTag or its secondary extraTag
    // (see attachExtraTagHandlers()) — e.g. a Housing > Rent row also
    // tagged "+ WiFi" shows up under both the Rent and WiFi chips, even
    // though it's only counted once in totals/pie since subTag itself
    // never changes.
    filtered = filtered.filter(t => (t.subTag || '') === activeSubFilter || t.extraTag === activeSubFilter);
  }
  // Free-text search over merchant/notes/remark/subtag — narrows the list
  // (and the totals below, same as the category filters do) to whatever
  // matches, e.g. "grab" or "lunch with ali".
  filtered = searchFilter(filtered);
  // On the "All" view, keep Transfer out of the totals cards so wallet
  // top-ups/sends/receipts don't inflate spend numbers. Selecting the
  // Transfer chip directly still shows its own totals as normal, and the
  // transaction list below always shows everything in `filtered` so those
  // rows stay visible.
  const summaryTxns = activeFilter === 'All'
    ? filtered.filter(t => !NON_SPEND_CATEGORIES.includes(t.category))
    : filtered;
  renderTotals(summaryTxns);
  // The pies (combined + per-account) are computed independently from
  // allTxns/each account's own slice — see renderCharts() — so the account
  // filter chips never touch the combined pie, only which mini pie(s) show.
  renderCharts();

  if (!filtered.length) {
    document.getElementById('list').innerHTML = '<div class="empty">No transactions yet.</div>';
    return;
  }

  const sorted = sortTxns(filtered);

  if (groupMode === 'none') {
    let html = '<div class="day-group">';
    sorted.forEach(t => { html += renderTxnRow(t); });
    html += '</div>';
    document.getElementById('list').innerHTML = html;
    attachCatSelectHandlers();
    attachExtraTagHandlers();
    attachRemarkHandlers();
    attachLinkHandlers();
    return;
  }

  const groups = {};
  const order = [];
  sorted.forEach(t => {
    const key = groupKeyFor(t);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(t);
  });

  let html = '';
  order.forEach(key => {
    const groupTotal = groups[key].reduce((s, t) => s + spendAmount(t), 0);
    html += `<div class="day-group"><div class="day-header"><span>${key}</span><span>RM${groupTotal.toFixed(2)}</span></div>`;
    groups[key].forEach(t => { html += renderTxnRow(t); });
    html += `</div>`;
  });
  document.getElementById('list').innerHTML = html;
  attachCatSelectHandlers();
  attachExtraTagHandlers();
  attachRemarkHandlers();
  attachLinkHandlers();
}

// A "Transfer to Wallet" row's merchant field is either a real person's name
// (TNG recorded who the money went to — e.g. "MUSRIYAH") or the generic
// literal text "Fund Transfer" (no name available). When a real name is
// present, show it in parens next to the category/subtag it landed in, e.g.
// "Parking (MUSRIYAH)" or "To Others (SAW THAN ZAW OO)", so the row reads
// clearly instead of just showing a bare name with no context. Rows with no
// real name (or any other transaction type) fall back to the normal
// merchant/notes title.
function txnTitle(t) {
  const merchant = (t.merchant || '').trim();
  if (t.type === 'Transfer to Wallet' && merchant && merchant.toUpperCase() !== 'FUND TRANSFER') {
    const label = t.subTag || t.category;
    return `${label} (${merchant})`;
  }
  return t.merchant || t.notes || 'Unknown';
}

// Real direction of money for this row: 'in' or 'out'. Prefers an explicit
// t.flow (set by the Bank A/B parsers, which know the real debit/credit
// column at import time, and backfilled onto older rows by
// ensureFlowColumn()). Falls back to a category/subtag default for rows
// that somehow still have no flow value — real spend is always 'out',
// Income/Card Reload/From Others are always 'in', To Others is always
// 'out', and anything else defaults to 'in'.
function txnFlow(t) {
  if (t.flow === 'in' || t.flow === 'out') return t.flow;
  if (t.category === 'Income') return 'in';
  if (t.category === 'Transfer') {
    if (t.subTag === 'To Others') return 'out';
    return 'in';
  }
  return 'out';
}

// The amount to count toward a real-spend category's total. Normally just
// the raw amount (money going out), but if a transaction was recategorized
// INTO a spend category (e.g. Food) while its flow is still "in" — like a
// friend's reimbursement tagged the same category as the expense it's
// paying back, via the remark-link feature — it NETS OFF that category's
// total instead of inflating it, so Food shows your true out-of-pocket cost
// rather than double-counting both the spend and the refund. Only applies
// to real spend categories; Transfer/Income keep the plain sum since
// "in"/"out" already carries its own separate meaning there (e.g. Card
// Reload in vs Internal out).
function spendAmount(t) {
  const amt = Number(t.amount || 0);
  if (NON_SPEND_CATEGORIES.includes(t.category)) return amt;
  return txnFlow(t) === 'in' ? -amt : amt;
}

// Sign + CSS class for the amount text. Real spend = red minus. Money
// genuinely coming in (Card Reload, From Others, Income) = green plus.
// To Others = red minus — it's leaving the account, even though "Transfer"
// as a category isn't counted as spend. Internal (movement between your own
// TNG/Bank A/Bank B accounts) is always yellow, with the sign following the
// real direction of that specific row.
function txnSignInfo(t) {
  const flow = txnFlow(t);
  const sign = flow === 'in' ? '+' : '-';
  if (t.category === 'Transfer' && t.subTag === 'Internal') {
    return { sign, cls: 'amount internal' };
  }
  return { sign, cls: flow === 'in' ? 'amount in' : 'amount' };
}

// Turns a name string into Title Case, e.g. "KHEK WEI KEAN" -> "Khek Wei
// Kean" — used only for the small blue transfer-context hint so it reads
// like a name instead of shouting in all caps.
function titleCaseName(s) {
  return (s || '').trim().split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}

// If a row's category has been manually changed AWAY from Transfer (e.g. a
// "To Others (KHEK WEI KEAN)" QR payment turned out to really be a Food
// purchase, so you recategorized it), the original transfer context would
// otherwise disappear from view once the category no longer says Transfer.
// This pulls that context back out of the Merchant text — which doesn't
// change when you recategorize — as a small hint like "(to Khek)", so you
// don't lose track of where the money actually went/came from. Returns null
// while the row is still shown as Transfer (no hint needed) or if the
// merchant text doesn't match a known transfer pattern.
function transferHint(t) {
  if (t.category === 'Transfer') return null;
  const m = (t.merchant || '').trim();
  let match;
  if ((match = m.match(/^To Others \((.+?)\)/i))) return 'to ' + titleCaseName(match[1]);
  if ((match = m.match(/^From Others \((.+?)\)/i))) return 'from ' + titleCaseName(match[1]);
  if (/^To HL Bank\b/i.test(m)) return 'to HL Bank';
  if (/^From HL Bank\b/i.test(m)) return 'from HL Bank';
  if (/^To PBank\b/i.test(m)) return 'to PBank';
  if (/^From PBank\b/i.test(m)) return 'from PBank';
  if (/^To TNG\b/i.test(m)) return 'to TNG';
  if ((match = m.match(/^Internal Transfer(?:\s*\((.+?)\))?/i))) {
    return match[1] ? ('internal · ' + titleCaseName(match[1])) : 'internal transfer';
  }
  return null;
}

// Options for the small secondary "+ tag" select next to the main category
// dropdown — offers every OTHER subtag in the same category (excluding the
// row's own primary subTag), so e.g. a Housing > Rent row can also be
// tagged "+ WiFi" when one payment genuinely covers both. Returns '' if the
// category doesn't have at least one other subtag to offer.
function extraTagOptionsHtml(category, subTag, extraTag) {
  const subtags = (SUBTAGS_BY_CATEGORY[category] || []).filter(s => s !== subTag);
  if (!subtags.length) return '';
  const opts = ['<option value="">+ tag…</option>'].concat(
    subtags.map(s => `<option value="${s}"${s === extraTag ? ' selected' : ''}>+ ${s}</option>`)
  );
  return opts.join('');
}

function renderTxnRow(t) {
  const dotClass = ALL_CATEGORIES.includes(t.category) ? t.category : 'Custom';
  const { sign, cls: amtClass } = txnSignInfo(t);
  const remarkHtml = t.remark
    ? `<div class="remark" data-remark="${escapeHtml(t.remark)}" title="Click to see every transaction sharing this note">${escapeHtml(t.remark)}</div>`
    : '';
  const hint = transferHint(t);
  const hintHtml = hint ? `<div class="transfer-hint">(${escapeHtml(hint)})</div>` : '';
  const extraOpts = extraTagOptionsHtml(t.category, t.subTag, t.extraTag);
  const extraSelectHtml = extraOpts
    ? `<select class="txn-extratag-select${t.extraTag ? ' has-extra' : ''}" data-row="${t.row}">${extraOpts}</select>`
    : '';
  return `
    <div class="txn">
      <div class="dot ${dotClass}"></div>
      <div class="info">
        <div class="merchant">${txnTitle(t)}</div>
        ${hintHtml}
        <div class="meta">${new Date(t.date).toLocaleDateString()} · ${t.time || 'No time record'} · ${t.account || 'TNG'}</div>
        ${remarkHtml}
        <div class="cat-select-row">

        <button class="remark-btn${t.remark ? ' has-remark' : ''}" data-row="${t.row}" title="Add/edit remark">✎</button>
      </div>
    </div>`;
}

// Lets you reassign a transaction's category/subtag right from the list
// (e.g. fixing an "Unsure" row, or moving a Pokemon Go charge from
// Entertainment to Subscription) without re-adding it. Changing the primary
// category/subtag also clears any secondary "+ tag" (extraTag), since it
// belonged to the old category's subtag set and may no longer make sense.
function attachCatSelectHandlers() {
  document.querySelectorAll('.txn-cat-select').forEach(el => {
    el.onchange = async () => {
      const row = Number(el.dataset.row);
      const [category, subTag] = el.value.split('|');
      const t = allTxns.find(x => x.row === row);
      const hadExtraTag = t && t.extraTag;
      if (t) { t.category = category; t.subTag = subTag; t.extraTag = ''; }
      el.disabled = true;
      await callApi('updateCategory', { row, category, subTag });
      if (hadExtraTag) await callApi('updateExtraTag', { row, extraTag: '' });
      renderApp();
    };
  });
}

// Lets a transaction that genuinely covers two things at once (e.g. one
// payment for both Housing > Rent and Housing > WiFi) also carry a second
// subtag from the same category — the row still counts once, under its one
// primary subTag, but now also shows up when you filter the list by either
// subtag (see the "present" set in renderSubFilters() and the match in
// render()). Only offered when the category has more than one subtag to
// choose from (see extraTagOptionsHtml()).
function attachExtraTagHandlers() {
  document.querySelectorAll('.txn-extratag-select').forEach(el => {
    el.onchange = async () => {
      const row = Number(el.dataset.row);
      const extraTag = el.value;
      const t = allTxns.find(x => x.row === row);
      if (t) t.extraTag = extraTag;
      el.disabled = true;
      await callApi('updateExtraTag', { row, extraTag });
      renderApp();
    };
  });
}

// Lets you attach a free-text remark to any transaction (e.g. "lunch with
// Ali", "car aircon regas") — separate from Notes, which holds
// system/import-derived text. Uses a plain prompt() for a lightweight,
// one-tap edit rather than an inline text field.
function attachRemarkHandlers() {
  document.querySelectorAll('.remark-btn').forEach(el => {
    el.onclick = async () => {
      const row = Number(el.dataset.row);
      const t = allTxns.find(x => x.row === row);
      const val = window.prompt('Remark for this transaction:', (t && t.remark) || '');
      if (val === null) return; // cancelled
      if (t) t.remark = val;
      await callApi('updateRemark', { row, remark: val });
      renderApp();
    };
  });
}

// Manual "link" for grouping transactions that belong together even across
// different accounts/categories — e.g. you pay a group lunch on TNG, then
// each friend's reimbursement lands as a separate Transfer row, maybe in a
